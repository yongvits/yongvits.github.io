<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WebGL Ferrofluid Speaker v2.3</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: -apple-system, sans-serif; color: #fff; user-select: none; }
        canvas { display: block; }
        
        .ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; box-sizing: border-box; z-index: 10; }
        .ui-row { display: flex; justify-content: space-between; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
        .ui-text { font-size: 12px; line-height: 1.4; opacity: 0.9; background: rgba(0, 0, 0, 0.5); padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); }
        .ui-text span { display: block; }

        #start-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(5, 5, 5, 0.98); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; pointer-events: auto; transition: opacity 0.5s ease; }
        #start-btn { padding: 15px 40px; font-size: 18px; background: rgba(0, 255, 255, 0.05); color: #00ffff; border: 2px solid #00ffff; border-radius: 30px; cursor: pointer; outline: none; transition: all 0.3s ease; box-shadow: 0 0 25px rgba(0, 255, 255, 0.4); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        #start-btn:hover { background: rgba(0, 255, 255, 0.2); transform: scale(1.05); }
        .instruction { margin-top: 20px; font-size: 14px; color: #aaa; text-align: center; line-height: 1.6; }

        .controls-wrapper { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 20; width: 90%; max-width: 420px; max-height: 60vh; overflow-y: auto; padding-right: 5px; }
        .controls-wrapper::-webkit-scrollbar { width: 4px; }
        .controls-wrapper::-webkit-scrollbar-thumb { background: rgba(0, 255, 255, 0.5); border-radius: 4px; }

        .panel-box { display: flex; gap: 10px; background: rgba(10, 10, 10, 0.85); padding: 15px; border-radius: 20px; border: 1px solid rgba(0, 255, 255, 0.2); backdrop-filter: blur(15px); pointer-events: auto; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .panel-col { flex-direction: column; align-items: stretch; gap: 12px; }

        .input-style, .select-style { background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(0, 255, 255, 0.3); border-radius: 10px; color: #fff; outline: none; font-size: 13px; padding: 8px 12px; width: 100%; box-sizing: border-box; }
        .select-style { cursor: pointer; }
        .select-style option { background: #111; color: #fff; }

        .btn-style { background: rgba(0, 255, 255, 0.1); color: #00ffff; border: 1px solid rgba(0, 255, 255, 0.4); border-radius: 12px; padding: 10px 15px; cursor: pointer; font-weight: bold; transition: all 0.3s; font-size: 12px; flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; text-shadow: 0 0 5px rgba(0,255,255,0.5); }
        .btn-style:hover { background: rgba(0, 255, 255, 0.25); box-shadow: 0 0 15px rgba(0,255,255,0.3); }
        .btn-style.active { background: rgba(0, 255, 255, 0.9); color: #000; box-shadow: 0 0 20px rgba(0,255,255,0.8); text-shadow: none; }

        .slider-container { display: flex; flex-direction: column; gap: 5px; width: 100%; }
        .slider-row { display: flex; justify-content: space-between; font-size: 11px; color: #ccc; text-transform: uppercase; letter-spacing: 1px; }
        .slider-row span.val { color: #00ffff; font-weight: bold; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #00ffff; cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px #00ffff; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 2px; }

        audio { width: 100%; height: 35px; outline: none; border-radius: 10px; opacity: 0.9; display: none; }
        audio::-webkit-media-controls-panel { background-color: rgba(0, 255, 255, 0.15); }
        audio::-webkit-media-controls-current-time-display, audio::-webkit-media-controls-time-remaining-display { color: #00ffff; }

        .top-right-btns { position: absolute; top: 20px; right: 20px; z-index: 50; display: flex; flex-direction: column; gap: 10px; }
        .top-btn { background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(0, 255, 255, 0.3); color: #00ffff; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 12px; transition: all 0.3s; backdrop-filter: blur(5px); }
        .top-btn:hover { background: rgba(0, 255, 255, 0.2); }
        .top-btn.active { background: rgba(0, 255, 255, 0.6); color: #000; font-weight: bold; }

        body.ui-hidden .ui-container, body.ui-hidden .controls-wrapper { display: none !important; }
        body.ui-hidden .top-right-btns { opacity: 0.3; }
        body.ui-hidden .top-right-btns:hover { opacity: 1.0; }
    </style>

</head>
<body>

            <div style="display: flex; gap: 10px; margin-top: 5px;">

                    <select id="color-mode" class="select-style">

        <div class="panel-box panel-col" style="gap: 10px;">

                <button id="mic-btn" class="btn-style">🎙️ เปิดไมค์</button>
                <button id="file-btn" class="btn-style">🎵 โหลดเพลง MP3</button>
                <input type="file" id="audio-upload" accept="audio/*" style="display: none;">
            </div>
            <audio id="audio-player" controls></audio>
        </div>

        <div class="panel-box" style="gap: 8px;">
            <button id="ai-btn" class="btn-style" style="width: 100%; padding: 10px 15px;">🎲 สุ่มบรรยากาศ (Random)</button>
        </div>
    </div>

    <!-- Main Logic Script -->
    <script>
        // --- GLSL Simplex 3D Noise สำหรับ GPU Physics ---
        const snoise3D = `
            vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x, 289.0);}
            vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314 * r;}
            float snoise(vec3 v){ 
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + 1.0 * C.xxx;
                vec3 x2 = x0 - i2 + 2.0 * C.xxx;
                vec3 x3 = x0 - 1.0 + 3.0 * C.xxx;
                i = mod(i, 289.0 ); 
                vec4 p = permute( permute( permute( 
                            i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                        + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                        + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                float n_ = 1.42857142857143; 
                vec3  ns = n_ * D.wyz - D.xzx;
                vec4 j = p - 49.0 * floor(p * ns.z *ns.z);
                vec4 x_ = floor(j * ns.z);
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ *ns.x + ns.yyyy;
                vec4 y = y_ *ns.x + ns.yyyy;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }
        `;

        // --- Core Variables ---
        let scene, camera, renderer;
        let instancedMesh;
        const MAX_INSTANCES = 80000;
        
        let roomMesh, floorGrid;
        let envTexture = null;

        // Custom Post-Processing (รันบน GPU พื้นฐาน ไม่ง้อไฟล์เสริม)
        let renderTarget, postScene, postCamera, postMaterial;

        // Custom Uniforms สำหรับฝังใน PBR Shader
        const customUniforms = {
            uTime: { value: 0 },
            uBass: { value: 0 },
            uMid: { value: 0 },
            uHigh: { value: 0 },
            uKick: { value: 0 },
            uColorBass: { value: new THREE.Color(0xffaa00) },
            uColorHigh: { value: new THREE.Color(0xffffff) },
            uColorVocal: { value: new THREE.Color(0xffdd88) },
            uGyroShift: { value: new THREE.Vector2(0, 0) } // Gyro Gravity
        };

        const colorPresets = {
            gold:   { base: 0xaa8800, bass: 0xffaa00, vocal: 0xffdd88, high: 0xffffff },
            cyber:  { base: 0x111122, bass: 0xff00ff, vocal: 0x8800ff, high: 0x00ffff },
            fire:   { base: 0x220500, bass: 0xff2200, vocal: 0xff8800, high: 0xffff00 },
            nature: { base: 0x002200, bass: 0x00ff44, vocal: 0x00ffff, high: 0xaaff00 },
            dark:   { base: 0x050505, bass: 0xff0000, vocal: 0x0000ff, high: 0xffffff }
        };

        // Audio & Animation State
        let audioCtx, analyser, dataArray;
        let currentAudioSource = null;
        let isMicActive = false;
        let bassAvg = 0;
        let sceneRotationTarget = 0;
        let isAutoRotate = true;

        const roomWidth = 40, roomHeight = 25, roomDepth = 40;
        let targetCameraPos = new THREE.Vector3(0, 0, roomDepth / 2 - 2);
        let useGyro = false;
        let frames = 0, lastTime = performance.now();

        // UI Refs
        const fpsElement = document.getElementById('fps');
        const gyroStatusElement = document.getElementById('gyro-status');
        const aiStatus = document.getElementById('ai-status');

        init();
        animate();

        function createDefaultHDRI() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 512);
            grad.addColorStop(0, '#001122'); grad.addColorStop(0.5, '#004488'); grad.addColorStop(1, '#000000');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 512);
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            for(let i=0; i<300; i++) {
                ctx.beginPath(); ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*1.5, 0, Math.PI*2); ctx.fill();
            }
            const tex = new THREE.Texture(canvas);
            tex.needsUpdate = true;
            tex.mapping = THREE.EquirectangularReflectionMapping;
            return tex;
        }

        function loadHDRI(url) {
            aiStatus.innerText = "กำลังประมวลผลแสง HDRI...";
            new THREE.TextureLoader().load(url, (tex) => {
                tex.mapping = THREE.EquirectangularReflectionMapping;
                envTexture = tex;
                scene.environment = envTexture; 
                if(roomMesh && roomMesh.material.map !== undefined) {
                    roomMesh.material.map = envTexture;
                    roomMesh.material.needsUpdate = true;
                }
                aiStatus.innerText = "ระบบแสง 360 พร้อมใช้งาน";
            }, undefined, (err) => {
                aiStatus.innerText = "โหลด HDRI ล้มเหลว";
            });
        }

        function setRoomStyle(style) {
            if(roomMesh) scene.remove(roomMesh);
            if(floorGrid) scene.remove(floorGrid);
            if(!envTexture) {
                envTexture = createDefaultHDRI();
                scene.environment = envTexture; 
            }

            let geo, mat;
            if(style === 'dark-box') {
                geo = new THREE.BoxGeometry(roomWidth, roomHeight, roomDepth);
                mat = new THREE.MeshStandardMaterial({color: 0x050505, side: THREE.BackSide, roughness: 0.3, metalness: 0.8});
                scene.fog = new THREE.FogExp2(0x020202, 0.02);
                renderer.setClearColor(0x020202);
                floorGrid = new THREE.GridHelper(roomWidth, 20, 0x00ffff, 0x111111);
                floorGrid.material.opacity = 0.2;
            } else if (style === 'white-grid') {
                geo = new THREE.BoxGeometry(roomWidth, roomHeight, roomDepth);
                mat = new THREE.MeshStandardMaterial({color: 0xffffff, side: THREE.BackSide, roughness: 0.8, metalness: 0.1});
                scene.fog = new THREE.FogExp2(0xcccccc, 0.015);
                renderer.setClearColor(0xcccccc);
                floorGrid = new THREE.GridHelper(roomWidth, 20, 0x888888, 0xbbbbbb);
                floorGrid.material.opacity = 0.5;
            } else if (style === 'sphere-hdri') {
                geo = new THREE.SphereGeometry(roomWidth * 1.5, 64, 40);
                geo.scale(-1, 1, 1); 
                mat = new THREE.MeshBasicMaterial({ map: envTexture });
                scene.fog = new THREE.FogExp2(0x000000, 0.002);
                renderer.setClearColor(0x000000);
                floorGrid = null;
            }
            
            roomMesh = new THREE.Mesh(geo, mat);
            scene.add(roomMesh);
            
            if(floorGrid) {
                floorGrid.position.y = -roomHeight / 2 + 0.1;
                floorGrid.material.transparent = true;
                scene.add(floorGrid);
            }
        }

        function init() {
            // Scene & Renderer
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, cameraZBase);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" }); 
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // --- Custom Post-Processing (รันเอง ไม่ง้อ EffectComposer) ---
            renderTarget = new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight);
            postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            postScene = new THREE.Scene();

            postMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    tDiffuse: { value: renderTarget.texture },
                    uTime: { value: 0 },
                    uKick: { value: 0 }
                },
                vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
                fragmentShader: `
                    uniform sampler2D tDiffuse;
                    uniform float uTime;
                    uniform float uKick;
                    varying vec2 vUv;
                    
                    float rand(vec2 co){ return fract(sin(dot(co.xy ,vec2(12.9898,78.233))) * 43758.5453); }

                    void main() {
                        vec2 uv = vUv;
                        float dist = distance(uv, vec2(0.5));
                        
                        // 1. Chromatic Aberration (ภาพสั่นสีแยกเวลากระเดื่องตี)
                        float ab = 0.002 + uKick * 0.02;
                        vec2 offset = vec2(ab * dist, 0.0);
                        vec4 cr = texture2D(tDiffuse, uv + offset);
                        vec4 cga = texture2D(tDiffuse, uv);
                        vec4 cb = texture2D(tDiffuse, uv - offset);
                        vec3 color = vec3(cr.r, cga.g, cb.b);
                        
                        // 2. Custom Fast Bloom (แสงเรืองวาบ)
                        vec3 bloom = vec3(0.0);
                        vec2 bSize = vec2(0.008);
                        bloom += texture2D(tDiffuse, uv + vec2(bSize.x, 0.0)).rgb;
                        bloom += texture2D(tDiffuse, uv + vec2(-bSize.x, 0.0)).rgb;
                        bloom += texture2D(tDiffuse, uv + vec2(0.0, bSize.y)).rgb;
                        bloom += texture2D(tDiffuse, uv + vec2(0.0, -bSize.y)).rgb;
                        
                        // ผสม Bloom กลับเข้าไปเฉพาะส่วนที่สว่าง
                        float lum = dot(bloom/4.0, vec3(0.299, 0.587, 0.114));
                        color += (bloom/4.0) * smoothstep(0.2, 0.8, lum) * (1.5 + uKick * 2.0);
                        
                        // 3. Film Grain
                        color += rand(uv * (uTime + 1.0)) * 0.04;
                        
                        // 4. Vignette
                        color *= smoothstep(1.0, 0.3, dist * 0.8);
                        
                        gl_FragColor = vec4(color, 1.0);
                    }
                `
            });
            postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMaterial));

            // Setup Room
            setRoomStyle('dark-box');
            
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5); 
            scene.add(ambientLight);

            // Create GPU Instanced Particles
            createGPUInstancedParticles();

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousemove', onDocumentMouseMove, false);
            
            setupUIHandlers();
        }

        function createGPUInstancedParticles() {
            // Low Poly Sphere (Premium Crystal look)
            const geometry = new THREE.IcosahedronGeometry(0.08, 0); 
            
            // PBR Material
            const material = new THREE.MeshStandardMaterial({
                color: 0xaa8800, // Gold base
                roughness: 0.15,
                metalness: 1.0,  // เงาวับสะท้อน
            });

            material.onBeforeCompile = (shader) => {
                shader.uniforms.uTime = customUniforms.uTime;
                shader.uniforms.uBass = customUniforms.uBass;
                shader.uniforms.uMid = customUniforms.uMid;
                shader.uniforms.uHigh = customUniforms.uHigh;
                shader.uniforms.uKick = customUniforms.uKick;
                shader.uniforms.uColorBass = customUniforms.uColorBass;
                shader.uniforms.uColorHigh = customUniforms.uColorHigh;
                shader.uniforms.uColorVocal = customUniforms.uColorVocal;
                shader.uniforms.uGyroShift = customUniforms.uGyroShift; // รับค่า Gyro จาก CPU

                shader.vertexShader = `
                    uniform float uTime;
                    uniform float uBass;
                    uniform float uMid;
                    uniform float uHigh;
                    uniform float uKick;
                    uniform vec2 uGyroShift;
                    varying float vSpike;
                    ${snoise3D}
                    ${shader.vertexShader}
                `;

                shader.vertexShader = shader.vertexShader.replace(
                    '#include <project_vertex>',
                    `
                    vec3 iPos = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
                    vec3 dir = normalize(iPos + vec3(0.0001)); 
                    
                    // 3D Noise for Spikes
                    float n1 = snoise(dir * 2.0 + uTime * 0.4);
                    float n2 = snoise(dir * 4.0 - uTime * 0.8);
                    
                    // Bass & Kick Burst
                    float spike = smoothstep(0.2, 0.9, n1) * (uBass * 1.5 + uKick * 3.5);
                    // Mid Ripple
                    float ripple = n2 * uMid * 0.6;
                    
                    vec3 offset = dir * (spike + ripple);
                    vec3 transformed = vec3(position) * (1.0 + uKick * 0.6 + uBass * 0.2);
                    
                    mat4 modMatrix = instanceMatrix;
                    modMatrix[3][0] += offset.x + uGyroShift.x; // ดึงไปตาม Gyro แกน X
                    modMatrix[3][1] += offset.y + uGyroShift.y; // ดึงไปตาม Gyro แกน Y
                    modMatrix[3][2] += offset.z;
                    
                    vec4 mvPosition = modelViewMatrix * modMatrix * vec4( transformed, 1.0 );
                    gl_Position = projectionMatrix * mvPosition;
                    
                    vSpike = spike;
                    `
                );

                shader.fragmentShader = `
                    uniform vec3 uColorBass;
                    uniform vec3 uColorHigh;
                    uniform vec3 uColorVocal;
                    uniform float uBass;
                    uniform float uMid;
                    uniform float uHigh;
                    uniform float uKick;
                    varying float vSpike;
                    ${shader.fragmentShader}
                `;

                shader.fragmentShader = shader.fragmentShader.replace(
                    'vec4 diffuseColor = vec4( diffuse, opacity );',
                    `
                    vec3 dynColor = diffuse;
                    // ผสมสีตามความถี่เสียงและรอยหยัก
                    dynColor = mix(dynColor, uColorBass, smoothstep(0.0, 1.0, vSpike * 1.5));
                    dynColor = mix(dynColor, uColorVocal, uMid * 0.6);
                    dynColor += uColorHigh * (uHigh * 0.8);
                    
                    dynColor *= (1.0 + uKick * 2.0); // สว่างวาบเวลาเบสกระแทก
                    vec4 diffuseColor = vec4( dynColor, opacity );
                    `
                );
            };

            instancedMesh = new THREE.InstancedMesh(geometry, material, MAX_INSTANCES);
            const dummy = new THREE.Object3D();
            const goldenAngle = Math.PI * (3 - Math.sqrt(5));

            for (let i = 0; i < MAX_INSTANCES; i++) {
                let y = 1 - (i / (MAX_INSTANCES - 1)) * 2;
                let radiusAtY = Math.sqrt(1 - y * y);
                let theta = goldenAngle * i;
                
                let x = Math.cos(theta) * radiusAtY;
                let z = Math.sin(theta) * radiusAtY;
                
                let radius = 2.0 + Math.pow(Math.random(), 2.0) * 3.5; 
                dummy.position.set(x * radius, y * radius, z * radius);
                dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            
            instancedMesh.count = 40000;
            scene.add(instancedMesh);
        }

        function setupUIHandlers() {
            document.getElementById('pt-slider').addEventListener('input', (e) => {
                const count = parseInt(e.target.value);
                document.getElementById('pt-slider-val').innerText = count.toLocaleString();

            document.getElementById('color-mode').addEventListener('change', (e) => {

            document.getElementById('room-mode').addEventListener('change', (e) => {

            });

            document.getElementById('hdri-preset').addEventListener('change', (e) => {
                if(e.target.value === 'default') setRoomStyle('sphere-hdri');
                else loadHDRI(e.target.value);
            });

            document.getElementById('hdri-btn').addEventListener('click', () => document.getElementById('hdri-upload').click());
            document.getElementById('hdri-upload').addEventListener('change', function() {
                if (this.files && this.files[0]) loadHDRI(URL.createObjectURL(this.files[0]));
            });
            
            const toggleUiBtn = document.getElementById('toggle-ui-btn');
            toggleUiBtn.addEventListener('click', () => {
                document.body.classList.toggle('ui-hidden');
                toggleUiBtn.innerText = document.body.classList.contains('ui-hidden') ? "👁️ แสดง UI" : "👁️ ซ่อน UI";
            });

            const toggleRotateBtn = document.getElementById('toggle-rotate-btn');
            toggleRotateBtn.addEventListener('click', () => {
                isAutoRotate = !isAutoRotate;
                toggleRotateBtn.innerText = isAutoRotate ? "🔄 ปิดหมุนอัตโนมัติ" : "🔄 เปิดหมุนอัตโนมัติ";
                if(isAutoRotate) toggleRotateBtn.classList.add('active'); else toggleRotateBtn.classList.remove('active');
            });

            // ปุ่มเริ่มต้น ทำงานร้อยเปอร์เซ็นต์แน่นอน
            document.getElementById('start-btn').addEventListener('click', () => {
                initDeviceOrientation();
                initAudioContext();
                const overlay = document.getElementById('start-overlay');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 500);
            });

            // Random สุ่มสี
            document.getElementById('ai-btn').addEventListener('click', () => {
                const btn = document.getElementById('ai-btn');
                btn.disabled = true;
                aiStatus.innerText = "กำลังจูนสี...";
                document.getElementById('color-mode').value = ""; 

                setTimeout(() => {
                    instancedMesh.material.color.setHSL(Math.random(), 0.8, 0.4);
                    customUniforms.uColorBass.value.setHSL(Math.random(), 0.8, 0.5);
                    customUniforms.uColorVocal.value.setHSL(Math.random(), 0.8, 0.6);
                    customUniforms.uColorHigh.value.setHSL(Math.random(), 0.8, 0.8);
                    
                    const texts = ["พายุคลื่นเสียง", "อวกาศไร้จุดจบ", "แมกม่าเดือดดาล", "มิติควอนตัม", "แสงสะท้อนนีออน"];
                    aiStatus.innerText = texts[Math.floor(Math.random() * texts.length)];
                    btn.disabled = false;
                }, 300);
            });

            const audioUpload = document.getElementById('audio-upload');
            const fileBtn = document.getElementById('file-btn');
            const micBtn = document.getElementById('mic-btn');
            const audioPlayer = document.getElementById('audio-player');

            fileBtn.addEventListener('click', () => audioUpload.click());
            audioUpload.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    audioPlayer.src = URL.createObjectURL(this.files[0]);
                    audioPlayer.style.display = "block"; 
                    audioPlayer.play();
                    setupAudioSource(audioPlayer, false);
                    micBtn.classList.remove('active');
                    fileBtn.classList.add('active');
                    isMicActive = false;

                }
            });

            micBtn.addEventListener('click', async () => {
                if (!isMicActive) {

                }

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }

        function setupAudioSource(sourceNode, isMic) {
            initAudioContext();
            if (currentAudioSource) currentAudioSource.disconnect();
            if (isMic) {
                currentAudioSource = audioCtx.createMediaStreamSource(sourceNode);
                currentAudioSource.connect(analyser);
            } else {
                currentAudioSource = audioCtx.createMediaElementSource(sourceNode);
                currentAudioSource.connect(analyser);
                analyser.connect(audioCtx.destination);
            }
        }

        // --- Gyroscope แนวนอน / แนวตั้ง ---
        function initDeviceOrientation() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') { window.addEventListener('deviceorientation', handleOrientation); useGyro = true; gyroStatusElement.innerText = "Gyro: Active"; }
                }).catch(e => console.error(e));
            } else {
                window.addEventListener('deviceorientation', handleOrientation); useGyro = true; gyroStatusElement.innerText = "Gyro: Active";
            }
        }

        function handleOrientation(event) {
            if (!event.gamma || !event.beta) return;
            let orient = (screen.orientation || {}).angle || window.orientation || 0;
            let x, y;
            if (orient === 90) { x = event.beta; y = -event.gamma - 45; } 
            else if (orient === -90 || orient === 270) { x = -event.beta; y = event.gamma - 45; } 
            else { x = event.gamma; y = event.beta - 45; }

            targetCameraPos.x = (Math.max(-45, Math.min(45, x)) / 45) * 8;
            targetCameraPos.y = -(Math.max(-45, Math.min(45, y)) / 45) * 5;
        }

        function onDocumentMouseMove(event) {
            if (useGyro) return;
            targetCameraPos.x = ((event.clientX - window.innerWidth/2) / (window.innerWidth/2)) * 8;
            targetCameraPos.y = -((event.clientY - window.innerHeight/2) / (window.innerHeight/2)) * 5;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if(renderTarget) renderTarget.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Render Loop ---
        function animate() {
            requestAnimationFrame(animate);
            
            if (analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let bSum=0, mSum=0, hSum=0;
                for(let i=0; i<6; i++) bSum += dataArray[i];
                for(let i=12; i<35; i++) mSum += dataArray[i];
                for(let i=40; i<100; i++) hSum += dataArray[i];
                
                let currentBass = (bSum / 6) / 255.0;
                let currentMid = (mSum / 23) / 255.0;
                let currentHigh = (hSum / 60) / 255.0;
                
                customUniforms.uBass.value += (currentBass - customUniforms.uBass.value) * 0.2;
                customUniforms.uMid.value += (currentMid - customUniforms.uMid.value) * 0.2;
                customUniforms.uHigh.value += (currentHigh - customUniforms.uHigh.value) * 0.2;
                
                bassAvg = bassAvg * 0.9 + currentBass * 0.1;
                if(currentBass > 0.6 && currentBass > bassAvg * 1.3 && customUniforms.uKick.value < 0.1) {
                    customUniforms.uKick.value = 1.0; 
                    sceneRotationTarget += (Math.random() > 0.5 ? 1 : -1) * (0.1 + currentBass * 0.2);
                }
            }
            customUniforms.uKick.value += (0 - customUniforms.uKick.value) * 0.08;

            const t = performance.now() * 0.001;
            customUniforms.uTime.value = t;

            // ส่งค่า Gyro ให้ GPU คำนวณแรงเทไปเทมา
            customUniforms.uGyroShift.value.set(targetCameraPos.x * 0.8, targetCameraPos.y * 0.8);

            camera.position.x += (targetCameraPos.x - camera.position.x) * 0.05;
            camera.position.y += (targetCameraPos.y - camera.position.y) * 0.05;
            camera.lookAt(0, 0, 0); 

            scene.rotation.y += (sceneRotationTarget - scene.rotation.y) * 0.1; 
            if(isAutoRotate) {
                sceneRotationTarget += 0.003; 
                scene.rotation.z = Math.sin(t * 0.5) * 0.1; 
            }

            // 1. Render ลง RenderTarget ก่อน
            renderer.setRenderTarget(renderTarget);
            renderer.render(scene, camera);
            
            // 2. Render ออกหน้าจอ พร้อมใส่ Custom Cinematic Shader (Bloom + Aberration)
            renderer.setRenderTarget(null);
            postMaterial.uniforms.uTime.value = t;
            postMaterial.uniforms.uKick.value = customUniforms.uKick.value;
            renderer.render(postScene, postCamera);

            frames++;
            if (t * 1000 >= lastTime + 1000) {
                fpsElement.innerText = Math.round((frames * 1000) / ((t * 1000) - lastTime));
                frames = 0; lastTime = t * 1000;
            }
        }
    </script>
