<!DOCTYPE html>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Face AR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }

body {
background: #08080f;
color: #dde;
font-family: ‘Space Mono’, monospace;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100dvh;
overflow: hidden;
}

h1 {
font-size: 0.7rem;
letter-spacing: 0.3em;
color: #8080ff;
text-transform: uppercase;
text-shadow: 0 0 16px #8080ff66;
padding: 10px 0 4px;
flex-shrink: 0;
}

#status {
font-size: 0.6rem;
letter-spacing: 0.1em;
color: #8080ff99;
padding: 0 0 6px;
flex-shrink: 0;
}

#container {
position: relative;
width: 100%;
aspect-ratio: 9 / 16;
max-height: calc(100dvh - 110px);
max-width: calc((100dvh - 110px) * 9 / 16);
background: #000;
border: 1px solid #8080ff33;
overflow: hidden;
flex-shrink: 0;
}

/* Video is hidden — we draw it manually onto canvas so both
the mirrored image and AR overlays share one coordinate system */
#video {
position: absolute;
width: 1px; height: 1px;
opacity: 0;
pointer-events: none;
}

#canvas {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
display: block;
}

#log {
position: absolute;
bottom: 6px; left: 6px; right: 6px;
font-size: 0.5rem;
color: #44ff88bb;
pointer-events: none;
line-height: 1.7;
}

#controls {
display: flex;
gap: 6px;
padding: 8px;
width: 100%;
flex-shrink: 0;
}

.btn {
flex: 1;
background: transparent;
border: 1px solid #8080ff55;
color: #aac;
padding: 7px 4px;
font-family: ‘Space Mono’, monospace;
font-size: 0.6rem;
cursor: pointer;
border-radius: 3px;
transition: all 0.15s;
text-align: center;
}
.btn.active, .btn:hover {
background: #8080ff22;
border-color: #8080ff;
color: #fff;
box-shadow: 0 0 10px #8080ff44;
}
</style>

</head>
<body>

<h1>✦ Face AR · Head Tracker</h1>
<div id="status">กำลังเริ่มต้น...</div>

<div id="container">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="canvas"></canvas>
  <div id="log"></div>
</div>

<div id="controls">
  <button class="btn active" data-mode="hat">🎩 หมวก</button>
  <button class="btn" data-mode="glasses">🕶️ แว่น</button>
  <button class="btn" data-mode="crown">👑 มงกุฎ</button>
  <button class="btn" data-mode="mesh">🔷 Mesh</button>
</div>

<script>
// ─── Logger ──────────────────────────────────────────────────────
const logEl    = document.getElementById('log');
const statusEl = document.getElementById('status');
const lines    = [];
function dbg(msg, color) {
  lines.push(`<span style="color:${color||'#44ff88bb'}">${msg}</span>`);
  if (lines.length > 5) lines.shift();
  logEl.innerHTML = lines.join('<br>');
}
function setStatus(msg, state) {
  statusEl.textContent = msg;
  statusEl.style.color = state === true ? '#44ff88' : state === false ? '#ff4466' : '#8080ff99';
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload  = () => { dbg('✓ ' + src.split('/').pop()); res(); };
    s.onerror = () => { dbg('✗ ' + src.split('/').pop(), '#ff4466'); rej(); };
    document.head.appendChild(s);
  });
}

// ─── Mode toggle ─────────────────────────────────────────────────
let mode = 'hat';
document.querySelectorAll('.btn[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
  });
});

// ─── Canvas setup ────────────────────────────────────────────────
const video     = document.getElementById('video');
const canvas    = document.getElementById('canvas');
const ctx       = canvas.getContext('2d');
const container = document.getElementById('container');

let renderW = 0, renderH = 0;

function syncCanvasSize() {
  const w = container.offsetWidth;
  const h = container.offsetHeight;
  if (w === renderW && h === renderH) return;
  renderW = w; renderH = h;
  canvas.width  = renderW;
  canvas.height = renderH;
  dbg(`canvas: ${renderW}×${renderH}`);
}

// ─── Coordinate mapping ──────────────────────────────────────────
//
// KEY DESIGN DECISION:
//   • The <video> element is invisible (opacity:0, 1px).
//   • Each frame we draw the video onto <canvas> with ctx.scale(-1,1)
//     so the mirrored selfie image is rendered directly into canvas pixels.
//   • MediaPipe landmarks are in raw (un-mirrored) video space [0,1].
//   • We flip landmark X → (1 - nx) so it matches the mirrored canvas image.
//   • Then apply object-fit:cover scale+offset so landmarks align with
//     how the video is cropped inside the canvas.
//
// This way there is exactly ONE coordinate system and NO CSS transforms
// are fighting each other. Rotation axes are therefore correct.

function coverMap(nx, ny) {
  const vw = video.videoWidth  || renderW;
  const vh = video.videoHeight || renderH;

  // Mirror X to match the flipped video drawn on canvas
  const mx = 1 - nx;

  const scale = Math.max(renderW / vw, renderH / vh);
  const dx    = (renderW - vw * scale) / 2;
  const dy    = (renderH - vh * scale) / 2;

  return {
    x: mx * vw * scale + dx,
    y: ny * vh * scale + dy,
    s: scale
  };
}

function lm(lms, i) { return coverMap(lms[i].x, lms[i].y); }

// ─── Smoothing ───────────────────────────────────────────────────
const S = {};
function sm(k, v, a = 0.3) {
  S[k] = S[k] === undefined ? v : S[k] * (1 - a) + v * a;
  return S[k];
}

// ─── Head pose (6DOF) ────────────────────────────────────────────
function getHeadPose(lms) {
  const noseTip    = lm(lms, 1);
  const chin       = lm(lms, 152);
  const forehead   = lm(lms, 10);
  const leftCheek  = lm(lms, 454);  // swapped because X is mirrored
  const rightCheek = lm(lms, 234);
  const leftEye    = lm(lms, 263);  // swapped
  const rightEye   = lm(lms, 33);

  const faceW = Math.abs(rightCheek.x - leftCheek.x);
  const faceH = Math.abs(chin.y - forehead.y);
  const cx    = (leftCheek.x + rightCheek.x) / 2;
  const cy    = (forehead.y  + chin.y)        / 2;

  // Roll: angle of the eye line — positive = head tilted right
  const eyeDx = rightEye.x - leftEye.x;
  const eyeDy = rightEye.y - leftEye.y;
  const roll  = Math.atan2(eyeDy, eyeDx);

  // Yaw: nose tip offset from face centre; after mirror flip this is correct
  const yawRaw = (noseTip.x - cx) / (faceW * 0.5);
  const yaw    = yawRaw * (Math.PI / 2.5);

  // Pitch: nose-tip vertical relative to eye midpoint
  const eyeMidY  = (leftEye.y + rightEye.y) / 2;
  const pitchRaw = (noseTip.y - eyeMidY) / (faceH * 0.5);
  const pitch    = (pitchRaw - 0.55) * (Math.PI / 1.8);

  return {
    cx:    sm('px', cx),
    cy:    sm('py', cy),
    faceW: sm('fw', faceW),
    faceH: sm('fh', faceH),
    roll:  sm('rl', roll,  0.25),
    yaw:   sm('yw', yaw,   0.25),
    pitch: sm('pt', pitch, 0.25),
  };
}

// ─── Pose transform ───────────────────────────────────────────────
// Translates ctx to face anchor, applies roll+yaw+pitch as 2D transform,
// then scales by face size so all graphics are drawn in "face-space" units.
function applyPoseTransform(pose, anchorOffsetY = 0) {
  const { cx, cy, faceW, roll, yaw, pitch } = pose;

  ctx.translate(cx, cy + anchorOffsetY);
  ctx.rotate(roll);

  // Perspective shear: simulates 3-D rotation on a 2-D canvas
  const kYaw   =  Math.tan(yaw)   * 0.55;
  const kPitch = -Math.tan(pitch) * 0.45;  // negative: pitch up = graphic leans back

  ctx.transform(1, kPitch, kYaw, 1, 0, 0);

  // Scale so graphics auto-size with distance
  const baseScale = faceW / 220;
  ctx.scale(baseScale, baseScale);
}

// ─── Draw: Mirrored video frame ───────────────────────────────────
function drawVideoFrame() {
  if (video.readyState < 2) return;
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const scale = Math.max(renderW / vw, renderH / vh);
  const dw    = vw * scale, dh = vh * scale;
  const dx    = (renderW - dw) / 2;
  const dy    = (renderH - dh) / 2;

  ctx.save();
  // Flip horizontally around the canvas centre
  ctx.translate(renderW, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, dx, dy, dw, dh);
  ctx.restore();
}

// ─── Draw: Hat ────────────────────────────────────────────────────
function drawHat(lms, pose) {
  const top     = lm(lms, 10);
  const offsetY = top.y - pose.cy - pose.faceH * 0.12;

  ctx.save();
  applyPoseTransform(pose, offsetY);

  const hw = 170, hh = 190, brimH = 30;

  ctx.beginPath();
  ctx.ellipse(0, brimH * 0.3, hw * 0.52, brimH * 0.5, 0, 0, Math.PI * 2);
  const brimG = ctx.createLinearGradient(-hw * 0.52, 0, hw * 0.52, 0);
  brimG.addColorStop(0, '#1a1a1a'); brimG.addColorStop(.5, '#3c3c3c'); brimG.addColorStop(1, '#111');
  ctx.fillStyle = brimG; ctx.fill();

  const bx = -hw * 0.32, by = -hh * 0.88, bw = hw * 0.64, bh = hh * 0.88;
  ctx.beginPath();
  ctx.moveTo(bx + bw * .08, by + bh); ctx.lineTo(bx, by + bh);
  ctx.quadraticCurveTo(bx - bw * .04, by + bh * .5, bx + bw * .1, by);
  ctx.quadraticCurveTo(0, by - bh * .07, bx + bw * .9, by);
  ctx.quadraticCurveTo(bx + bw * 1.04, by + bh * .5, bx + bw, by + bh);
  ctx.lineTo(bx + bw * .92, by + bh); ctx.closePath();
  const bodyG = ctx.createLinearGradient(bx, by, bx + bw, by + bh);
  bodyG.addColorStop(0, '#2d2d2d'); bodyG.addColorStop(.4, '#555'); bodyG.addColorStop(1, '#111');
  ctx.fillStyle = bodyG; ctx.fill();

  ctx.fillStyle = '#7070ff';
  ctx.fillRect(bx + bw * .02, by + bh * .85, bw * .96, bh * .09);
  ctx.restore();
}

// ─── Draw: Glasses ────────────────────────────────────────────────
function drawGlasses(lms, pose) {
  const le = lm(lms, 263), re = lm(lms, 33);  // mirrored: 263=left, 33=right
  const offsetY  = ((le.y + re.y) / 2) - pose.cy;
  const eyeSpan  = Math.abs(re.x - le.x);
  const poseUnit = pose.faceW / 220;
  const r        = (eyeSpan / poseUnit) * 0.38;
  const halfSpan = (eyeSpan / poseUnit) * 0.5;
  const lx = -halfSpan, rx = halfSpan;

  ctx.save();
  applyPoseTransform(pose, offsetY);
  ctx.lineWidth = r * 0.09;

  for (const ex of [lx, rx]) {
    ctx.beginPath(); ctx.ellipse(ex, 0, r, r * .7, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(80,80,255,0.18)'; ctx.fill();
    ctx.strokeStyle = '#3030ee'; ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.arc(ex - r * .2, -r * .2, r * .18, Math.PI * 1.1, Math.PI * 1.55);
    ctx.strokeStyle = 'rgba(220,220,255,.5)'; ctx.lineWidth = r * .035; ctx.stroke();
    ctx.restore();
  }
  ctx.lineWidth = r * 0.09;
  ctx.beginPath(); ctx.moveTo(lx + r, 0); ctx.lineTo(rx - r, 0); ctx.strokeStyle = '#5050ff'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(lx - r, 0); ctx.lineTo(lx - r * 2.4, -r * .3); ctx.strokeStyle = '#3030ee'; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(rx + r, 0); ctx.lineTo(rx + r * 2.4, -r * .3); ctx.stroke();
  ctx.restore();
}

// ─── Draw: Crown ──────────────────────────────────────────────────
function drawCrown(lms, pose) {
  const top     = lm(lms, 10);
  const offsetY = top.y - pose.cy - pose.faceH * 0.05;

  ctx.save();
  applyPoseTransform(pose, offsetY);

  const cw = 130, ch = 90;
  const pts = [
    [-cw, 0], [-cw, -ch * .5], [-cw * .6, -ch * .3], [-cw * .3, -ch],
    [0, -ch * .4],
    [cw * .3, -ch], [cw * .6, -ch * .3], [cw, -ch * .5], [cw, 0],
  ];
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  pts.slice(1).forEach(p => ctx.lineTo(...p));
  ctx.closePath();
  const cg = ctx.createLinearGradient(0, -ch, 0, 0);
  cg.addColorStop(0, '#ffe44a'); cg.addColorStop(.5, '#ffaa00'); cg.addColorStop(1, '#bb7700');
  ctx.fillStyle = cg; ctx.fill(); ctx.strokeStyle = '#996600'; ctx.lineWidth = 2; ctx.stroke();

  [[-cw * .3, -ch, '#ff3366'], [0, -ch * .4, '#33aaff'], [cw * .3, -ch, '#33ff88']].forEach(([gx, gy, gc]) => {
    ctx.beginPath(); ctx.arc(gx, gy, 8, 0, Math.PI * 2);
    ctx.fillStyle = gc; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  });
  ctx.restore();
}

// ─── Draw: Mesh ───────────────────────────────────────────────────
function drawMesh(lms) {
  const EDGES = [
    [10,338],[338,297],[297,332],[332,284],[284,251],[251,389],[389,356],
    [356,454],[454,323],[323,361],[361,288],[288,397],[397,365],[365,379],
    [379,378],[378,400],[400,377],[377,152],[152,148],[148,176],[176,149],
    [149,150],[150,136],[136,172],[172,58],[58,132],[132,93],[93,234],
    [234,127],[127,162],[162,21],[21,54],[54,103],[103,67],[67,109],[109,10],
    [33,7],[7,163],[163,144],[144,145],[145,153],[153,154],[154,155],[155,133],
    [133,173],[173,157],[157,158],[158,159],[159,160],[160,161],[161,246],[246,33],
    [362,382],[382,381],[381,380],[380,374],[374,373],[373,390],[390,249],[249,263],
    [263,466],[466,388],[388,387],[387,386],[386,385],[385,384],[384,398],[398,362],
    [78,95],[95,88],[88,178],[178,87],[87,14],[14,317],[317,402],[402,318],
    [318,324],[324,308],[308,415],[415,310],[310,311],[311,312],[312,13],
    [13,82],[82,81],[81,80],[80,191],[191,78],
    [168,6],[6,197],[197,195],[195,5],[5,4],[4,1],[1,19],[19,94],
  ];
  ctx.save();
  ctx.strokeStyle = 'rgba(100,130,255,0.35)'; ctx.lineWidth = 0.8;
  EDGES.forEach(([a, b]) => {
    const p = lm(lms, a), q = lm(lms, b);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
  });
  ctx.fillStyle = 'rgba(140,200,255,0.7)';
  lms.forEach(p => {
    const m = coverMap(p.x, p.y);
    ctx.beginPath(); ctx.arc(m.x, m.y, 1.5, 0, Math.PI * 2); ctx.fill();
  });
  ctx.restore();
}

// ─── Camera + MediaPipe ───────────────────────────────────────────
async function startCamera() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 1280 } },
      audio: false
    });
    const s = stream.getVideoTracks()[0].getSettings();
    dbg(`Camera ${s.width}×${s.height} ✓`, '#44ff88');
  } catch (e) {
    dbg('Camera: ' + e.message, '#ff4466');
    setStatus('ไม่สามารถเปิดกล้อง: ' + e.message, false);
    return;
  }

  video.srcObject = stream;
  await new Promise(res => { video.onloadedmetadata = res; });
  await video.play();

  syncCanvasSize();
  let resizeTimer;
  window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(syncCanvasSize, 200); });

  dbg(`video: ${video.videoWidth}×${video.videoHeight}`, '#44ff88');
  setStatus('กำลังโหลด face model...', null);

  const faceMesh = new FaceMesh({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}`
  });
  faceMesh.setOptions({ maxNumFaces: 1, refineLandmarks: false, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

  faceMesh.onResults(results => {
    ctx.clearRect(0, 0, renderW, renderH);

    // Always draw the mirrored video frame first
    drawVideoFrame();

    if (!results.multiFaceLandmarks?.length) return;
    const lms  = results.multiFaceLandmarks[0];
    const pose = getHeadPose(lms);

    if      (mode === 'hat')     drawHat(lms, pose);
    else if (mode === 'glasses') drawGlasses(lms, pose);
    else if (mode === 'crown')   drawCrown(lms, pose);
    else if (mode === 'mesh')    drawMesh(lms);
  });

  let firstFrame = true;
  async function pump() {
    if (video.readyState >= 2) {
      await faceMesh.send({ image: video });
      if (firstFrame) {
        firstFrame = false;
        dbg('Tracking active ✓', '#44ff88');
        setStatus('● tracking active', true);
      }
    }
    requestAnimationFrame(pump);
  }
  pump();
}

async function bootstrap() {
  setStatus('กำลังโหลด MediaPipe...');
  dbg('Loading scripts...');
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js');
    await startCamera();
  } catch (e) {
    setStatus('โหลดไม่สำเร็จ', false);
  }
}

bootstrap();
</script>

</body>
</html>
