<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Audio Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- โหลดไลบรารี FFmpeg -->
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    
    <style>
        .toast {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            transform: translateY(100%);
            opacity: 0;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 max-w-lg w-full">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">แปลงไฟล์เสียงเป็น MP3</h1>
        <p class="text-center text-sm text-gray-500 mb-6">สามารถเลือกได้หลายไฟล์พร้อมกัน</p>
        
        <!-- Upload Area -->
        <div id="dropZone" class="border-2 border-dashed border-blue-400 rounded-xl p-6 text-center cursor-pointer hover:bg-blue-50 transition-colors mb-4">
            <svg class="mx-auto h-12 w-12 text-blue-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <p class="text-sm text-gray-600 mb-1">คลิกหรือลากไฟล์ทั้งหมดมาวางที่นี่</p>
            <p class="text-xs text-gray-400">รองรับ MP4 (แยกเสียง), M4A, WAV, OGG ฯลฯ</p>
            <input type="file" id="fileInput" class="hidden" accept="audio/*,video/mp4,.mp4" multiple>
        </div>

        <!-- YouTube / YouTube Music Link Area -->
        <div class="mb-6 flex gap-2">
            <input type="text" id="youtubeInput" placeholder="วางลิงก์ YouTube (เดี่ยว/Playlist)..." class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
            <button id="addYoutubeBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                เพิ่มลิงก์
            </button>
        </div>

        <!-- File List Container -->
        <div id="fileListContainer" class="max-h-64 overflow-y-auto no-scrollbar mb-4 space-y-2">
            <!-- รายการไฟล์จะถูกสร้างที่นี่โดย JavaScript -->
        </div>

        <!-- Convert All Button -->
        <button id="convertBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed hidden">
            เริ่มแปลงไฟล์ทั้งหมด (0 ไฟล์)
        </button>
        
        <!-- Version Indicator -->
        <p class="text-center text-xs text-gray-400 mt-4">Version 1.3.1 (Playlist Fix)</p>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 flex flex-col gap-2 z-50"></div>

    <script>
        // DOM Elements
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileListContainer = document.getElementById('fileListContainer');
        const convertBtn = document.getElementById('convertBtn');
        const toastContainer = document.getElementById('toastContainer');
        const youtubeInput = document.getElementById('youtubeInput');
        const addYoutubeBtn = document.getElementById('addYoutubeBtn');

        // State Variables สำหรับระบบ Queue
        let fileQueue = []; 
        let isConverting = false;
        let ffmpegLoaded = false;
        let ffmpeg = null;
        let fetchFile = null;
        let currentProcessingId = null; 

        // Custom Toast Notification
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const colors = { info: 'bg-blue-500', success: 'bg-green-500', error: 'bg-red-500' };
            toast.className = `${colors[type]} text-white px-6 py-3 rounded-lg shadow-lg text-sm font-medium toast`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function loadFFmpeg() {
            if (ffmpegLoaded) return true;
            try {
                showToast('กำลังโหลดเครื่องมือแปลงไฟล์...', 'info');
                convertBtn.disabled = true;
                convertBtn.textContent = 'กำลังโหลดเครื่องมือ...';
                
                if (typeof window.FFmpegWASM === 'undefined' || typeof window.FFmpegUtil === 'undefined') {
                    throw new Error("ไม่สามารถดึงไลบรารีได้");
                }

                const { FFmpeg } = window.FFmpegWASM;
                const { fetchFile: _fetchFile, toBlobURL } = window.FFmpegUtil;
                
                ffmpeg = new FFmpeg();
                fetchFile = _fetchFile;
                
                ffmpeg.on('progress', ({ progress }) => {
                    if (currentProcessingId !== null) {
                        const percent = Math.max(0, Math.min(100, Math.round(progress * 100)));
                        updateFileProgress(currentProcessingId, percent);
                    }
                });

                const baseURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd';
                await ffmpeg.load({
                    coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
                    wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
                });

                ffmpegLoaded = true;
                updateConvertButton();
                return true;
            } catch (error) {
                console.error(error);
                showToast('โหลดเครื่องมือไม่สำเร็จ กรุณารีเฟรช', 'error');
                return false;
            }
        }

        function handleFileSelect(files) {
            if (!files || files.length === 0) return;
            
            let addedCount = 0;
            Array.from(files).forEach(file => {
                if (file.type.startsWith('audio/') || file.type === 'video/mp4' || file.name.match(/\.(mp4|m4a|mp3|wav|ogg|flac|aac|wma)$/i)) {
                    const fileObj = {
                        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                        file: file,
                        name: file.name,
                        size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
                        status: 'pending', 
                        progress: 0,
                        downloadUrl: null
                    };
                    fileQueue.push(fileObj);
                    addedCount++;
                }
            });

            if (addedCount > 0) {
                renderFileList();
                updateConvertButton();
                if (!ffmpegLoaded) loadFFmpeg();
            } else {
                showToast('ไม่พบไฟล์เสียงที่รองรับ', 'error');
            }
        }

        function removeFile(id) {
            if (isConverting && currentProcessingId === id) {
                showToast('ไม่สามารถลบไฟล์ที่กำลังแปลงได้', 'error');
                return;
            }
            fileQueue = fileQueue.filter(f => f.id !== id);
            renderFileList();
            updateConvertButton();
        }

        function updateConvertButton() {
            const pendingCount = fileQueue.filter(f => f.status === 'pending').length;
            if (fileQueue.length > 0) {
                convertBtn.classList.remove('hidden');
                convertBtn.disabled = pendingCount === 0 || isConverting || !ffmpegLoaded;
                
                if (isConverting) {
                    convertBtn.textContent = 'กำลังแปลงไฟล์...';
                } else if (pendingCount === 0) {
                    convertBtn.textContent = 'แปลงไฟล์เสร็จสิ้นทั้งหมด';
                } else {
                    convertBtn.textContent = `เริ่มแปลงไฟล์ทั้งหมด (${pendingCount} ไฟล์)`;
                }
            } else {
                convertBtn.classList.add('hidden');
            }
        }

        function renderFileList() {
            fileListContainer.innerHTML = ''; 
            
            fileQueue.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'bg-gray-50 border border-gray-100 rounded-lg p-3 flex flex-col transition-all';
                itemDiv.id = `item-${item.id}`;

                let rightActionHTML = '';
                let progressHTML = '';

                if (item.status === 'pending') {
                    rightActionHTML = `
                        <button onclick="removeFile('${item.id}')" class="text-red-400 hover:text-red-600 p-1" title="ลบออก">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                    `;
                } else if (item.status === 'done') {
                    rightActionHTML = `
                        <a href="${item.downloadUrl}" target="_blank" download="${item.name.replace(/\.[^/.]+$/, "") + '.mp3'}" class="text-white bg-green-500 hover:bg-green-600 p-1.5 rounded-md text-xs font-medium inline-flex items-center gap-1 shadow-sm transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            โหลด MP3
                        </a>
                    `;
                } else if (item.status === 'error') {
                     rightActionHTML = `<span class="text-xs text-red-500 font-medium">ล้มเหลว</span>`;
                } else if (item.status === 'fetching_link') {
                    rightActionHTML = `<div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-500" title="กำลังเตรียมลิงก์/รอคิว"></div>`;
                }

                if (item.status === 'converting' || item.progress > 0) {
                    const color = item.status === 'error' ? 'bg-red-500' : (item.status === 'done' ? 'bg-green-500' : 'bg-blue-600');
                    progressHTML = `
                        <div class="w-full bg-gray-200 rounded-full h-1.5 mt-2 overflow-hidden">
                            <div class="${color} h-1.5 rounded-full transition-all duration-300" style="width: ${item.progress}%"></div>
                        </div>
                    `;
                }

                let statusText = item.size;
                if (item.status === 'converting') statusText = `กำลังแปลง... ${item.progress}%`;
                if (item.status === 'fetching_link') statusText = `กำลังเตรียมลิงก์ MP3...`;

                itemDiv.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="truncate mr-3 flex-1">
                            <p class="text-sm font-medium text-gray-800 truncate" title="${item.name}">${item.name}</p>
                            <p class="text-xs text-gray-500 transition-colors" id="status-${item.id}">${statusText}</p>
                        </div>
                        <div class="flex-shrink-0 flex items-center">
                            ${rightActionHTML}
                        </div>
                    </div>
                    ${progressHTML}
                `;
                fileListContainer.appendChild(itemDiv);
            });
        }

        function updateFileProgress(id, percent) {
            const fileItem = fileQueue.find(f => f.id === id);
            if (fileItem) {
                fileItem.progress = percent;
                renderFileList(); 
            }
        }

        function updateFileStatus(id, status, url = null) {
            const fileItem = fileQueue.find(f => f.id === id);
            if (fileItem) {
                fileItem.status = status;
                if (url) fileItem.downloadUrl = url;
                if (status === 'done') fileItem.progress = 100;
                renderFileList();
            }
        }

        async function convertAllFiles() {
            if (isConverting) return;
            
            if (!ffmpegLoaded) {
                const loaded = await loadFFmpeg();
                if (!loaded) return;
            }

            const pendingFiles = fileQueue.filter(f => f.status === 'pending');
            if (pendingFiles.length === 0) return;

            isConverting = true;
            updateConvertButton();
            showToast('เริ่มกระบวนการแปลงไฟล์...', 'info');

            for (const item of pendingFiles) {
                currentProcessingId = item.id;
                updateFileStatus(item.id, 'converting');

                try {
                    const ext = item.file.name.substring(item.file.name.lastIndexOf('.'));
                    const inputName = `input_${item.id}${ext}`;
                    const outputName = `output_${item.id}.mp3`;

                    await ffmpeg.writeFile(inputName, await fetchFile(item.file));
                    await ffmpeg.exec(['-i', inputName, '-vn', '-b:a', '192k', outputName]);
                    
                    const data = await ffmpeg.readFile(outputName);
                    const blob = new Blob([data.buffer], { type: 'audio/mp3' });
                    const url = URL.createObjectURL(blob);
                    
                    await ffmpeg.deleteFile(inputName);
                    await ffmpeg.deleteFile(outputName);

                    updateFileStatus(item.id, 'done', url);
                    
                } catch (error) {
                    console.error(`Error converting ${item.name}:`, error);
                    updateFileStatus(item.id, 'error');
                }
            }

            isConverting = false;
            currentProcessingId = null;
            updateConvertButton();
            showToast('แปลงไฟล์ทั้งหมดเสร็จสมบูรณ์!', 'success');
        }

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-blue-600', 'bg-blue-50');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-blue-600', 'bg-blue-50');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-600', 'bg-blue-50');
            if (e.dataTransfer.files.length) {
                handleFileSelect(e.dataTransfer.files);
            }
        });

        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            handleFileSelect(e.target.files);
            fileInput.value = ''; 
        });
        
        convertBtn.addEventListener('click', convertAllFiles);

        // ==========================================
        // ส่วนจัดการ YouTube & Playlist
        // ==========================================
        
        // --- ส่วนตั้งค่า API KEY ---
        const RAPID_API_KEY = "6308b8aaadmsh6b43bbc19936347p1bafb8jsn980be223bcb0"; 
        const GOOGLE_YOUTUBE_API_KEY = "AIzaSyBL1o8JxQe_5N7_Ac7rooyvs3C-R1sdYlM"; 
        
        function extractVideoOrPlaylistID(url) {
            const result = { videoId: null, playlistId: null };
            try {
                const urlObj = new URL(url);
                result.videoId = urlObj.searchParams.get("v");
                result.playlistId = urlObj.searchParams.get("list");
            } catch (e) {
                if (url.includes('youtu.be/')) {
                    result.videoId = url.split('youtu.be/')[1].split(/[?#&]/)[0];
                }
            }
            return result;
        }

        // ฟังก์ชันดึงลิงก์ MP3 พร้อมระบบลองใหม่ (Retry) อัตโนมัติถ้าระบบเข้าคิว
        async function fetchRapidApiMp3(videoId, itemId, retryCount = 0) {
            try {
                const apiUrl = `https://youtube-mp36.p.rapidapi.com/dl?id=${videoId}`;
                const response = await fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'x-rapidapi-key': RAPID_API_KEY,
                        'x-rapidapi-host': 'youtube-mp36.p.rapidapi.com'
                    }
                });
                
                // ถ้ายิง API เร็วเกินไปจนโดน Rate Limit บล็อก
                if (response.status === 429) {
                    if (retryCount < 4) {
                        await new Promise(resolve => setTimeout(resolve, 5000));
                        return fetchRapidApiMp3(videoId, itemId, retryCount + 1);
                    }
                    throw new Error("Rate limit exceeded");
                }

                const data = await response.json();
                
                // ถ้าระบบยังไม่พร้อมจ่ายลิงก์ และสั่งให้รอในคิว
                if (data.msg === "in queue" || data.status === "processing") {
                    if (retryCount < 6) { // ลองทวงถามใหม่สูงสุด 6 ครั้ง (รอครั้งละ 5 วินาที)
                        await new Promise(resolve => setTimeout(resolve, 5000));
                        return fetchRapidApiMp3(videoId, itemId, retryCount + 1);
                    } else {
                        throw new Error("Timeout waiting for API");
                    }
                }

                const downloadUrl = data.link || data.url;

                if (downloadUrl) {
                    updateFileStatus(itemId, 'done', downloadUrl);
                } else {
                    updateFileStatus(itemId, 'error');
                }
            } catch (err) {
                console.error("Fetch MP3 Error:", err);
                updateFileStatus(itemId, 'error');
            }
        }

        // ระบบคิวในการดึงลิงก์ Playlist แบบทยอยดึง
        async function processPlaylistLinkQueue() {
            const itemsToFetch = fileQueue.filter(f => f.status === 'fetching_link');
            for(let item of itemsToFetch) {
                await fetchRapidApiMp3(item.ytVideoId, item.id);
                // เพิ่มการหน่วงเวลาเป็น 3 วินาที ป้องกัน API แบนจากการดึงรัวๆ
                await new Promise(resolve => setTimeout(resolve, 3000));
            }
        }

        addYoutubeBtn.addEventListener('click', async () => {
            const url = youtubeInput.value.trim();
            if (!url) {
                showToast('กรุณาวางลิงก์ก่อน', 'error');
                return;
            }

            const ids = extractVideoOrPlaylistID(url);
            
            if (!ids.videoId && !ids.playlistId) {
                showToast('รูปแบบลิงก์ไม่ถูกต้อง', 'error');
                return;
            }

            addYoutubeBtn.disabled = true;
            addYoutubeBtn.innerHTML = 'กำลังโหลด...';
            
            try {
                // กรณีเป็น Playlist
                if (ids.playlistId && GOOGLE_YOUTUBE_API_KEY) {
                    showToast('ตรวจพบ Playlist! กำลังกวาดรายชื่อเพลง...', 'info');
                    
                    const googleApiUrl = `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${ids.playlistId}&key=${GOOGLE_YOUTUBE_API_KEY}`;
                    const res = await fetch(googleApiUrl);
                    if (!res.ok) throw new Error("ดึงข้อมูล Playlist ไม่สำเร็จ (เช็ค Google API Key)");
                    
                    const data = await res.json();
                    if (!data.items || data.items.length === 0) {
                        showToast('ไม่พบวิดีโอใน Playlist นี้ หรือเป็น Playlist ส่วนตัว', 'error');
                        return;
                    }

                    let added = 0;
                    data.items.forEach(item => {
                        const vid = item.snippet.resourceId.videoId;
                        const title = item.snippet.title;
                        
                        if (title !== "Private video" && title !== "Deleted video") {
                            const fileObj = {
                                id: 'yt_' + Date.now().toString() + Math.random().toString(36).substr(2, 5),
                                ytVideoId: vid,
                                file: null, 
                                name: title + '.mp3',
                                size: 'YT Music',
                                status: 'fetching_link', 
                                progress: 0,
                                downloadUrl: null 
                            };
                            fileQueue.push(fileObj);
                            added++;
                        }
                    });

                    renderFileList();
                    youtubeInput.value = '';
                    showToast(`เพิ่ม ${added} เพลงเข้าคิว เริ่มดึงลิงก์อัตโนมัติ...`, 'success');
                    
                    // สั่งให้ทยอยดึงลิงก์ MP3
                    processPlaylistLinkQueue();

                } 
                // กรณีเป็นวิดีโอเดี่ยว
                else if (ids.videoId) {
                    showToast('กำลังขอดึงไฟล์จากเซิร์ฟเวอร์...', 'info');
                    
                    // เรียกใช้ฟังก์ชัน fetch ที่มีระบบ Retry เหมือนกัน
                    const fileObj = {
                        id: 'yt_' + Date.now().toString(),
                        ytVideoId: ids.videoId,
                        file: null, 
                        name: `music_${ids.videoId}.mp3`, // ชื่อชั่วคราวก่อนโหลด
                        size: 'YT Music (MP3)',
                        status: 'fetching_link', 
                        progress: 0,
                        downloadUrl: null 
                    };
                    
                    fileQueue.unshift(fileObj); 
                    renderFileList();
                    youtubeInput.value = '';
                    
                    await fetchRapidApiMp3(ids.videoId, fileObj.id);
                    showToast('ทำงานเสร็จสิ้น', 'success');

                } else {
                    showToast('เกิดข้อผิดพลาดในการอ่านลิงก์', 'error');
                }

            } catch (err) {
                console.error(err);
                showToast(err.message || 'เชื่อมต่อ API ล้มเหลว', 'error');
            } finally {
                addYoutubeBtn.disabled = false;
                addYoutubeBtn.innerHTML = `
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>
                    เพิ่มลิงก์
                `;
            }
        });

    </script>
</body>
</html>
