<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D PBR Texture Painter & UV Studio Pro</title>
  <style>
    :root {
      --bg-dark: #121214;
      --panel-bg: #1a1a1e;
      --panel-border: #2c2c34;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; user-select: none; }
    
    /* Top Navigation */
    header {
      height: 48px; background: var(--panel-bg); border-bottom: 1px solid var(--panel-border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 13px;
    }
    .header-title { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; color: #60a5fa; }
    .header-actions { display: flex; gap: 8px; align-items: center; }

    /* Workspace Layout */
    #workspace { flex: 1; display: flex; position: relative; overflow: hidden; }
    
    /* Side Panels */
    .sidebar { width: 300px; background: var(--panel-bg); display: flex; flex-direction: column; z-index: 10; border-color: var(--panel-border); }
    #left-bar { border-right: 1px solid var(--panel-border); }
    #right-bar { border-left: 1px solid var(--panel-border); }

    .panel-section { padding: 12px 16px; border-bottom: 1px solid var(--panel-border); }
    .panel-title { font-size: 11px; text-transform: uppercase; font-weight: 700; color: var(--text-muted); margin-bottom: 10px; letter-spacing: 0.5px; }

    /* Form Controls */
    .control-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 12px; }
    .control-row label { color: var(--text-muted); }
    input[type="range"] { width: 110px; accent-color: var(--accent); }
    input[type="color"] { border: none; width: 32px; height: 22px; border-radius: 4px; background: transparent; cursor: pointer; }
    select, button, .btn-file { background: #26262c; border: 1px solid var(--panel-border); color: var(--text); padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; transition: 0.15s; }
    select:hover, button:hover, .btn-file:hover { background: #32323a; border-color: #4b5563; }
    button.active { background: var(--accent); border-color: #60a5fa; color: white; }
    .btn-group { display: flex; gap: 4px; }

    /* Channel Toggles (PBR) */
    .pbr-channel-box {
      background: #141417; padding: 10px; border-radius: 6px; border: 1px solid var(--panel-border); margin-bottom: 8px;
    }
    .channel-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-weight: 600; font-size: 12px; }

    /* Layers List */
    #layer-stack { flex: 1; overflow-y: auto; list-style: none; padding: 8px 12px; display: flex; flex-direction: column-reverse; gap: 6px; }
    .layer-card {
      background: #222228; border: 1px solid var(--panel-border); border-radius: 6px; padding: 8px 10px;
      display: flex; align-items: center; justify-content: space-between; font-size: 12px; cursor: pointer; transition: 0.15s;
    }
    .layer-card.active { border-color: var(--accent); background: #1e2538; }
    .layer-card .left-part { display: flex; align-items: center; gap: 8px; }

    /* Viewport Area */
    #viewport-container { flex: 1; position: relative; display: flex; }
    #canvas-3d { flex: 1; width: 100%; height: 100%; }

    /* 2D UV Viewport (Floating / Docked) */
    #uv-dock {
      width: 280px; height: 280px; background: #0a0a0c; border: 1px solid var(--panel-border); border-radius: 8px;
      margin: 12px; overflow: hidden; display: flex; flex-direction: column; align-self: flex-end;
    }
    #uv-canvas { width: 100%; height: 100%; background: #000; }
  </style>

  <!-- Three.js & Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/environments/RoomEnvironment.js"></script>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="header-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      3D PBR Painter & UV Studio
    </div>
    <div class="header-actions">
      <label class="btn-file">
        นำเข้า 3D (.obj, .gltf)
        <input type="file" id="file-importer" accept=".obj,.gltf,.glb" style="display:none;">
      </label>
      <button id="btn-unwrap-uv" style="background:#4f46e5; border-color:#6366f1;">Auto Unwrap UV (Smart Atlas)</button>
      <button id="btn-export-all" style="background:#059669; border-color:#10b981;">ส่งออกชุด PBR Maps (PNG)</button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div id="workspace">
    
    <!-- Left Sidebar: Brush & PBR Material Channels -->
    <div class="sidebar" id="left-bar">
      <!-- Tool Modes -->
      <div class="panel-section">
        <div class="panel-title">Tools</div>
        <div class="btn-group" style="width: 100%;">
          <button id="tool-paint" class="active" style="flex:1;">Brush</button>
          <button id="tool-erase" style="flex:1;">Eraser</button>
          <button id="tool-orbit" style="flex:1;">Orbit</button>
        </div>
      </div>

      <!-- Brush Dynamics (Photoshop style) -->
      <div class="panel-section">
        <div class="panel-title">Brush Engine</div>
        <div class="control-row">
          <label>Size:</label>
          <input type="range" id="brush-size" min="2" max="120" value="25">
          <span id="lbl-brush-size">25px</span>
        </div>
        <div class="control-row">
          <label>Hardness:</label>
          <input type="range" id="brush-hardness" min="0" max="100" value="65">
          <span id="lbl-brush-hard">65%</span>
        </div>
        <div class="control-row">
          <label>Opacity / Flow:</label>
          <input type="range" id="brush-flow" min="5" max="100" value="100">
          <span id="lbl-brush-flow">100%</span>
        </div>
      </div>

      <!-- PBR Multi-Channels -->
      <div class="panel-section" style="flex:1; overflow-y:auto;">
        <div class="panel-title">PBR Material Channels</div>
        
        <!-- Base Color Channel -->
        <div class="pbr-channel-box">
          <div class="channel-header">
            <input type="checkbox" id="chan-color-en" checked>
            <span>Base Color (Albedo)</span>
          </div>
          <div class="control-row" style="margin-bottom:0;">
            <label>สี:</label>
            <input type="color" id="brush-color" value="#e11d48">
          </div>
        </div>

        <!-- Roughness Channel -->
        <div class="pbr-channel-box">
          <div class="channel-header">
            <input type="checkbox" id="chan-rough-en" checked>
            <span>Roughness (ความหยาบ)</span>
          </div>
          <div class="control-row" style="margin-bottom:0;">
            <label>ระดับ:</label>
            <input type="range" id="brush-rough" min="0" max="100" value="25">
            <span id="lbl-brush-rough">0.25</span>
          </div>
        </div>

        <!-- Metallic Channel -->
        <div class="pbr-channel-box">
          <div class="channel-header">
            <input type="checkbox" id="chan-metal-en" checked>
            <span>Metallic (ความเงาโลหะ)</span>
          </div>
          <div class="control-row" style="margin-bottom:0;">
            <label>ระดับ:</label>
            <input type="range" id="brush-metal" min="0" max="100" value="80">
            <span id="lbl-brush-metal">0.80</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Center 3D Viewport -->
    <div id="viewport-container">
      <div id="canvas-3d"></div>
    </div>

    <!-- Right Sidebar: Layer Stack & UV Viewport -->
    <div class="sidebar" id="right-bar">
      <!-- Layers Header -->
      <div class="panel-section" style="display:flex; justify-content:space-between; align-items:center;">
        <div class="panel-title" style="margin-bottom:0;">Layer Stack</div>
        <div class="btn-group">
          <button id="btn-add-layer">+ Layer</button>
          <button id="btn-del-layer" style="color:#ef4444;">ลบ</button>
        </div>
      </div>

      <!-- Layer Properties -->
      <div class="panel-section">
        <div class="control-row">
          <label>Blend Mode:</label>
          <select id="sel-layer-blend">
            <option value="source-over">Normal</option>
            <option value="multiply">Multiply</option>
            <option value="screen">Screen</option>
            <option value="overlay">Overlay</option>
            <option value="darken">Darken</option>
            <option value="lighten">Lighten</option>
          </select>
        </div>
        <div class="control-row">
          <label>Opacity:</label>
          <input type="range" id="layer-opacity" min="0" max="100" value="100">
          <span id="lbl-layer-op">100%</span>
        </div>
      </div>

      <!-- Layers UI List -->
      <ul id="layer-stack"></ul>

      <!-- 2D UV Preview Dock -->
      <div class="panel-section" style="padding-bottom: 4px;">
        <div class="panel-title">2D UV Preview</div>
      </div>
      <div id="uv-dock">
        <canvas id="uv-canvas" width="512" height="512"></canvas>
      </div>
    </div>

  </div>

  <script>
    // =========================================================================
    // 1. 3D WebGL PBR Engine with HDRI Studio Environment
    // =========================================================================
    const container3D = document.getElementById('canvas-3d');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x141417);

    const camera = new THREE.PerspectiveCamera(45, container3D.clientWidth / container3D.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 4.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container3D.clientWidth, container3D.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    container3D.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // PBR Studio Environment (IBL Reflections)
    const pmremGen = new THREE.PMREMGenerator(renderer);
    pmremGen.compileEquirectangularShader();
    const roomEnv = new THREE.RoomEnvironment();
    scene.environment = pmremGen.fromScene(roomEnv, 0.04).texture;

    // Dynamic Lights
    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(6, 12, 8);
    scene.add(mainLight);
    const fillLight = new THREE.DirectionalLight(0x99ccff, 0.6);
    fillLight.position.set(-6, -4, -6);
    scene.add(fillLight);

    // =========================================================================
    // 2. PBR Multi-Channel Canvas & Dilation Engine
    // =========================================================================
    const TEX_SIZE = 1024;

    // Master Composites (Albedo, Roughness, Metalness)
    function createMasterCanvas() {
      const c = document.createElement('canvas');
      c.width = TEX_SIZE;
      c.height = TEX_SIZE;
      return c;
    }
    const compAlbedo = createMasterCanvas();
    const compRoughness = createMasterCanvas();
    const compMetalness = createMasterCanvas();

    const albedoCtx = compAlbedo.getContext('2d');
    const roughCtx = compRoughness.getContext('2d');
    const metalCtx = compMetalness.getContext('2d');

    // Three.js Textures
    const texAlbedo = new THREE.CanvasTexture(compAlbedo);
    const texRoughness = new THREE.CanvasTexture(compRoughness);
    const texMetalness = new THREE.CanvasTexture(compMetalness);
    [texAlbedo, texRoughness, texMetalness].forEach(t => {
      t.minFilter = THREE.LinearFilter;
      t.magFilter = THREE.LinearFilter;
    });

    const pbrMaterial = new THREE.MeshStandardMaterial({
      map: texAlbedo,
      roughnessMap: texRoughness,
      metalnessMap: texMetalness,
      roughness: 1.0,
      metalness: 1.0
    });

    let currentGeometry = new THREE.TorusKnotGeometry(1.0, 0.35, 128, 32);
    let currentMesh = new THREE.Mesh(currentGeometry, pbrMaterial);
    scene.add(currentMesh);

    // Seam Bleed / Texture Dilation (Expands island boundaries to prevent white/black UV seams)
    function applySeamDilation(ctx, passes = 2) {
      const img = ctx.getImageData(0, 0, TEX_SIZE, TEX_SIZE);
      const d = img.data;
      const copy = new Uint8ClampedArray(d);

      for (let p = 0; p < passes; p++) {
        for (let y = 0; y < TEX_SIZE; y++) {
          for (let x = 0; x < TEX_SIZE; x++) {
            const idx = (y * TEX_SIZE + x) * 4;
            if (copy[idx + 3] === 0) { // Empty pixel
              const neighbors = [
                y > 0 ? ((y - 1) * TEX_SIZE + x) * 4 : -1,
                y < TEX_SIZE - 1 ? ((y + 1) * TEX_SIZE + x) * 4 : -1,
                x > 0 ? (y * TEX_SIZE + (x - 1)) * 4 : -1,
                x < TEX_SIZE - 1 ? (y * TEX_SIZE + (x + 1)) * 4 : -1
              ];
              for (let n of neighbors) {
                if (n !== -1 && copy[n + 3] > 0) {
                  d[idx] = copy[n];
                  d[idx + 1] = copy[n + 1];
                  d[idx + 2] = copy[n + 2];
                  d[idx + 3] = copy[n + 3];
                  break;
                }
              }
            }
          }
        }
        copy.set(d);
      }
      ctx.putImageData(img, 0, 0);
    }

    // =========================================================================
    // 3. Multi-Channel Layer Architecture
    // =========================================================================
    let layers = [];
    let activeLayerIndex = 0;

    class PBRLayer {
      constructor(name) {
        this.name = name;
        this.visible = true;
        this.opacity = 1.0;
        this.blendMode = 'source-over';

        // 3 Separate Canvases for Albedo, Roughness, Metalness
        this.cColor = createMasterCanvas();
        this.cRough = createMasterCanvas();
        this.cMetal = createMasterCanvas();

        this.ctxColor = this.cColor.getContext('2d');
        this.ctxRough = this.cRough.getContext('2d');
        this.ctxMetal = this.cMetal.getContext('2d');
      }
    }

    function createNewLayer(name = `Layer ${layers.length + 1}`, fillBase = false) {
      const l = new PBRLayer(name);
      if (fillBase) {
        // Base Albedo (Off-white), Roughness (0.3), Metalness (0.0)
        l.ctxColor.fillStyle = '#f0f0f0';
        l.ctxColor.fillRect(0, 0, TEX_SIZE, TEX_SIZE);

        l.ctxRough.fillStyle = 'rgb(76, 76, 76)'; // 0.3 * 255
        l.ctxRough.fillRect(0, 0, TEX_SIZE, TEX_SIZE);

        l.ctxMetal.fillStyle = 'rgb(0, 0, 0)'; // Dielectric
        l.ctxMetal.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
      }
      layers.push(l);
      activeLayerIndex = layers.length - 1;
      renderLayerUI();
      compositePBRMaps();
    }

    function compositePBRMaps(withDilation = false) {
      // Clear Composites
      albedoCtx.clearRect(0, 0, TEX_SIZE, TEX_SIZE);
      roughCtx.fillStyle = '#666'; roughCtx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
      metalCtx.fillStyle = '#000'; metalCtx.fillRect(0, 0, TEX_SIZE, TEX_SIZE);

      layers.forEach(layer => {
        if (!layer.visible) return;
        
        // Composite Albedo
        albedoCtx.save();
        albedoCtx.globalAlpha = layer.opacity;
        albedoCtx.globalCompositeOperation = layer.blendMode;
        albedoCtx.drawImage(layer.cColor, 0, 0);
        albedoCtx.restore();

        // Composite Roughness
        roughCtx.save();
        roughCtx.globalAlpha = layer.opacity;
        roughCtx.drawImage(layer.cRough, 0, 0);
        roughCtx.restore();

        // Composite Metalness
        metalCtx.save();
        metalCtx.globalAlpha = layer.opacity;
        metalCtx.drawImage(layer.cMetal, 0, 0);
        metalCtx.restore();
      });

      if (withDilation) {
        applySeamDilation(albedoCtx, 2);
        applySeamDilation(roughCtx, 2);
        applySeamDilation(metalCtx, 2);
      }

      texAlbedo.needsUpdate = true;
      texRoughness.needsUpdate = true;
      texMetalness.needsUpdate = true;
      drawUVWireframe();
    }

    // =========================================================================
    // 4. Photoshop-grade Multi-Channel Brush Engine
    // =========================================================================
    let currentTool = 'paint'; // 'paint', 'erase', 'orbit'
    let brushSize = 25;
    let brushHardness = 0.65;
    let brushFlow = 1.0;

    let brushColor = '#e11d48';
    let brushRoughVal = 0.25;
    let brushMetalVal = 0.80;

    let enableColor = true;
    let enableRough = true;
    let enableMetal = true;

    let isPainting = false;
    let lastPoint = null;

    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return { r, g, b };
    }

    function stampChannel(ctx, x, y, size, hardness, colorStr, alpha, isErase) {
      ctx.save();
      if (isErase) {
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalCompositeOperation = 'source-over';
      }

      const grad = ctx.createRadialGradient(x, y, size * hardness, x, y, size);
      grad.addColorStop(0, colorStr.replace('ALPHA', alpha.toFixed(3)));
      grad.addColorStop(1, colorStr.replace('ALPHA', '0'));

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPBRStroke(p1, p2) {
      const curLayer = layers[activeLayerIndex];
      if (!curLayer) return;

      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const step = Math.max(1, brushSize * 0.15);
      const steps = Math.ceil(dist / step);

      const rgb = hexToRgb(brushColor);
      const colPattern = `rgba(${rgb.r},${rgb.g},${rgb.b},ALPHA)`;
      const roughByte = Math.round(brushRoughVal * 255);
      const roughPattern = `rgba(${roughByte},${roughByte},${roughByte},ALPHA)`;
      const metalByte = Math.round(brushMetalVal * 255);
      const metalPattern = `rgba(${metalByte},${metalByte},${metalByte},ALPHA)`;

      const alpha = brushFlow * 0.35;
      const isErase = (currentTool === 'erase');

      for (let i = 0; i <= steps; i++) {
        const t = steps === 0 ? 0 : i / steps;
        const x = p1.x + (p2.x - p1.x) * t;
        const y = p1.y + (p2.y - p1.y) * t;

        if (enableColor) stampChannel(curLayer.ctxColor, x, y, brushSize, brushHardness, colPattern, alpha, isErase);
        if (enableRough) stampChannel(curLayer.ctxRough, x, y, brushSize, brushHardness, roughPattern, alpha, isErase);
        if (enableMetal) stampChannel(curLayer.ctxMetal, x, y, brushSize, brushHardness, metalPattern, alpha, isErase);
      }

      compositePBRMaps(false);
    }

    // Raycast & Pointer Handlers
    const raycaster = new THREE.Raycaster();
    const mouseVec = new THREE.Vector2();

    function getIntersectUV(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouseVec.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouseVec.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouseVec, camera);
      const hits = raycaster.intersectObject(currentMesh);
      if (hits.length > 0 && hits[0].uv) {
        const uv = hits[0].uv;
        return { x: uv.x * TEX_SIZE, y: (1 - uv.y) * TEX_SIZE };
      }
      return null;
    }

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (currentTool === 'orbit') return;
      const pt = getIntersectUV(e);
      if (pt) {
        isPainting = true;
        controls.enabled = false;
        lastPoint = pt;
        drawPBRStroke(pt, pt);
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (!isPainting || currentTool === 'orbit') return;
      const pt = getIntersectUV(e);
      if (pt && lastPoint) {
        drawPBRStroke(lastPoint, pt);
        lastPoint = pt;
      }
    });

    window.addEventListener('pointerup', () => {
      if (isPainting) {
        isPainting = false;
        lastPoint = null;
        compositePBRMaps(true); // Run Seam Dilation when stroke finishes
      }
      if (currentTool === 'orbit') controls.enabled = true;
    });

    // =========================================================================
    // 5. Smart UV Unwrapping & Packing Engine
    // =========================================================================
    function smartAtlasUnwrap(geometry) {
      geometry.computeVertexNormals();
      const pos = geometry.attributes.position;
      const norm = geometry.attributes.normal;
      const count = pos.count;
      const uvs = new Float32Array(count * 2);

      // Cluster faces by normal orientation (6-Chart Atlas with padding)
      const chartOffsets = [
        { u: 0.0, v: 0.0, su: 0.31, sv: 0.46 }, // +X
        { u: 0.33, v: 0.0, su: 0.31, sv: 0.46 }, // -X
        { u: 0.66, v: 0.0, su: 0.31, sv: 0.46 }, // +Y
        { u: 0.0, v: 0.5, su: 0.31, sv: 0.46 }, // -Y
        { u: 0.33, v: 0.5, su: 0.31, sv: 0.46 }, // +Z
        { u: 0.66, v: 0.5, su: 0.31, sv: 0.46 }  // -Z
      ];

      for (let i = 0; i < count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const nx = norm.getX(i), ny = norm.getY(i), nz = norm.getZ(i);

        const absX = Math.abs(nx), absY = Math.abs(ny), absZ = Math.abs(nz);
        let chartIdx = 0, u = 0, v = 0;

        if (absX >= absY && absX >= absZ) {
          chartIdx = nx > 0 ? 0 : 1;
          u = (z + 1.5) / 3.0; v = (y + 1.5) / 3.0;
        } else if (absY >= absX && absY >= absZ) {
          chartIdx = ny > 0 ? 2 : 3;
          u = (x + 1.5) / 3.0; v = (z + 1.5) / 3.0;
        } else {
          chartIdx = nz > 0 ? 4 : 5;
          u = (x + 1.5) / 3.0; v = (y + 1.5) / 3.0;
        }

        const ch = chartOffsets[chartIdx];
        uvs[i * 2] = ch.u + THREE.MathUtils.clamp(u, 0, 1) * ch.su;
        uvs[i * 2 + 1] = ch.v + THREE.MathUtils.clamp(v, 0, 1) * ch.sv;
      }

      geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      geometry.uvsNeedUpdate = true;
      compositePBRMaps(true);
    }

    // 2D UV Viewport Wireframe
    const uvCanvas = document.getElementById('uv-canvas');
    const uvCtx = uvCanvas.getContext('2d');

    function drawUVWireframe() {
      uvCtx.clearRect(0, 0, 512, 512);
      uvCtx.drawImage(compAlbedo, 0, 0, 512, 512);

      if (!currentMesh || !currentMesh.geometry.attributes.uv) return;
      const uvs = currentMesh.geometry.attributes.uv;
      const idx = currentMesh.geometry.index;

      uvCtx.strokeStyle = 'rgba(59, 130, 246, 0.45)';
      uvCtx.lineWidth = 0.5;
      uvCtx.beginPath();

      if (idx) {
        for (let i = 0; i < idx.count; i += 3) {
          const i1 = idx.getX(i), i2 = idx.getX(i + 1), i3 = idx.getX(i + 2);
          uvCtx.moveTo(uvs.getX(i1) * 512, (1 - uvs.getY(i1)) * 512);
          uvCtx.lineTo(uvs.getX(i2) * 512, (1 - uvs.getY(i2)) * 512);
          uvCtx.lineTo(uvs.getX(i3) * 512, (1 - uvs.getY(i3)) * 512);
          uvCtx.closePath();
        }
      }
      uvCtx.stroke();
    }

    // =========================================================================
    // 6. UI Handlers & Importer / Exporter
    // =========================================================================
    function renderLayerUI() {
      const list = document.getElementById('layer-stack');
      list.innerHTML = '';

      layers.forEach((l, idx) => {
        const card = document.createElement('li');
        card.className = `layer-card ${idx === activeLayerIndex ? 'active' : ''}`;
        card.innerHTML = `
          <div class="left-part">
            <input type="checkbox" ${l.visible ? 'checked' : ''} class="vis-check">
            <span>${l.name}</span>
          </div>
          <span style="color:#777; font-size:11px;">${l.blendMode}</span>
        `;
        card.onclick = (e) => {
          if (e.target.classList.contains('vis-check')) {
            l.visible = e.target.checked;
            compositePBRMaps(true);
            return;
          }
          activeLayerIndex = idx;
          updateLayerSettingsUI();
          renderLayerUI();
        };
        list.appendChild(card);
      });
      updateLayerSettingsUI();
    }

    function updateLayerSettingsUI() {
      if (layers[activeLayerIndex]) {
        const cur = layers[activeLayerIndex];
        document.getElementById('sel-layer-blend').value = cur.blendMode;
        document.getElementById('layer-opacity').value = cur.opacity * 100;
        document.getElementById('lbl-layer-op').innerText = `${Math.round(cur.opacity * 100)}%`;
      }
    }

    document.getElementById('btn-add-layer').onclick = () => createNewLayer();
    document.getElementById('btn-del-layer').onclick = () => {
      if (layers.length > 1) {
        layers.splice(activeLayerIndex, 1);
        activeLayerIndex = Math.max(0, activeLayerIndex - 1);
        renderLayerUI();
        compositePBRMaps(true);
      }
    };

    document.getElementById('sel-layer-blend').onchange = (e) => {
      if (layers[activeLayerIndex]) {
        layers[activeLayerIndex].blendMode = e.target.value;
        renderLayerUI();
        compositePBRMaps(true);
      }
    };
    document.getElementById('layer-opacity').oninput = (e) => {
      if (layers[activeLayerIndex]) {
        layers[activeLayerIndex].opacity = parseInt(e.target.value, 10) / 100;
        document.getElementById('lbl-layer-op').innerText = `${e.target.value}%`;
        compositePBRMaps(true);
      }
    };

    // Tools
    const toolBtns = {
      paint: document.getElementById('tool-paint'),
      erase: document.getElementById('tool-erase'),
      orbit: document.getElementById('tool-orbit')
    };
    function switchTool(t) {
      currentTool = t;
      Object.keys(toolBtns).forEach(k => toolBtns[k].classList.toggle('active', k === t));
      controls.enabled = (t === 'orbit');
    }
    toolBtns.paint.onclick = () => switchTool('paint');
    toolBtns.erase.onclick = () => switchTool('erase');
    toolBtns.orbit.onclick = () => switchTool('orbit');

    // Dynamics Listeners
    document.getElementById('brush-size').oninput = (e) => {
      brushSize = parseInt(e.target.value, 10);
      document.getElementById('lbl-brush-size').innerText = `${brushSize}px`;
    };
    document.getElementById('brush-hardness').oninput = (e) => {
      brushHardness = parseInt(e.target.value, 10) / 100;
      document.getElementById('lbl-brush-hard').innerText = `${e.target.value}%`;
    };
    document.getElementById('brush-flow').oninput = (e) => {
      brushFlow = parseInt(e.target.value, 10) / 100;
      document.getElementById('lbl-brush-flow').innerText = `${e.target.value}%`;
    };

    // PBR Channel Inputs
    document.getElementById('brush-color').oninput = (e) => brushColor = e.target.value;
    document.getElementById('brush-rough').oninput = (e) => {
      brushRoughVal = parseInt(e.target.value, 10) / 100;
      document.getElementById('lbl-brush-rough').innerText = brushRoughVal.toFixed(2);
    };
    document.getElementById('brush-metal').oninput = (e) => {
      brushMetalVal = parseInt(e.target.value, 10) / 100;
      document.getElementById('lbl-brush-metal').innerText = brushMetalVal.toFixed(2);
    };
    document.getElementById('chan-color-en').onchange = (e) => enableColor = e.target.checked;
    document.getElementById('chan-rough-en').onchange = (e) => enableRough = e.target.checked;
    document.getElementById('chan-metal-en').onchange = (e) => enableMetal = e.target.checked;

    // Auto Unwrap UV Button
    document.getElementById('btn-unwrap-uv').onclick = () => {
      smartAtlasUnwrap(currentMesh.geometry);
    };

    // 3D Model Importer (OBJ / GLTF)
    document.getElementById('file-importer').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const ext = file.name.split('.').pop().toLowerCase();
      const reader = new FileReader();

      reader.onload = (ev) => {
        if (ext === 'obj') {
          const obj = new THREE.OBJLoader().parse(ev.target.result);
          obj.traverse((child) => {
            if (child.isMesh) setupLoadedMesh(child.geometry);
          });
        } else if (ext === 'gltf' || ext === 'glb') {
          new THREE.GLTFLoader().parse(ev.target.result, '', (gltf) => {
            gltf.scene.traverse((child) => {
              if (child.isMesh) setupLoadedMesh(child.geometry);
            });
          });
        }
      };

      if (ext === 'glb') reader.readAsArrayBuffer(file);
      else reader.readAsText(file);
    };

    function setupLoadedMesh(geom) {
      scene.remove(currentMesh);
      currentGeometry = geom;
      currentGeometry.computeBoundingBox();
      currentGeometry.center();

      const sz = new THREE.Vector3();
      currentGeometry.boundingBox.getSize(sz);
      const maxD = Math.max(sz.x, sz.y, sz.z);
      const scale = 2.4 / maxD;
      currentGeometry.scale(scale, scale, scale);

      if (!currentGeometry.attributes.uv) {
        smartAtlasUnwrap(currentGeometry);
      }

      currentMesh = new THREE.Mesh(currentGeometry, pbrMaterial);
      scene.add(currentMesh);
      compositePBRMaps(true);
    }

    // Export All PBR Maps
    document.getElementById('btn-export-all').onclick = () => {
      const maps = [
        { canvas: compAlbedo, name: 'texture_albedo.png' },
        { canvas: compRoughness, name: 'texture_roughness.png' },
        { canvas: compMetalness, name: 'texture_metallic.png' }
      ];
      maps.forEach((m, idx) => {
        setTimeout(() => {
          const a = document.createElement('a');
          a.download = m.name;
          a.href = m.canvas.toDataURL('image/png');
          a.click();
        }, idx * 300);
      });
    };

    // Resize
    window.onresize = () => {
      camera.aspect = container3D.clientWidth / container3D.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container3D.clientWidth, container3D.clientHeight);
    };

    // Initialize App
    createNewLayer('Base Material', true);
    createNewLayer('Details & Paint', false);
    switchTool('paint');
    smartAtlasUnwrap(currentGeometry);

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
