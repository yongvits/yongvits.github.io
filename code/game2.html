<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Sea Descent - เกมดำดิ่งลึกสมุทร</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            color: white;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
        }
        #depth-display {
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 15px;
            width: 80%;
        }
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background: #ffcc00;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="ui">
            <div id="depth-display">ความลึก: 0 ม.</div>
        </div>
        <div id="game-over">
            <h2>อับปางเสียแล้ว!</h2>
            <p id="final-depth"></p>
            <button onclick="resetGame()">เริ่มใหม่</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const depthDisplay = document.getElementById('depth-display');
        const gameOverScreen = document.getElementById('game-over');
        const finalDepthDisplay = document.getElementById('final-depth');

        let gameActive = true;
        let depth = 0;
        let score = 0;
        let obstacles = [];
        let particles = [];
        
        const player = {
            x: 200,
            y: 150,
            width: 40,
            height: 30,
            targetX: 200,
            speed: 0.15
        };

        // ตรวจสอบการเคลื่อนที่ (เม้าส์/ทัช)
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.clientX - rect.left;
        });

        canvas.addEventListener('touchstart', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.touches[0].clientX - rect.left;
            e.preventDefault();
        }, {passive: false});

        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.targetX = e.touches[0].clientX - rect.left;
            e.preventDefault();
        }, {passive: false});

        class Obstacle {
            constructor(depth) {
                this.width = 40 + Math.random() * 30;
                this.height = 25;
                
                // สุ่มว่ามาซ้ายหรือขวา
                this.side = Math.random() > 0.5 ? 'left' : 'right';
                this.x = this.side === 'left' ? -this.width : canvas.width + this.width;
                this.y = canvas.height + Math.random() * 100;
                
                // ความเร็วปลาตามความลึก
                const speedMult = 1 + (depth / 5000);
                this.speed = (2 + Math.random() * 3) * speedMult;
                if (this.side === 'right') this.speed *= -1;

                // เลือกชนิดปลาตามความลึก
                if (depth < 1000) {
                    this.emoji = "🐟"; // ปลาทั่วไป
                    this.color = "#ff6b6b";
                } else if (depth < 3000) {
                    this.emoji = "🦑"; // ปลาหมึก
                    this.color = "#a29bfe";
                } else if (depth < 6000) {
                    this.emoji = "🦈"; // ฉลาม
                    this.color = "#74b9ff";
                } else {
                    this.emoji = "🐙"; // สัตว์ประหลาดน้ำลึก
                    this.color = "#fab1a0";
                }
            }

            update() {
                this.x += this.speed;
                this.y -= 3; // เลื่อนขึ้น (เหมือนผู้เล่นจมลง)
            }

            draw() {
                ctx.font = `${this.width}px Arial`;
                ctx.fillText(this.emoji, this.x, this.y);
            }
        }

        function createBackground() {
            // ปรับสีพื้นหลังตามความลึก
            let darken = Math.min(depth / 100, 90); 
            let r = Math.max(79 - (depth/50), 5);
            let g = Math.max(172 - (depth/30), 5);
            let b = Math.max(254 - (depth/20), 20);
            
            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // วาดฟองอากาศเล็กๆ
            if (Math.random() < 0.1) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: canvas.height,
                    size: Math.random() * 5,
                    speed: 2 + Math.random() * 2
                });
            }

            ctx.fillStyle = "rgba(255,255,255,0.3)";
            particles.forEach((p, index) => {
                p.y -= p.speed;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                if (p.y < -10) particles.splice(index, 1);
            });
        }

        function update() {
            if (!gameActive) return;

            depth += 2;
            depthDisplay.innerText = `ความลึก: ${Math.floor(depth)} ม.`;

            // ขยับเรือดำน้ำ (Smooth Follow)
            player.x += (player.targetX - player.x) * player.speed;
            
            // ขอบเขตหน้าจอ
            if (player.x < 20) player.x = 20;
            if (player.x > canvas.width - 20) player.x = canvas.width - 20;

            // สร้างอุปสรรค
            if (Math.random() < 0.03 + (depth/100000)) {
                obstacles.push(new Obstacle(depth));
            }

            obstacles.forEach((obs, index) => {
                obs.update();
                
                // ตรวจสอบการชน
                const dx = player.x - obs.x;
                const dy = player.y - obs.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 30) {
                    gameOver();
                }

                // ลบปลาที่พ้นจอ
                if (obs.y < -50) obstacles.splice(index, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            createBackground();

            // วาดเรือดำน้ำ
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.fillStyle = "#ffcc00"; // ตัวเรือสีเหลือง
            ctx.beginPath();
            ctx.ellipse(0, 0, 25, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#333"; // หน้าต่าง
            ctx.beginPath();
            ctx.arc(10, -2, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#ffcc00";
            ctx.lineWidth = 4;
            ctx.beginPath(); // กล้องส่องเหนือหน้าผิวน้ำ (Periscope)
            ctx.moveTo(-5, -10);
            ctx.lineTo(-5, -20);
            ctx.lineTo(5, -20);
            ctx.stroke();
            ctx.restore();

            // วาดอุปสรรค
            obstacles.forEach(obs => obs.draw());

            if (gameActive) {
                requestAnimationFrame(() => {
                    update();
                    draw();
                });
            }
        }

        function gameOver() {
            gameActive = false;
            gameOverScreen.style.display = 'block';
            finalDepthDisplay.innerText = `คุณลงไปได้ลึกถึง: ${Math.floor(depth)} เมตร`;
        }

        function resetGame() {
            gameActive = true;
            depth = 0;
            obstacles = [];
            particles = [];
            player.x = 200;
            player.targetX = 200;
            gameOverScreen.style.display = 'none';
            draw();
        }

        // เริ่มเกม
        draw();
    </script>
</body>
</html>
