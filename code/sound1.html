<!DOCTYPE html>
<html lang="th">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no"/>
<title>Matrix Camera Spatial v6.0</title>

<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; font-family:system-ui; }

.ui{
  position:fixed; left:0; right:0; bottom:0;
  padding: 16px max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  z-index:20; pointer-events:none;
}
.panel{
  max-width:600px; margin:auto; padding:12px; border-radius:24px;
  background:rgba(0,10,0,.75); border:1px solid rgba(0,255,100,.3);
  backdrop-filter:blur(16px); color:#0f0; text-shadow: 0 0 5px rgba(0,255,0,0.5);

}

}

</style>
</head>

<body>

<div class="version">SPATIAL MATRIX v6.0<br>อนุภาคอิสระ + ทิศทางเสียงซ้าย/ขวา</div>

<canvas id="gl"></canvas>
<video id="cam" autoplay playsinline muted></video>

<button class="hide" id="hideBtn">ซ่อน UI</button>

<div class="ui" id="ui">
  <div class="panel">
    
    <div class="row" style="margin-top:0;">
      <button id="startBtn">เปิดกล้อง (Start)</button>
      <button id="switchCamBtn" class="btn-secondary">สลับหน้า/หลัง</button>
    </div>

    <div class="row">
      <select id="formation">
        <option value="polygon" selected>โหมด: Spatial Polygon</option>
        <option value="spider">โหมด: Spider Web</option>
        <option value="wave">โหมด: Glitch Wave</option>
        <option value="matrix">โหมด: Matrix Rain</option>
      </select>
      <select id="spriteShape">
        <option value="1" selected>รูปทรง: Circle</option>
        <option value="0">รูปทรง: Block (Matrix)</option>
        <option value="2">รูปทรง: Ring</option>
        <option value="3">รูปทรง: Diamond</option>
        <option value="4">รูปทรง: Cross</option>
        <option value="5">รูปทรง: Heart</option>
      </select>
    </div>

    <div class="row">
      <select id="palette">
        <option value="original" selected>สี: สีดั้งเดิมจากกล้อง</option>
        <option value="matrix">สี: Matrix Green</option>
        <option value="cyber">สี: Cyberpunk</option>
        <option value="rainbow">สี: Hologram</option>
        <option value="aurora">สี: Ghost White</option>
        <option value="fire">สี: Inferno</option>
        <option value="ocean">สี: Deep Ocean</option>
      </select>
    </div>

    <div class="stats" id="stats">รอการเชื่อมต่อกล้องและไมค์...</div>
  </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias:false, alpha:false, depth:false });
const video = document.getElementById('cam');
const ui = document.getElementById('ui');
const formationSelect = document.getElementById('formation');
const spriteSelect = document.getElementById('spriteShape');
const paletteSelect = document.getElementById('palette');
const stats = document.getElementById('stats');

const DEVICE = {
  cores: navigator.hardwareConcurrency || 4,
  memory: navigator.deviceMemory || 4,
  dpr: Math.min(window.devicePixelRatio || 1, 2)
};

const MAX_PARTICLES = DEVICE.memory >= 8 ? 20000 : 12000;
let currentActiveParticles = 4000; 
let width, height, aspect;
let facingMode = 'user';
let touch = { x: 0, y: 0, active: false };

function resize() {
  width = innerWidth; height = innerHeight;
  aspect = width / height;
  canvas.width = width * DEVICE.dpr;
  canvas.height = height * DEVICE.dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

document.getElementById('hideBtn').onclick = () => ui.classList.toggle('hidden');

window.addEventListener('pointerdown', (e) => { touch.active = true; updateTouch(e); });
window.addEventListener('pointermove', (e) => { if(touch.active) updateTouch(e); });
window.addEventListener('pointerup', () => { touch.active = false; });

function updateTouch(e) {
  touch.x = (e.clientX / width) * 2 - 1;
  touch.y = -(e.clientY / height) * 2 + 1;
}

// --- SHADERS ---
const vert = `
  attribute vec2 pos;
  attribute vec3 color;
  attribute float size;
  attribute float alpha;
  varying vec3 vColor;
  varying float vAlpha;
  void main() {
    gl_Position = vec4(pos, 0.0, 1.0);
    gl_PointSize = size;
    vColor = color;
    vAlpha = alpha;
  }
`;

const frag = `
  precision mediump float;
  varying vec3 vColor;
  varying float vAlpha;
  uniform int u_shape;
  void main() {
    vec2 uv = gl_PointCoord.xy - 0.5;
    float d = 0.0;
    float core = 0.0;
    
    if(u_shape == 0) { // Block
      d = max(abs(uv.x), abs(uv.y * 1.2));
      if (d > 0.5) discard;
      float detail = sin(uv.y * 15.0) * 0.5 + 0.5;
      core = smoothstep(0.4, 0.1, d);
      gl_FragColor = vec4(vColor * (1.0 + core) * (0.6 + detail*0.6), core * vAlpha);
      return;
    } 
    else if(u_shape == 1) { // Circle
      d = length(uv); core = smoothstep(0.5, 0.1, d);
    }
    else if(u_shape == 2) { // Ring
      d = length(uv); core = smoothstep(0.5, 0.3, d) - smoothstep(0.3, 0.1, d);
    }
    else if(u_shape == 3) { // Diamond
      d = abs(uv.x) + abs(uv.y); core = smoothstep(0.5, 0.1, d);
    }
    else if(u_shape == 4) { // Cross
      d = min(abs(uv.x), abs(uv.y)) + max(abs(uv.x), abs(uv.y))*0.2;
      core = smoothstep(0.2, 0.05, d) * smoothstep(0.5, 0.4, max(abs(uv.x), abs(uv.y)));
    }
    else if(u_shape == 5) { // Heart
      uv.y += 0.1; float a = atan(uv.x, uv.y) / 3.14159; float r = length(uv); float h = abs(a);
      float d2 = (13.0*h - 22.0*h*h + 10.0*h*h*h)/(6.0-5.0*h);
      core = smoothstep(0.5, 0.4, r/d2);
    }
    gl_FragColor = vec4(vColor * (1.0 + core), core * vAlpha);
  }
`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s;
}

const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, vert));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(program); gl.useProgram(program);

const loc = {
  pos: gl.getAttribLocation(program, 'pos'), color: gl.getAttribLocation(program, 'color'),
  size: gl.getAttribLocation(program, 'size'), alpha: gl.getAttribLocation(program, 'alpha'),
  shape: gl.getUniformLocation(program, 'u_shape')
};

const stride = 7;
let data, buffer;
const particles = [];

function initParticles() {
  const cols = Math.floor(Math.sqrt(MAX_PARTICLES * aspect));
  const rows = Math.floor(MAX_PARTICLES / cols);
  const actualParticles = cols * rows;
  
  data = new Float32Array(actualParticles * stride);
  buffer = gl.createBuffer();
  particles.length = 0;

  for(let i=0; i<actualParticles; i++) {
    let cx = i % cols; let cy = Math.floor(i / cols);
    let nx = (cx / cols) * 2 - 1; let ny = (cy / rows) * 2 - 1;
    particles.push({
      ox: nx * aspect, oy: -ny, // ตำแหน่งอ้างอิงบนรูป (ล็อคไว้ดึงสี)
      x: nx * aspect, y: -ny,   // ตำแหน่งปัจจุบัน (เคลื่อนที่อิสระได้)
      vx: 0, vy: 0,
      speed: Math.random() * 0.01 + 0.005,
      seed: Math.random() * 1000,   // ค่าประตัว (ทำให้ขยับไม่เหมือนกัน)
      pan: (nx + 1) / 2             // 0 = ซ้ายสุด, 1 = ขวาสุด (ไว้รับเสียงแยกซ้ายขวา)
    });
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, buffer); gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(loc.pos); gl.vertexAttribPointer(loc.pos, 2, gl.FLOAT, false, stride*4, 0);
  gl.enableVertexAttribArray(loc.color); gl.vertexAttribPointer(loc.color, 3, gl.FLOAT, false, stride*4, 8);
  gl.enableVertexAttribArray(loc.size); gl.vertexAttribPointer(loc.size, 1, gl.FLOAT, false, stride*4, 20);
  gl.enableVertexAttribArray(loc.alpha); gl.vertexAttribPointer(loc.alpha, 1, gl.FLOAT, false, stride*4, 24);
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
}
initParticles();

// --- STEREO AUDIO ENGINE ---
let audioCtx, splitter, analyserL, analyserR;
let freqL, freqR;
let audioStats = { L: {bass:0, mid:0}, R: {bass:0, mid:0}, globalLevel: 0 };

async function startAudio() {
  try {
    if(!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    
    // ตั้งค่าขอไมค์แบบ Stereo
    const stream = await navigator.mediaDevices.getUserMedia({ 
      audio: { channelCount: 2, echoCancellation: false, autoGainControl: false } 
    });
    const src = audioCtx.createMediaStreamSource(stream);
    
    // แยกแชนเนลซ้าย-ขวา
    splitter = audioCtx.createChannelSplitter(2);
    analyserL = audioCtx.createAnalyser(); analyserL.fftSize = 128;
    analyserR = audioCtx.createAnalyser(); analyserR.fftSize = 128;
    
    src.connect(splitter);
    splitter.connect(analyserL, 0); // ซ้าย
    splitter.connect(analyserR, 1); // ขวา
    
    freqL = new Uint8Array(analyserL.frequencyBinCount);
    freqR = new Uint8Array(analyserR.frequencyBinCount);
  } catch(err) { console.log("Audio Error", err); }
}

async function startCameraView() {
  if (video.srcObject) video.srcObject.getTracks().forEach(t => { if(t.kind === 'video') t.stop(); });
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode: facingMode }, audio:false });
    video.srcObject = stream;
    if(!analyserL) await startAudio();
  } catch(err) { alert('เปิดกล้องไม่ได้: ' + err.message); }
}

document.getElementById('startBtn').onclick = startCameraView;
document.getElementById('switchCamBtn').onclick = () => { facingMode = facingMode==='user'?'environment':'user'; startCameraView(); };

const camCanvas = document.createElement('canvas');
const camCtx = camCanvas.getContext('2d', { willReadFrequently:true });

function updateStereoAudio() {
  if(!analyserL) return;
  analyserL.getByteFrequencyData(freqL);
  analyserR.getByteFrequencyData(freqR);
  
  let bL=0, mL=0, bR=0, mR=0;
  for(let i=1; i<4; i++) { bL+=freqL[i]; bR+=freqR[i]; } // Bass
  for(let i=4; i<16; i++) { mL+=freqL[i]; mR+=freqR[i]; } // Mid
  
  audioStats.L.bass = (bL/3)/255; audioStats.L.mid = (mL/12)/255;
  audioStats.R.bass = (bR/3)/255; audioStats.R.mid = (mR/12)/255;
  audioStats.globalLevel = (audioStats.L.bass + audioStats.R.bass + audioStats.L.mid + audioStats.R.mid) / 4;
}

function getPalette(mode, v, x, y, r, g, b) {
  if(mode==='original') return [r/255, g/255, b/255];
  if(mode==='matrix') return [v*0.1, v*1.2 + 0.1, v*0.2];
  if(mode==='cyber') return x<0 ? [0, v*1.2, v*1.5] : [v*1.5, 0, v*1.2];
  if(mode==='aurora') return [v*1.2, v*1.2, v*1.5];
  if(mode==='fire') return [v*1.5, v*0.6, v*0.1];
  if(mode==='ocean') return [v*0.1, v*0.8, v*1.5];
  return [Math.sin(x*2.0)*v + v, Math.cos(y*2.0)*v + v, Math.sin((x+y)*2.0)*v + v]; 
}

function draw(now) {
  requestAnimationFrame(draw);
  const t = now * .001;
  updateStereoAudio();

  // ไดนามิกจำนวนอนุภาคตามเสียง
  let targetCount = MAX_PARTICLES * (0.25 + audioStats.globalLevel * 0.75);
  currentActiveParticles += (targetCount - currentActiveParticles) * 0.1;
  let renderCount = Math.min(MAX_PARTICLES, Math.floor(currentActiveParticles));

  const scale = DEVICE.memory >= 8 ? 300 : 200; 
  if(video.videoWidth) {
    const vAspect = video.videoWidth / video.videoHeight;
    camCanvas.width = scale; camCanvas.height = scale / vAspect;
    camCtx.save();
    if(facingMode === 'user') { camCtx.translate(camCanvas.width, 0); camCtx.scale(-1, 1); }
    camCtx.drawImage(video, 0, 0, camCanvas.width, camCanvas.height);
    camCtx.restore();

    const img = camCtx.getImageData(0, 0, camCanvas.width, camCanvas.height).data;
    const formation = formationSelect.value;
    const pShape = parseInt(spriteSelect.value);
    const pColor = paletteSelect.value;

    for(let i=0; i<renderCount; i++) {
      const p = particles[i];
      
      // คำนวณเสียงเฉพาะจุดของอนุภาคตัวนี้ (ซ้าย-ขวา Interpolation)
      // อนุภาคซ้ายสุด (pan=0) รับเสียง L 100%, ขวาสุด (pan=1) รับเสียง R 100%
      let leftWeight = 1.0 - p.pan;
      let rightWeight = p.pan;
      let localBass = (audioStats.L.bass * leftWeight) + (audioStats.R.bass * rightWeight);
      let localMid = (audioStats.L.mid * leftWeight) + (audioStats.R.mid * rightWeight);

      // 1. ฟิสิกส์สัมผัสหน้าจอ (Touch)
      if (touch.active) {
        let dx = p.x - touch.x * aspect; let dy = p.y - touch.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 0.35) {
          let repel = (0.35 - dist) * 0.2;
          p.vx += (dx/dist) * repel; p.vy += (dy/dist) * repel;
        }
      }

      // 2. ทิศทางลมและแรงระเบิดจากเสียง (อิสระระดับพิกเซลด้วย Seed)
      // ลมแยกทิศ (พัดอนุภาคไปคนละทิศคนละทาง)
      let windForceX = Math.sin(t * 3.0 + p.seed * 0.5) * localMid * 0.05;
      let windForceY = Math.cos(t * 2.5 + p.seed * 0.7) * localMid * 0.05;
      p.vx += windForceX;
      p.vy += windForceY;

      // ระเบิดออกจากเสียง (Directional Audio Burst)
      if (localBass > 0.6) {
        // ให้กระจายออกจากฝั่งที่เสียงดัง (ถ้าซ้ายดัง ผลักไปขวา)
        let pushDirX = rightWeight - leftWeight; 
        let blastForce = (localBass - 0.5) * 0.15;
        // ใส่ seed เพื่อให้แต่ละเม็ดกระเด็นด้วยความแรงไม่เท่ากัน
        p.vx += pushDirX * blastForce * (Math.sin(p.seed) + 1.2); 
        p.vy += (Math.cos(p.seed) * blastForce * 0.5);
      }

      // 3. ฟิสิกส์ดึงกลับเข้าฟอร์ม (Shape Formation)
      if (formation === 'matrix') {
        // Matrix ล็อคแกน X ให้อ่านออก แต่ยอมให้สั่นตามลมเสียงนิดๆ ได้
        p.x = p.ox + (windForceX * 0.5); 
        p.y -= p.speed * (1.0 + localBass * 2.0); 
        if(p.y < -1.2) p.y = 1.2; 
        p.vx = 0; p.vy = 0;
      } 
      else {
        // โหมดอื่นๆ ดึงกลับไปที่กริดภาพแบบอิสระ
        p.vx += (p.ox - p.x) * 0.04;
        p.vy += (p.oy - p.y) * 0.04;

        if(formation === 'wave') { p.vx += Math.sin(t + p.seed*0.1 + p.y*10) * 0.01 * localMid; }
        if(formation === 'spider') {
           const ang = (p.seed) * Math.PI * 2 + t;
           p.vx += Math.cos(ang*5) * 0.003; p.vy += Math.sin(ang*5) * 0.003;
        }
        
        p.vx *= 0.88; p.vy *= 0.88;
        p.x += p.vx; p.y += p.vy;
      }

      // 4. ดึงสีจากวิดีโอ (อิงจากตำแหน่งที่แท้จริง ox, oy เพื่อไม่ให้ภาพหน้าเละ)
      let sampleX = ((p.ox / aspect) * .5 + .5) * camCanvas.width | 0;
      let sampleY = (-p.oy * .5 + .5) * camCanvas.height | 0;
      
      let r = 0, g = 0, b = 0, strength = 0;
      if(sampleX >= 0 && sampleY >= 0 && sampleX < camCanvas.width && sampleY < camCanvas.height) {
        const idx = (sampleY * camCanvas.width + sampleX) * 4;
        r = img[idx]; g = img[idx+1]; b = img[idx+2];
        const luma = (0.299*r + 0.587*g + 0.114*b)/255;
        strength = Math.pow(luma, 1.4); 
      }

      // เรนเดอร์ลงจอ
      const col = getPalette(pColor, strength + localBass*0.3, p.ox, p.oy, r, g, b);
      const sizeBase = pShape === 0 ? 9.0 : 6.0;
      const size = (1.5 + strength * sizeBase + localBass * 5.0) * DEVICE.dpr;
      const alpha = Math.min(1.0, strength * 2.0 + localBass + 0.1);

      const o = i * stride;
      data[o]   = p.x / aspect;
      data[o+1] = p.y;
      data[o+2] = col[0];
      data[o+3] = col[1];
      data[o+4] = col[2];
      data[o+5] = size;
      data[o+6] = alpha;
    }
  }

  gl.clearColor(0, 0, 0, 1); 
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1i(loc.shape, pShape);
  
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, data);
  gl.drawArrays(gl.POINTS, 0, renderCount);

  let lBar = Math.round(audioStats.L.bass*100);
  let rBar = Math.round(audioStats.R.bass*100);
  stats.innerHTML = 
    `Camera: ${facingMode==='user'?'Front':'Back'} | Pt: ${renderCount.toLocaleString()}<br>` +
    (analyserL ? `[Stereo] L: ${lBar}% | R: ${rBar}%` : `Mic Muted`);
}

requestAnimationFrame(draw);

</script>
</body>
</html>


```
