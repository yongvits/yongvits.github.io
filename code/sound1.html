<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no" />
<title>Matrix Camera Particle System</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
  touch-action:none;
  font-family:system-ui;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

video{
  display:none;
}

.ui{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:16px;
  z-index:10;
}

.panel{
  max-width:520px;
  margin:auto;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;
  padding:14px;
  color:white;
}

.row{
  display:flex;
  gap:10px;
  margin-top:10px;
}

button,select{
  flex:1;
  border:0;
  border-radius:14px;
  padding:14px;
  color:white;
  background:#111827;
  font-weight:700;
}

button{
  background:linear-gradient(135deg,#00ff99,#00ccff);
  color:black;
}

.stats{
  font-size:12px;
  opacity:.8;
  margin-top:8px;
}

.hide{
  position:fixed;
  top:14px;
  right:14px;
  z-index:20;
  width:auto;
  padding:10px 14px;
  border-radius:999px;
}
</style>
</head>

<body>

<canvas id="c"></canvas>
<video id="cam" autoplay playsinline muted></video>

<button class="hide" id="hideBtn">Hide UI</button>

<div class="ui" id="ui">
<div class="panel">

<div><b>Matrix Particle Camera</b></div>

<div class="row">
<button id="startBtn">START CAMERA</button>
<button id="demoBtn">DEMO</button>
</div>

<div class="row">
<select id="shape">
<option value="matrix">Matrix</option>
<option value="polygon">Polygon</option>
<option value="spider">Spider</option>
<option value="wave">Wave</option>
</select>

<select id="palette">
<option value="matrix">Matrix Green</option>
<option value="cyber">Cyberpunk</option>
<option value="rainbow">Rainbow</option>
<option value="aurora">Aurora</option>
</select>
</div>

<div class="stats" id="stats">
FPS: 0
</div>

</div>
</div>

<script>
'use strict';

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl',{
  antialias:false,
  alpha:false
});

const video = document.getElementById('cam');

const ui = document.getElementById('ui');

const startBtn = document.getElementById('startBtn');
const demoBtn = document.getElementById('demoBtn');
const stats = document.getElementById('stats');
const shapeSelect = document.getElementById('shape');
const paletteSelect = document.getElementById('palette');

document.getElementById('hideBtn').onclick=()=>{
  ui.style.display = ui.style.display==='none'?'block':'none';
};

const DEVICE = {
  cores:navigator.hardwareConcurrency||4,
  memory:navigator.deviceMemory||4,
  dpr:Math.min(devicePixelRatio||1,2)
};

let PARTICLES = 12000;

if(DEVICE.cores>=8) PARTICLES+=12000;
if(DEVICE.memory>=8) PARTICLES+=18000;

PARTICLES=Math.min(PARTICLES,50000);

let width,height,aspect;

function resize(){
  width=innerWidth;
  height=innerHeight;
  aspect=width/height;

  canvas.width=width*DEVICE.dpr;
  canvas.height=height*DEVICE.dpr;

  gl.viewport(0,0,canvas.width,canvas.height);
}

addEventListener('resize',resize);
resize();

const vert=`
attribute vec2 pos;
attribute vec3 color;
attribute float size;

varying vec3 vColor;

uniform float time;
uniform float bass;

void main(){

vec2 p=pos;

p.x+=sin(time+p.y*8.0)*bass*0.03;
p.y+=cos(time+p.x*6.0)*bass*0.03;

gl_Position=vec4(p,0.0,1.0);

gl_PointSize=size;

vColor=color;
}
`;

const frag=`
precision mediump float;

varying vec3 vColor;

void main(){

vec2 uv=gl_PointCoord-0.5;

float d=length(uv);

float a=smoothstep(0.5,0.0,d);

gl_FragColor=vec4(vColor,a);
}
`;

function shader(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);
  gl.compileShader(s);
  return s;
}

const program=gl.createProgram();

gl.attachShader(program,shader(gl.VERTEX_SHADER,vert));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,frag));

gl.linkProgram(program);
gl.useProgram(program);

const loc={
  pos:gl.getAttribLocation(program,'pos'),
  color:gl.getAttribLocation(program,'color'),
  size:gl.getAttribLocation(program,'size'),
  time:gl.getUniformLocation(program,'time'),
  bass:gl.getUniformLocation(program,'bass')
};

const stride=6;

const data=new Float32Array(PARTICLES*stride);

const buffer=gl.createBuffer();

gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);

gl.enableVertexAttribArray(loc.pos);
gl.vertexAttribPointer(loc.pos,2,gl.FLOAT,false,stride*4,0);

gl.enableVertexAttribArray(loc.color);
gl.vertexAttribPointer(loc.color,3,gl.FLOAT,false,stride*4,8);

gl.enableVertexAttribArray(loc.size);
gl.vertexAttribPointer(loc.size,1,gl.FLOAT,false,stride*4,20);

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA,gl.ONE);

const particles=[];

for(let i=0;i<PARTICLES;i++){

particles.push({
x:(Math.random()*2-1)*aspect,
y:Math.random()*2-1,
vx:0,
vy:0,
size:1+Math.random()*4
});

}

let audioCtx;
let analyser;
let freq;

let bass=0;

async function startAudio(){

try{

audioCtx=new(window.AudioContext||window.webkitAudioContext)();

const stream=await navigator.mediaDevices.getUserMedia({
audio:true
});

const src=audioCtx.createMediaStreamSource(stream);

analyser=audioCtx.createAnalyser();

src.connect(analyser);

freq=new Uint8Array(analyser.frequencyBinCount);

}catch(e){

console.log(e);

}

}

async function startCamera(){

try{

const stream=await navigator.mediaDevices.getUserMedia({

video:{
facingMode:'environment'
},

audio:false

});

video.srcObject=stream;

await startAudio();

}catch(e){

alert('Camera/Mic permission denied');

console.log(e);

}

}

startBtn.onclick=startCamera;

const camCanvas=document.createElement('canvas');
const camCtx=camCanvas.getContext('2d',{willReadFrequently:true});

let prevFrame=null;

function getBass(){

if(!analyser)return 0;

analyser.getByteFrequencyData(freq);

let sum=0;

for(let i=1;i<12;i++){

sum+=freq[i];

}

bass=sum/11/255;

return bass;

}

function palette(mode,v,x){

if(mode==='matrix'){

return [0,0.8+v*0.2,0.3+v];

}

if(mode==='cyber'){

return x<0?
[0,1,v]:
[1,0,v];

}

if(mode==='aurora'){

return [
0.2+v,
0.8,
0.6+Math.sin(x*4)*0.3
];

}

return [
Math.sin(x)*0.5+0.5,
Math.cos(x*2)*0.5+0.5,
v
];

}

function draw(now){

requestAnimationFrame(draw);

const t=now*.001;

bass=getBass();

camCanvas.width=120;
camCanvas.height=90;

if(video.videoWidth){

camCtx.drawImage(video,0,0,120,90);

const frame=camCtx.getImageData(0,0,120,90);

const img=frame.data;

for(let i=0;i<PARTICLES;i++){

const p=particles[i];

const px=((p.x/aspect)*0.5+0.5)*120|0;
const py=((p.y)*-0.5+0.5)*90|0;

const idx=(py*120+px)*4;

const r=img[idx]||0;
const g=img[idx+1]||0;
const b=img[idx+2]||0;

const bright=(r+g+b)/3/255;

let motion=0;

if(prevFrame){

const pr=prevFrame[idx]||0;

motion=Math.abs(r-pr)/255;

}

const flow=motion*0.04;

p.vx+=(Math.random()-0.5)*flow;
p.vy+=(Math.random()-0.5)*flow;

if(shapeSelect.value==='matrix'){

p.vy-=0.0005-bright*0.002;

}

if(shapeSelect.value==='wave'){

p.vx+=Math.sin(t+p.y*10)*0.001;

}

if(shapeSelect.value==='polygon'){

const ang=(i/PARTICLES)*Math.PI*2;

const rad=.4+bass*.3;

const tx=Math.cos(ang)*rad*aspect;
const ty=Math.sin(ang)*rad;

p.vx+=(tx-p.x)*0.0008;
p.vy+=(ty-p.y)*0.0008;

}

if(shapeSelect.value==='spider'){

const ang=(i/PARTICLES)*Math.PI*2;

const tx=Math.cos(ang*8)*0.6*aspect;
const ty=Math.sin(ang*8)*0.6;

p.vx+=(tx-p.x)*0.0005;
p.vy+=(ty-p.y)*0.0005;

}

p.vx*=0.96;
p.vy*=0.96;

p.x+=p.vx;
p.y+=p.vy;

if(
p.x<-aspect||
p.x>aspect||
p.y<-1||
p.y>1
){

p.x=(Math.random()*2-1)*aspect;
p.y=Math.random()*2-1;

}

const col=palette(
paletteSelect.value,
bright+bass,
p.x
);

const o=i*stride;

data[o]=p.x/aspect;
data[o+1]=p.y;

data[o+2]=col[0];
data[o+3]=col[1];
data[o+4]=col[2];

data[o+5]=(1+bright*6+bass*8)*DEVICE.dpr;

}

prevFrame=img.slice(0);

}

gl.clearColor(0,0,0,.08);
gl.clear(gl.COLOR_BUFFER_BIT);

gl.uniform1f(loc.time,t);
gl.uniform1f(loc.bass,bass);

gl.bindBuffer(gl.ARRAY_BUFFER,buffer);

gl.bufferSubData(gl.ARRAY_BUFFER,0,data);

gl.drawArrays(gl.POINTS,0,PARTICLES);

stats.innerHTML=
'FPS: '+Math.round(1000/(performance.now()-lastFrame))+
'<br>Particles: '+PARTICLES+
'<br>Bass: '+bass.toFixed(2)+
'<br>CPU: '+DEVICE.cores+
'<br>RAM: '+DEVICE.memory+'GB';

lastFrame=performance.now();

}

let lastFrame=performance.now();

requestAnimationFrame(draw);

</script>

</body>
</html>
