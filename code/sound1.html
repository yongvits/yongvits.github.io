<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no"/>

<title>Matrix Camera Particles v2.7</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:black;
  touch-action:none;
  font-family:system-ui;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

video{
  display:none;
}

.ui{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  padding:
  16px
  max(16px,env(safe-area-inset-right))
  max(24px,env(safe-area-inset-bottom))
  max(16px,env(safe-area-inset-left));
  z-index:20;
}

.panel{
  max-width:560px;
  margin:auto;
  padding:14px;
  border-radius:24px;
  background:rgba(0,0,0,.55);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(14px);
  color:white;
}

.row{
  display:flex;
  gap:10px;
  margin-top:10px;
}

button,select{
  flex:1;
  border:0;
  border-radius:14px;
  padding:14px;
  font-weight:700;
  font-size:14px;
}

button{
  background:
  linear-gradient(
  135deg,
  #00ff88,
  #00ccff);
  color:black;
}

select{
  background:rgba(255,255,255,.08);
  color:white;
}

.hide{
  position:fixed;
  top:max(14px,env(safe-area-inset-top));
  right:max(14px,env(safe-area-inset-right));
  z-index:50;
  width:auto;
  padding:10px 14px;
  border-radius:999px;
}

.stats{
  margin-top:10px;
  font-size:12px;
  opacity:.8;
  line-height:1.5;
}

.version{
  position:fixed;
  left:12px;
  top:12px;
  z-index:40;
  color:rgba(255,255,255,.35);
  font-size:11px;
  letter-spacing:.12em;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="version">
v2.7 MATRIX CAMERA
</div>

<canvas id="gl"></canvas>

<video
id="cam"
autoplay
playsinline
muted>
</video>

<button
class="hide"
id="hideBtn">
Hide UI
</button>

<div class="ui" id="ui">
<div class="panel">

<div>
<b>Matrix Camera Particle System</b>
</div>

<div class="row">
<button id="startBtn">
START
</button>

<button id="demoBtn">
DEMO
</button>
</div>

<div class="row">

<select id="shape">
<option value="matrix">
Matrix
</option>

<option value="polygon">
Polygon
</option>

<option value="spider">
Spider
</option>

<option value="wave">
Wave
</option>

</select>

<select id="palette">

<option value="matrix">
Matrix Green
</option>

<option value="cyber">
Cyberpunk
</option>

<option value="rainbow">
Rainbow
</option>

<option value="aurora">
Aurora
</option>

</select>

</div>

<div class="stats" id="stats">
Waiting...
</div>

</div>
</div>

<script>
'use strict';

const canvas =
document.getElementById('gl');

const gl =
canvas.getContext('webgl',{
  antialias:false,
  alpha:false,
  depth:false
});

const video =
document.getElementById('cam');

const ui =
document.getElementById('ui');

const shapeSelect =
document.getElementById('shape');

const paletteSelect =
document.getElementById('palette');

const stats =
document.getElementById('stats');

const DEVICE={
  cores:navigator.hardwareConcurrency||4,
  memory:navigator.deviceMemory||4,
  dpr:Math.min(devicePixelRatio||1,2)
};

let PARTICLES=12000;

if(DEVICE.cores>=8)
PARTICLES+=12000;

if(DEVICE.memory>=8)
PARTICLES+=18000;

PARTICLES=
Math.min(PARTICLES,50000);

let width;
let height;
let aspect;

function resize(){

  width=innerWidth;
  height=innerHeight;

  aspect=
  width/height;

  canvas.width=
  width*DEVICE.dpr;

  canvas.height=
  height*DEVICE.dpr;

  gl.viewport(
  0,
  0,
  canvas.width,
  canvas.height
  );
}

addEventListener(
'resize',
resize
);

resize();

document
.getElementById('hideBtn')
.onclick=()=>{

ui.classList.toggle(
'hidden'
);

};

const vert=`

attribute vec2 pos;
attribute vec3 color;
attribute float size;
attribute float alpha;

varying vec3 vColor;
varying float vAlpha;

uniform float time;
uniform float bass;

void main(){

vec2 p=pos;

p.x+=
sin(
time+
p.y*12.0
)*bass*0.03;

p.y+=
cos(
time+
p.x*8.0
)*bass*0.03;

gl_Position=
vec4(
p,
0.0,
1.0
);

gl_PointSize=size;

vColor=color;
vAlpha=alpha;

}
`;

const frag=`

precision mediump float;

varying vec3 vColor;
varying float vAlpha;

void main(){

vec2 uv=
gl_PointCoord.xy
-.5;

float d=
length(uv);

float glow=
smoothstep(
.5,
0.0,
d
);

float core=
smoothstep(
.15,
0.0,
d
);

vec3 col=
vColor*
(1.0+core*2.0);

gl_FragColor=
vec4(
col,
glow*vAlpha
);

}
`;

function shader(type,src){

const s=
gl.createShader(type);

gl.shaderSource(s,src);

gl.compileShader(s);

return s;

}

const program=
gl.createProgram();

gl.attachShader(
program,
shader(
gl.VERTEX_SHADER,
vert
)
);

gl.attachShader(
program,
shader(
gl.FRAGMENT_SHADER,
frag
)
);

gl.linkProgram(program);

gl.useProgram(program);

const loc={

pos:
gl.getAttribLocation(
program,
'pos'
),

color:
gl.getAttribLocation(
program,
'color'
),

size:
gl.getAttribLocation(
program,
'size'
),

alpha:
gl.getAttribLocation(
program,
'alpha'
),

time:
gl.getUniformLocation(
program,
'time'
),

bass:
gl.getUniformLocation(
program,
'bass'
)

};

const stride=7;

const data=
new Float32Array(
PARTICLES*stride
);

const buffer=
gl.createBuffer();

gl.bindBuffer(
gl.ARRAY_BUFFER,
buffer
);

gl.bufferData(
gl.ARRAY_BUFFER,
data,
gl.DYNAMIC_DRAW
);

gl.enableVertexAttribArray(
loc.pos
);

gl.vertexAttribPointer(
loc.pos,
2,
gl.FLOAT,
false,
stride*4,
0
);

gl.enableVertexAttribArray(
loc.color
);

gl.vertexAttribPointer(
loc.color,
3,
gl.FLOAT,
false,
stride*4,
8
);

gl.enableVertexAttribArray(
loc.size
);

gl.vertexAttribPointer(
loc.size,
1,
gl.FLOAT,
false,
stride*4,
20
);

gl.enableVertexAttribArray(
loc.alpha
);

gl.vertexAttribPointer(
loc.alpha,
1,
gl.FLOAT,
false,
stride*4,
24
);

gl.enable(gl.BLEND);

gl.blendFunc(
gl.SRC_ALPHA,
gl.ONE
);

const particles=[];

for(let i=0;i<PARTICLES;i++){

particles.push({

x:
(Math.random()*2-1)
*aspect,

y:
Math.random()*2-1,

vx:0,
vy:0,

life:
Math.random(),

size:
1+Math.random()*4

});

}

let audioCtx;
let analyser;
let freq;

let bass=0;

async function startAudio(){

try{

audioCtx=
new(
window.AudioContext||
window.webkitAudioContext
)();

const stream=
await navigator
.mediaDevices
.getUserMedia({

audio:true

});

const src=
audioCtx
.createMediaStreamSource(
stream
);

analyser=
audioCtx
.createAnalyser();

analyser.fftSize=512;

src.connect(analyser);

freq=
new Uint8Array(
analyser.frequencyBinCount
);

}catch(err){

console.log(err);

}

}

async function startCamera(){

try{

const stream=
await navigator
.mediaDevices
.getUserMedia({

video:{
facingMode:'environment'
},

audio:false

});

video.srcObject=
stream;

await startAudio();

}catch(err){

alert(
'Camera/Mic Permission Denied'
);

console.log(err);

}

}

document
.getElementById('startBtn')
.onclick=
startCamera;

const camCanvas=
document.createElement('canvas');

const camCtx=
camCanvas.getContext(
'2d',
{
willReadFrequently:true
}
);

function updateBass(){

if(!analyser)
return 0;

analyser
.getByteFrequencyData(freq);

let sum=0;

for(let i=1;i<18;i++){

sum+=freq[i];

}

bass=
sum/18/255;

return bass;

}

function palette(
mode,
v,
x
){

if(mode==='matrix'){

return[
0,
0.8+v*.2,
0.3+v
];

}

if(mode==='cyber'){

return x<0
?
[0,1,v]
:
[1,0,v];

}

if(mode==='aurora'){

return[
0.2+v,
0.7,
0.5+
Math.sin(x*5)*.5
];

}

return[
Math.sin(x)*.5+.5,
Math.cos(x*2)*.5+.5,
v
];

}

let prevFrame=null;

function draw(now){

requestAnimationFrame(draw);

const t=
now*.001;

updateBass();

const scale=
DEVICE.memory>=8
?
320
:
220;

camCanvas.width=scale;
camCanvas.height=
scale*.75;

if(video.videoWidth){

camCtx.drawImage(
video,
0,
0,
camCanvas.width,
camCanvas.height
);

const frame=
camCtx.getImageData(
0,
0,
camCanvas.width,
camCanvas.height
);

const img=
frame.data;

for(let i=0;i<PARTICLES;i++){

const p=
particles[i];

const px=
(
(
p.x/aspect
)*.5+.5
)*camCanvas.width|0;

const py=
(
p.y*-.5+.5
)*camCanvas.height|0;

if(
px<0||
py<0||
px>=camCanvas.width||
py>=camCanvas.height
){
continue;
}

const idx=
(
py*
camCanvas.width+
px
)*4;

const r=
img[idx]||0;

const g=
img[idx+1]||0;

const b=
img[idx+2]||0;

const rr=
img[idx+4]||0;

const luma=
(
0.2126*r+
0.7152*g+
0.0722*b
)/255;

const edge=
Math.abs(r-rr)/255;

const strength=
luma*.4+
edge*.9;

if(
strength<0.18
){

p.life*=.9;

}else{

p.life+=.04;

}

p.life=
Math.max(
0,
Math.min(1,p.life)
);

let motion=0;

if(prevFrame){

const pr=
prevFrame[idx]||0;

motion=
Math.abs(r-pr)
/255;

}

const flow=
motion*.04;

p.vx+=
(Math.random()-.5)
*flow;

p.vy+=
(Math.random()-.5)
*flow;

const shape=
shapeSelect.value;

if(shape==='matrix'){

p.vy-=
0.0006-
strength*.003;

}

if(shape==='wave'){

p.vx+=
Math.sin(
t+p.y*10
)*0.001;

}

if(shape==='polygon'){

const ang=
(i/PARTICLES)
*Math.PI*2;

const rad=
.3+
bass*.35;

const tx=
Math.cos(ang)
*rad
*aspect;

const ty=
Math.sin(ang)
*rad;

p.vx+=
(tx-p.x)
*0.0012;

p.vy+=
(ty-p.y)
*0.0012;

}

if(shape==='spider'){

const ang=
(i/PARTICLES)
*Math.PI*2;

const tx=
Math.cos(ang*8)
*.55
*aspect;

const ty=
Math.sin(ang*8)
*.55;

p.vx+=
(tx-p.x)
*0.0008;

p.vy+=
(ty-p.y)
*0.0008;

}

const tx=
(
px/
camCanvas.width
)*2-1;

const ty=
-(
py/
camCanvas.height
)*2+1;

p.vx+=
(tx*aspect-p.x)
*strength
*0.002;

p.vy+=
(ty-p.y)
*strength
*0.002;

p.vx*=.94;
p.vy*=.94;

p.x+=p.vx;
p.y+=p.vy;

if(
Math.abs(p.x)>aspect||
Math.abs(p.y)>1.2
){

p.x=
(Math.random()*2-1)
*aspect;

p.y=
Math.random()*2-1;

}

const col=
palette(
paletteSelect.value,
strength+bass,
p.x
);

const size=
(
1+
strength*7+
bass*10
)
*DEVICE.dpr;

const alpha=
p.life*
Math.min(
1,
strength*2
);

const o=
i*stride;

data[o]=
p.x/aspect;

data[o+1]=
p.y;

data[o+2]=
col[0];

data[o+3]=
col[1];

data[o+4]=
col[2];

data[o+5]=
size;

data[o+6]=
alpha;

}

prevFrame=
img.slice(0);

}

gl.clearColor(
0,
0,
0,
0.08
);

gl.clear(
gl.COLOR_BUFFER_BIT
);

gl.uniform1f(
loc.time,
t
);

gl.uniform1f(
loc.bass,
bass
);

gl.bindBuffer(
gl.ARRAY_BUFFER,
buffer
);

gl.bufferSubData(
gl.ARRAY_BUFFER,
0,
data
);

gl.drawArrays(
gl.POINTS,
0,
PARTICLES
);

stats.innerHTML=
'FPS: '+
Math.round(
1000/
(
performance.now()
-lastFrame
)
)+

'<br>Particles: '+
PARTICLES+

'<br>Bass: '+
bass.toFixed(2)+

'<br>CPU: '+
DEVICE.cores+

'<br>RAM: '+
DEVICE.memory+
'GB';

lastFrame=
performance.now();

}

let lastFrame=
performance.now();

requestAnimationFrame(draw);

</script>

</body>
</html>
