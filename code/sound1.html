<!DOCTYPE html>

<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

<body>

<div class="version">3D AUDIO MATRIX v8.0<br>3D Analyzer / Matrix Interactive / Freeze on Silence</div>

<canvas id="gl"></canvas>
<video id="cam" autoplay playsinline muted></video>

<button class="hide" id="hideBtn">ซ่อน UI</button>

<div class="ui" id="ui">
  <div class="panel">
    
    <div class="row" style="margin-top:0;">
      <button id="startBtn">1. เปิดกล้อง/ไมค์</button>
      <button id="switchCamBtn" class="btn-secondary">สลับกล้อง</button>
    </div>

    <div class="row">
      <select id="formation">
        <option value="analyzer3d" selected>🚀 โหมด: 3D Music Analyzer (หมุนได้)</option>
        <option value="matrix">โหมด: Matrix Rain (Interactive)</option>
        <option value="polygon">โหมด: Spatial Polygon</option>
        <option value="spider">โหมด: Spider Web</option>
        <option value="wave">โหมด: Glitch Wave</option>
      </select>
      <select id="spriteShape">
        <option value="1" selected>รูปทรง: Circle</option>
        <option value="0">รูปทรง: Block</option>
        <option value="2">รูปทรง: Ring</option>
        <option value="3">รูปทรง: Diamond</option>
        <option value="4">รูปทรง: Cross</option>
        <option value="5">รูปทรง: Heart</option>
      </select>
    </div>

    <div class="row">
      <select id="palette">
        <option value="original" selected>สี: สีดั้งเดิมจากกล้อง</option>
        <option value="matrix">สี: Matrix Green</option>
        <option value="cyber">สี: Cyberpunk</option>
        <option value="rainbow">สี: Hologram</option>
        <option value="aurora">สี: Ghost White</option>
        <option value="fire">สี: Inferno</option>
        <option value="ocean">สี: Deep Ocean</option>
      </select>
    </div>

    <div class="stats" id="stats">รอการเชื่อมต่อ... (โหมด 3D ลากนิ้วเพื่อหมุนกล้อง)</div>
  </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias:false, alpha:false, depth:true });
const video = document.getElementById('cam');
const ui = document.getElementById('ui');
const formationSelect = document.getElementById('formation');
const spriteSelect = document.getElementById('spriteShape');
const paletteSelect = document.getElementById('palette');
const statsEl = document.getElementById('stats');

const DEVICE = {
  cores: navigator.hardwareConcurrency || 4,
  memory: navigator.deviceMemory || 4,
  dpr: Math.min(window.devicePixelRatio || 1, 2)
};

const MAX_PARTICLES = DEVICE.memory >= 8 ? 20000 : 12000;
let currentActiveParticles = 6000; 
let width, height, aspect;
let facingMode = 'user';

// Touch / 3D Rotation State
let touch = { x: 0, y: 0, dx: 0, dy: 0, active: false };
let lastTouch = { x: 0, y: 0 };
let rotX = 1.0; // หมุนมุมมองลงมา 3D
let rotY = 0.5; // หมุนรอบตัว 3D
let timeFreezeMultiplier = 0; // ควบคุมให้หยุดตอนไม่มีเสียง

function resize() {
  width = innerWidth; height = innerHeight;
  aspect = width / height;
  canvas.width = width * DEVICE.dpr;
  canvas.height = height * DEVICE.dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

document.getElementById('hideBtn').onclick = () => ui.classList.toggle('hidden');

// --- Input Handling ---
window.addEventListener('pointerdown', (e) => { 
  touch.active = true; 
  lastTouch.x = e.clientX; lastTouch.y = e.clientY;
  updateTouch(e); 
});
window.addEventListener('pointermove', (e) => { 
  if(!touch.active) return;
  touch.dx = e.clientX - lastTouch.x;
  touch.dy = e.clientY - lastTouch.y;
  lastTouch.x = e.clientX; lastTouch.y = e.clientY;
  
  if(formationSelect.value === 'analyzer3d') {
    // ลากนิ้วหมุนกล้อง 3D
    rotY += touch.dx * 0.01;
    rotX += touch.dy * 0.01;
    rotX = Math.max(0.1, Math.min(Math.PI/2, rotX)); // ล็อคมุมก้มเงย
  }
  updateTouch(e); 
});
window.addEventListener('pointerup', () => { touch.active = false; touch.dx = 0; touch.dy = 0; });

function updateTouch(e) {
  touch.x = (e.clientX / width) * 2 - 1;
  touch.y = -(e.clientY / height) * 2 + 1;
}

// --- SHADERS (รองรับ 3D Perspective) ---
const vert = `
  attribute vec3 pos;
  attribute vec3 color;
  attribute float size;
  attribute float alpha;
  
  varying vec3 vColor;
  varying float vAlpha;
  
  uniform float u_aspect;
  uniform float u_is3D;
  uniform vec2 u_rot; // rotX, rotY

  void main() {
    vec3 p = pos;
    float finalSize = size;
    
    if (u_is3D > 0.5) {
      // 3D Isometric / Perspective Math ใน WebGL
      p *= 1.3; // scale up
      p.y -= 0.3; // เลื่อนลงมากลางจอ
      
      // หมุนแกน X (Pitch)
      float cx = cos(u_rot.x); float sx = sin(u_rot.x);
      float y1 = p.y * cx - p.z * sx;
      float z1 = p.y * sx + p.z * cx;
      p.y = y1; p.z = z1;
      
      // หมุนแกน Y (Yaw)
      float cy = cos(u_rot.y); float sy = sin(u_rot.y);
      float x2 = p.x * cy + p.z * sy;
      float z2 = -p.x * sy + p.z * cy;
      p.x = x2; p.z = z2;
      
      // การยืดหด Perspective
      float zDepth = p.z + 2.5; 
      p.x /= zDepth * 0.6;
      p.y /= zDepth * 0.6;
      
      finalSize = size * (2.0 / zDepth);
    } 
    
    // จัดการ Aspect Ratio ใน Shader เลย (แก้ปัญหาภาพยืด)
    p.x /= u_aspect;
    
    gl_Position = vec4(p.x, p.y, 0.0, 1.0);
    gl_PointSize = finalSize;
    vColor = color;
    vAlpha = alpha;
  }
`;

const frag = `
  precision mediump float;
  varying vec3 vColor;
  varying float vAlpha;
  uniform int u_shape;
  
  void main() {
    vec2 uv = gl_PointCoord.xy - 0.5;
    float d = 0.0;
    float core = 0.0;
    
    if(u_shape == 0) { // Block
      d = max(abs(uv.x), abs(uv.y * 1.2));
      if (d > 0.5) discard;
      float detail = sin(uv.y * 15.0) * 0.5 + 0.5;
      core = smoothstep(0.4, 0.1, d);
      gl_FragColor = vec4(vColor * (1.0 + core) * (0.6 + detail*0.6), core * vAlpha);
      return;
    } 
    else {
      if(u_shape == 1) { // Circle
        d = length(uv); core = smoothstep(0.5, 0.1, d);
      } else if(u_shape == 2) { // Ring
        d = length(uv); core = smoothstep(0.5, 0.3, d) - smoothstep(0.3, 0.1, d);
      } else if(u_shape == 3) { // Diamond
        d = abs(uv.x) + abs(uv.y); core = smoothstep(0.5, 0.1, d);
      } else if(u_shape == 4) { // Cross
        d = min(abs(uv.x), abs(uv.y)) + max(abs(uv.x), abs(uv.y))*0.2;
        core = smoothstep(0.2, 0.05, d) * smoothstep(0.5, 0.4, max(abs(uv.x), abs(uv.y)));
      } else if(u_shape == 5) { // Heart
        uv.y += 0.1; float a = atan(uv.x, uv.y) / 3.14159; float r = length(uv); float h = abs(a);
        float d2 = (13.0*h - 22.0*h*h + 10.0*h*h*h)/(6.0-5.0*h);
        core = smoothstep(0.5, 0.4, r/d2);
      }
      gl_FragColor = vec4(vColor * (1.0 + core), core * vAlpha);
    }
  }
`;

function shader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); 
  return s;
}

const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, vert));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(program); gl.useProgram(program);

const loc = {
  pos: gl.getAttribLocation(program, 'pos'), color: gl.getAttribLocation(program, 'color'),
  size: gl.getAttribLocation(program, 'size'), alpha: gl.getAttribLocation(program, 'alpha'),
  shape: gl.getUniformLocation(program, 'u_shape'),
  aspect: gl.getUniformLocation(program, 'u_aspect'),
  is3D: gl.getUniformLocation(program, 'u_is3D'),
  rot: gl.getUniformLocation(program, 'u_rot')
};

// เปลี่ยน stride เป็น 8 รองรับแกน Z (x, y, z, r, g, b, size, alpha)
const stride = 8;
let data, buffer;
const particles = [];

function initParticles() {
  const cols = Math.floor(Math.sqrt(MAX_PARTICLES * aspect));
  const rows = Math.floor(MAX_PARTICLES / cols);
  const actualParticles = cols * rows;
  
  data = new Float32Array(actualParticles * stride);
  buffer = gl.createBuffer();
  particles.length = 0;

  for(let i=0; i<actualParticles; i++) {
    let cx = i % cols; let cy = Math.floor(i / cols);
    let nx = (cx / cols) * 2 - 1; let ny = (cy / rows) * 2 - 1;
    particles.push({
      ox: nx * aspect, oy: -ny, oz: 0, // ตำแหน่งอ้างอิงบนรูป
      x: nx * aspect, y: -ny, z: 0,    // ตำแหน่งปัจจุบัน
      vx: 0, vy: 0, vz: 0,
      speed: Math.random() * 0.015 + 0.005,
      seed: Math.random() * 1000,   
      pan: cx / cols
    });
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, buffer); gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
  gl.enableVertexAttribArray(loc.pos); gl.vertexAttribPointer(loc.pos, 3, gl.FLOAT, false, stride*4, 0); // 3 floats for pos
  gl.enableVertexAttribArray(loc.color); gl.vertexAttribPointer(loc.color, 3, gl.FLOAT, false, stride*4, 12); // offset 12
  gl.enableVertexAttribArray(loc.size); gl.vertexAttribPointer(loc.size, 1, gl.FLOAT, false, stride*4, 24); // offset 24
  gl.enableVertexAttribArray(loc.alpha); gl.vertexAttribPointer(loc.alpha, 1, gl.FLOAT, false, stride*4, 28); // offset 28
  gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
}
initParticles();

// --- AUDIO ENGINE ---
let audioCtx, analyser;
let freqData;
let audioStats = { bass:0, mid:0, treb:0, global: 0 };

// ประวัติคลื่นเสียงสำหรับ 3D Analyzer
const NUM_BINS = 128;
const HISTORY_ROWS = 100;
const audioHistory = Array.from({length: HISTORY_ROWS}, () => new Uint8Array(NUM_BINS));
let historyHead = 0;

async function startAudio() {
  try {
    if(!audioCtx) audioCtx = new(window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false } });
    const src = audioCtx.createMediaStreamSource(stream);
    
    analyser = audioCtx.createAnalyser(); 
    analyser.fftSize = 256; // ได้ 128 bins พอดีกับ 3D Grid
    
    src.connect(analyser);
    freqData = new Uint8Array(analyser.frequencyBinCount);
  } catch(err) { console.log("Audio Error:", err); }
}

async function startCameraView() {
  statsEl.innerHTML = "กำลังเข้าถึงกล้องและไมค์...";
  if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode: facingMode } });
    video.srcObject = stream;
    video.onloadedmetadata = () => { video.play().catch(e => console.error(e)); };
    if(!analyser) startAudio(); 
    statsEl.innerHTML = "ระบบกล้องทำงานปกติ";
  } catch(err) { alert('กรุณาอนุญาตกล้องและไมค์'); }
}

document.getElementById('startBtn').onclick = startCameraView;
document.getElementById('switchCamBtn').onclick = () => { facingMode = facingMode==='user'?'environment':'user'; startCameraView(); };

const camCanvas = document.createElement('canvas');
const camCtx = camCanvas.getContext('2d', { willReadFrequently:true });

function updateAudio() {
  if(!analyser) return;
  analyser.getByteFrequencyData(freqData);
  
  let b=0, m=0, t=0;
  for(let i=1; i<8; i++) b+=freqData[i]; 
  for(let i=8; i<30; i++) m+=freqData[i]; 
  for(let i=30; i<80; i++) t+=freqData[i]; 
  
  audioStats.bass = (b/7)/255; 
  audioStats.mid = (m/22)/255;
  audioStats.treb = (t/50)/255;
  audioStats.global = (audioStats.bass*1.5 + audioStats.mid + audioStats.treb*0.5) / 3.0;

  // อัปเดตประวัติ 3D Waterfall
  historyHead = (historyHead - 1 + HISTORY_ROWS) % HISTORY_ROWS;
  audioHistory[historyHead].set(freqData);
}

function getPalette(mode, v, x, y, r, g, b) {
  if(mode==='original') return [r/255, g/255, b/255];
  if(mode==='matrix') return [v*0.1, v*1.2 + 0.1, v*0.2];
  if(mode==='cyber') return x<0 ? [0, v*1.2, v*1.5] : [v*1.5, 0, v*1.2];
  if(mode==='aurora') return [v*1.2, v*1.2, v*1.5];
  if(mode==='fire') return [v*1.5, v*0.5, v*0.0];
  if(mode==='ocean') return [v*0.1, v*0.8, v*1.5];
  return [Math.sin(x*2.0)*v + v, Math.cos(y*2.0)*v + v, Math.sin((x+y)*2.0)*v + v]; 
}

function draw(now) {
  requestAnimationFrame(draw);
  const t = now * .001;
  updateAudio();

  // เงียบ = หยุดนิ่ง (Freeze on Silence)
  let isSilent = audioStats.global < 0.02;
  timeFreezeMultiplier += ((isSilent ? 0.02 : 1.0) - timeFreezeMultiplier) * 0.1;

  let targetCount = MAX_PARTICLES * (0.3 + audioStats.global * 0.7);
  currentActiveParticles += (targetCount - currentActiveParticles) * 0.1;
  let renderCount = Math.min(MAX_PARTICLES, Math.floor(currentActiveParticles));

  const scale = DEVICE.memory >= 8 ? 256 : 180; 
  let hasVideo = (video.readyState >= 2 && video.videoWidth > 0);

  if(hasVideo) {
    const vAspect = video.videoWidth / video.videoHeight;
    camCanvas.width = scale; camCanvas.height = scale / vAspect;
    camCtx.save();
    if(facingMode === 'user') { camCtx.translate(camCanvas.width, 0); camCtx.scale(-1, 1); }
    camCtx.drawImage(video, 0, 0, camCanvas.width, camCanvas.height);
    camCtx.restore();
  }

  const imgData = hasVideo ? camCtx.getImageData(0, 0, camCanvas.width, camCanvas.height).data : null;
  const formation = formationSelect.value;
  const pShape = parseInt(spriteSelect.value);
  const pColor = paletteSelect.value;
  const is3D = formation === 'analyzer3d';

  // ลมและระเบิด
  let windForceX = Math.sin(t * 3.0) * audioStats.mid * 0.05 * timeFreezeMultiplier;
  let windForceY = Math.cos(t * 2.5) * audioStats.mid * 0.05 * timeFreezeMultiplier;

  for(let i=0; i<renderCount; i++) {
    const p = particles[i];
    
    // --- 1. การคำนวณตำแหน่งเป้าหมาย 3D / 2D ---
    if (is3D) {
      // 3D SPECTRUM WATERFALL
      let colIdx = i % NUM_BINS;
      let rowIdx = Math.floor(i / NUM_BINS) % HISTORY_ROWS;
      
      let histIndex = (historyHead + rowIdx) % HISTORY_ROWS;
      let power = audioHistory[histIndex][colIdx] / 255.0;
      
      p.ox = (colIdx / NUM_BINS) * 2.0 - 1.0; 
      p.oz = (rowIdx / HISTORY_ROWS) * 2.0 - 1.0; 
      p.oy = power * 1.5; // ความสูง = พลังงานเสียง
      
      p.x += (p.ox - p.x) * 0.2;
      p.y += (p.oy - p.y) * 0.2;
      p.z += (p.oz - p.z) * 0.2;
    } 
    else {
      // โหมด 2D จัดการแกน z ให้แบน
      p.z += (0.0 - p.z) * 0.2; 
      
      // Touch Repel (แยกย้ายกันอย่างอิสระ)
      if (touch.active) {
        let dx = p.x - touch.x * aspect; let dy = p.y - touch.y;
        let dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 0.3) {
          let repel = (0.3 - dist) * 0.3;
          p.vx += (dx/dist) * repel; p.vy += (dy/dist) * repel;
        }
      }

      // Audio Blast ระดับพิกเซล (ทิศทางอิสระ)
      if (audioStats.bass > 0.5) {
        let blastForce = (audioStats.bass - 0.4) * 0.15 * (Math.sin(p.seed) + 1.2);
        p.vx += Math.cos(p.seed*10.0) * blastForce; 
        p.vy += Math.sin(p.seed*10.0) * blastForce;
      }

      if (formation === 'matrix') {
        p.vx += (p.ox - p.x) * 0.1; // ดึงกลับเข้าแกน X
        // ร่วงลงมา (หยุดร่วงเมื่อไม่มีเสียง timeFreezeMultiplier)
        p.y -= p.speed * (1.0 + audioStats.bass * 2.0) * timeFreezeMultiplier; 
        if(p.y < -1.2) p.y = 1.2; 
      } 
      else {
        p.vx += (p.ox - p.x) * 0.04;
        p.vy += (p.oy - p.y) * 0.04;
        p.vx += windForceX * (Math.sin(p.seed)+1.0);
        p.vy += windForceY * (Math.cos(p.seed)+1.0);
        
        if(formation === 'wave') { p.vx += Math.sin(t + p.seed*0.1 + p.y*10) * 0.02 * audioStats.mid * timeFreezeMultiplier; }
        if(formation === 'spider') {
           const ang = (p.seed) * Math.PI * 2 + t * timeFreezeMultiplier;
           p.vx += Math.cos(ang*5) * 0.005; p.vy += Math.sin(ang*5) * 0.005;
        }
      }

      p.vx *= 0.88; p.vy *= 0.88;
      p.x += p.vx; p.y += p.vy;
    }

    // --- 2. การดึงสีจากกล้องมาแปะใส่ ---
    let sampleX = 0, sampleY = 0;
    if (is3D) {
      // 3D Mode Map กล้องลงบนระนาบตาราง X-Z
      sampleX = ( (p.ox * 0.5 + 0.5) * camCanvas.width ) | 0;
      sampleY = ( (p.oz * 0.5 + 0.5) * camCanvas.height ) | 0;
    } else {
      // 2D Mode Map อิงจาก Original X-Y
      sampleX = ( (p.ox / aspect * 0.5 + 0.5) * camCanvas.width ) | 0;
      sampleY = ( (-p.oy * 0.5 + 0.5) * camCanvas.height ) | 0;
    }

    let r = 0, g = 255, b = 0, strength = 0.1;
    if(hasVideo && sampleX >= 0 && sampleY >= 0 && sampleX < camCanvas.width && sampleY < camCanvas.height) {
      const idx = (sampleY * camCanvas.width + sampleX) * 4;
      r = imgData[idx]; g = imgData[idx+1]; b = imgData[idx+2];
      const luma = (0.299*r + 0.587*g + 0.114*b)/255;
      strength = Math.pow(luma, 1.3); 
    }

    // ใน 3D Mode ถ้าสีเป็น Rainbow ให้มันไล่สีตามความสูง (เหมือนในรูปภาพอ้างอิง)
    let finalCol;
    if(is3D && pColor === 'rainbow') {
      finalCol = getPalette('fire', p.oy, p.ox, p.oz, r, g, b); // ใช้สีไฟตามความสูง
    } else {
      finalCol = getPalette(pColor, strength + audioStats.bass*0.2, p.ox, is3D ? p.oz : p.oy, r, g, b);
    }

    const sizeBase = pShape === 0 ? 10.0 : 7.0;
    let size = (1.5 + strength * sizeBase + audioStats.bass * 6.0) * DEVICE.dpr;
    if(is3D) size *= 1.2; // 3D ขยายจุดให้ดูเต็มๆ

    const alpha = Math.min(1.0, strength * 1.5 + audioStats.bass*1.2 + (is3D ? p.oy*2.0 : 0.15));

    const o = i * stride;
    data[o]   = p.x;
    data[o+1] = p.y;
    data[o+2] = p.z;
    data[o+3] = finalCol[0];
    data[o+4] = finalCol[1];
    data[o+5] = finalCol[2];
    data[o+6] = size;
    data[o+7] = alpha;
  }

  gl.clearColor(0, 0, 0, 1); 
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT); // เปิดใช้ Depth เพื่อ 3D
  
  gl.uniform1i(loc.shape, pShape);
  gl.uniform1f(loc.aspect, aspect);
  gl.uniform1f(loc.is3D, is3D ? 1.0 : 0.0);
  gl.uniform2f(loc.rot, rotX, rotY);
  
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, data);
  gl.drawArrays(gl.POINTS, 0, renderCount);

  if(analyser) {
    let bBar = Math.round(audioStats.bass*100);
    statsEl.innerHTML = `Pt: ${renderCount.toLocaleString()} | Vol: ${bBar}% | ${isSilent ? '🧊 หยุดนิ่ง' : '🎵 ทำงาน'}`;
  }
}

requestAnimationFrame(draw);

</script>
</body>
