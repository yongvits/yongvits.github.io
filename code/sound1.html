<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,user-scalable=no"/>
<title>Matrix Camera Particles PRO</title>

<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; width:100%; height:100%; overflow:hidden; background:#000; touch-action:none; font-family:system-ui; }
canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; }
video{ display:none; }

.ui{
  position:fixed; left:0; right:0; bottom:0;
  padding: 16px max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  z-index:20;
}
.panel{
  max-width:560px; margin:auto; padding:14px; border-radius:24px;
  background:rgba(0,10,0,.65); border:1px solid rgba(0,255,100,.2);
  backdrop-filter:blur(14px); color:#0f0; text-shadow: 0 0 5px rgba(0,255,0,0.5);
}
.row{ display:flex; gap:10px; margin-top:10px; }
button,select{
  flex:1; border:1px solid rgba(0,255,100,.3); border-radius:14px; padding:14px;
  font-weight:700; font-size:14px; cursor:pointer;
}
button{
  background: linear-gradient(135deg, #00ff41, #008f11); color:black;
  box-shadow: 0 0 15px rgba(0,255,65,0.3);
}
select{ background:rgba(0,20,0,.5); color:#00ff41; outline:none; }

.hide{
  position:fixed; top:max(14px,env(safe-area-inset-top)); right:max(14px,env(safe-area-inset-right));
  z-index:50; padding:10px 14px; border-radius:999px; background:rgba(0,20,0,0.6);
  color:#00ff41; border:1px solid rgba(0,255,100,.3); text-shadow:none;
}
.stats{ margin-top:10px; font-size:12px; opacity:.8; line-height:1.5; color:#aaffaa; }
.version{
  position:fixed; left:12px; top:max(12px,env(safe-area-inset-top)); z-index:40;
  color:rgba(0,255,65,.5); font-size:11px; letter-spacing:.12em;
}
.hidden{ display:none; }
</style>
</head>

<body>

<div class="version">MATRIX CAMERA PRO v3.0</div>

<canvas id="gl"></canvas>
<video id="cam" autoplay playsinline muted></video>

<button class="hide" id="hideBtn">Hide UI</button>

<div class="ui" id="ui">
  <div class="panel">
    <div><b>Matrix Digital Rain Core</b></div>
    
    <div class="row">
      <button id="startBtn">START SYSTEM</button>
      <button id="demoBtn" style="background:rgba(0,255,100,0.2); color:#00ff41;">DEMO</button>
    </div>

    <div class="row">
      <select id="shape">
        <option value="matrix" selected>Matrix Rain (Clear)</option>
        <option value="polygon">Polygon Fly</option>
        <option value="spider">Spider Web</option>
        <option value="wave">Glitch Wave</option>
      </select>
      <select id="palette">
        <option value="matrix" selected>Terminal Green</option>
        <option value="cyber">Cyberpunk</option>
        <option value="rainbow">Hologram</option>
        <option value="aurora">Ghost White</option>
      </select>
    </div>

    <div class="stats" id="stats">Awaiting Connection...</div>
  </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl', { antialias:false, alpha:false, depth:false });
const video = document.getElementById('cam');
const ui = document.getElementById('ui');
const shapeSelect = document.getElementById('shape');
const paletteSelect = document.getElementById('palette');
const stats = document.getElementById('stats');

const DEVICE = {
  cores: navigator.hardwareConcurrency || 4,
  memory: navigator.deviceMemory || 4,
  dpr: Math.min(window.devicePixelRatio || 1, 2)
};

// ใช้จำนวนอนุภาคให้พอดีกับตาราง Grid เพื่อความคมชัด
let targetParticles = DEVICE.memory >= 8 ? 25000 : 15000;
let PARTICLES = 0; 
let width, height, aspect;

function resize() {
  width = innerWidth; height = innerHeight;
  aspect = width / height;
  canvas.width = width * DEVICE.dpr;
  canvas.height = height * DEVICE.dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

document.getElementById('hideBtn').onclick = () => ui.classList.toggle('hidden');

// --- SHADERS ---
const vert = `
  attribute vec2 pos;
  attribute vec3 color;
  attribute float size;
  attribute float alpha;
  varying vec3 vColor;
  varying float vAlpha;
  uniform float time;
  uniform float bass;

  void main() {
    gl_Position = vec4(pos, 0.0, 1.0);
    gl_PointSize = size;
    vColor = color;
    vAlpha = alpha;
  }
`;

const frag = `
  precision mediump float;
  varying vec3 vColor;
  varying float vAlpha;

  void main() {
    vec2 uv = gl_PointCoord.xy - 0.5;
    // ทรงสี่เหลี่ยม (Block) สไตล์ Matrix
    float d = max(abs(uv.x), abs(uv.y * 1.2));
    if (d > 0.5) discard;
    
    // ลวดลายคล้ายตัวอักษรหรือสแกนไลน์ภายใน Block
    float detail = sin(uv.y * 15.0) * 0.5 + 0.5;
    float core = smoothstep(0.4, 0.1, d);
    vec3 col = vColor * (1.0 + core * 1.2) * (0.6 + detail * 0.6);
    
    gl_FragColor = vec4(col, core * vAlpha);
  }
`;

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}

const program = gl.createProgram();
gl.attachShader(program, shader(gl.VERTEX_SHADER, vert));
gl.attachShader(program, shader(gl.FRAGMENT_SHADER, frag));
gl.linkProgram(program);
gl.useProgram(program);

const loc = {
  pos: gl.getAttribLocation(program, 'pos'),
  color: gl.getAttribLocation(program, 'color'),
  size: gl.getAttribLocation(program, 'size'),
  alpha: gl.getAttribLocation(program, 'alpha'),
  time: gl.getUniformLocation(program, 'time'),
  bass: gl.getUniformLocation(program, 'bass')
};

const stride = 7;
let data, buffer;
const particles = [];

// ฟังก์ชันสร้าง Grid ให้อนุภาคเรียงตัวสวยงาม = ภาพชัด
function initParticles() {
  const cols = Math.floor(Math.sqrt(targetParticles * aspect));
  const rows = Math.floor(targetParticles / cols);
  PARTICLES = cols * rows;
  
  data = new Float32Array(PARTICLES * stride);
  buffer = gl.createBuffer();
  particles.length = 0;

  for(let i=0; i<PARTICLES; i++) {
    let cx = i % cols;
    let cy = Math.floor(i / cols);
    let nx = (cx / cols) * 2 - 1;
    let ny = (cy / rows) * 2 - 1;

    particles.push({
      ox: nx * aspect, // ตำแหน่งล็อคแกน X
      oy: -ny,         
      x: nx * aspect,
      y: (Math.random() * 2 - 1), // สุ่มตำแหน่งเริ่มต้น
      vx: 0, vy: 0,
      life: Math.random(),
      speed: Math.random() * 0.015 + 0.005, // ความเร็วในการตกของแต่ละเส้น
      seed: Math.random()
    });
  }

  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
  
  gl.enableVertexAttribArray(loc.pos);
  gl.vertexAttribPointer(loc.pos, 2, gl.FLOAT, false, stride*4, 0);
  gl.enableVertexAttribArray(loc.color);
  gl.vertexAttribPointer(loc.color, 3, gl.FLOAT, false, stride*4, 8);
  gl.enableVertexAttribArray(loc.size);
  gl.vertexAttribPointer(loc.size, 1, gl.FLOAT, false, stride*4, 20);
  gl.enableVertexAttribArray(loc.alpha);
  gl.vertexAttribPointer(loc.alpha, 1, gl.FLOAT, false, stride*4, 24);
  
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
}
initParticles();

// --- AUDIO & CAMERA ---
let audioCtx, analyser, freq, bass=0;

async function startAudio() {
  try {
    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    freq = new Uint8Array(analyser.frequencyBinCount);
  } catch(err) { console.log(err); }
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user' }, audio:false });
    video.srcObject = stream;
    await startAudio();
  } catch(err) {
    alert('ต้องการสิทธิ์เข้าถึงกล้องเพื่อทำงาน');
  }
}

document.getElementById('startBtn').onclick = startCamera;
document.getElementById('demoBtn').onclick = () => { /* Play demo video if needed, or just react to noise */ };

const camCanvas = document.createElement('canvas');
const camCtx = camCanvas.getContext('2d', { willReadFrequently:true });

function updateBass() {
  if(!analyser) return 0;
  analyser.getByteFrequencyData(freq);
  let sum=0; for(let i=1; i<18; i++) sum+=freq[i];
  bass = sum/18/255;
  return bass;
}

function palette(mode, v, x) {
  // v = ความสว่าง (strength)
  if(mode==='matrix') return [v*0.1, v*1.2 + 0.1, v*0.2]; // เขียว Matrix สว่างตรงใบหน้า
  if(mode==='cyber') return x<0 ? [0, v*1.2, v*1.5] : [v*1.5, 0, v*1.2]; // ชมพู-ฟ้า
  if(mode==='aurora') return [v*1.5, v*1.5, v*1.5]; // ขาว/เทา ผีๆ
  return [Math.sin(x)*v, Math.cos(x*2)*v, v*1.5]; // Rainbow
}

function draw(now) {
  requestAnimationFrame(draw);
  const t = now * .001;
  updateBass();

  // เพิ่ม Resolution กล้องให้ชัดขึ้น
  const scale = DEVICE.memory >= 8 ? 400 : 256; 
  
  if(video.videoWidth) {
    const vAspect = video.videoWidth / video.videoHeight;
    camCanvas.width = scale;
    camCanvas.height = scale / vAspect;
    
    // กลับซ้ายขวาให้เหมือนกระจก
    camCtx.save();
    camCtx.translate(camCanvas.width, 0);
    camCtx.scale(-1, 1);
    camCtx.drawImage(video, 0, 0, camCanvas.width, camCanvas.height);
    camCtx.restore();

    const frame = camCtx.getImageData(0, 0, camCanvas.width, camCanvas.height);
    const img = frame.data;

    for(let i=0; i<PARTICLES; i++) {
      const p = particles[i];
      const shape = shapeSelect.value;

      // PHYSICS LOGIC
      if (shape === 'matrix') {
        // ล็อคแกน X ให้อยู่ในคอลัมน์ (เพื่อความชัด)
        p.x += (p.ox - p.x) * 0.2; 
        p.vx = 0; p.vy = 0;
        // ตกลงมาเรื่อยๆ
        p.y -= p.speed * (1.0 + bass * 1.5);
        if(p.y < -1.1) p.y = 1.1; 
      } else {
        // โหมดอื่นๆ ปล่อยให้ลอยอิสระ
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95; p.vy *= 0.95;
        if(Math.abs(p.x) > aspect || Math.abs(p.y) > 1.2) {
          p.x = p.ox; p.y = p.oy; 
        }
      }

      // MAP TO CAMERA PIXELS
      const px = ((p.x / aspect) * .5 + .5) * camCanvas.width | 0;
      const py = (-p.y * .5 + .5) * camCanvas.height | 0;

      let strength = 0;
      if(px >= 0 && py >= 0 && px < camCanvas.width && py < camCanvas.height) {
        const idx = (py * camCanvas.width + px) * 4;
        const r = img[idx]; const g = img[idx+1]; const b = img[idx+2];
        // คำนวณความสว่าง High Contrast
        const luma = (0.299*r + 0.587*g + 0.114*b)/255;
        strength = Math.pow(luma, 1.4); // ยิ่งสว่างยิ่งชัด (Contrast Boost)
      }

      // EFFECTS FOR NON-MATRIX SHAPES
      if (shape === 'polygon') {
        const ang = (i/PARTICLES)*Math.PI*2 + t;
        const rad = .4 + bass*.4 + strength*.2;
        p.vx += (Math.cos(ang)*rad*aspect - p.x) * 0.001;
        p.vy += (Math.sin(ang)*rad - p.y) * 0.001;
      } else if (shape === 'spider') {
        const ang = (i/PARTICLES)*Math.PI*2;
        p.vx += (Math.cos(ang*10)*.6*aspect - p.x) * 0.001;
        p.vy += (Math.sin(ang*10)*.6 - p.y) * 0.001;
      } else if (shape === 'wave') {
        p.vx += Math.sin(t + p.y*15) * 0.002 * strength;
        p.vy -= 0.001;
      }

      // RENDERING DATA
      const col = palette(paletteSelect.value, strength + bass*0.2, p.x);
      
      // อนุภาคจะใหญ่และสว่างขึ้นเมื่อตรงกับส่วนที่สว่างของภาพ
      const sizeBase = shape === 'matrix' ? 8.0 : 6.0;
      const size = (1.5 + strength * sizeBase + bass * 5) * DEVICE.dpr;
      
      // Alpha ปรับตามความสว่างของภาพ
      const alpha = Math.min(1.0, strength * 2.0 + 0.1);

      const o = i * stride;
      data[o]   = p.x / aspect;
      data[o+1] = p.y;
      data[o+2] = col[0];
      data[o+3] = col[1];
      data[o+4] = col[2];
      data[o+5] = size;
      data[o+6] = alpha;
    }
  }

  gl.clearColor(0, 0, 0, 1); // สีดำสนิท
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(loc.time, t);
  gl.uniform1f(loc.bass, bass);
  
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, data);
  gl.drawArrays(gl.POINTS, 0, PARTICLES);

  stats.innerHTML = 
    'Resolution: ' + (camCanvas.width || 0) + 'px<br>' +
    'Particles: ' + PARTICLES.toLocaleString() + '<br>' +
    'Audio Sync: ' + (bass > 0 ? 'ACTIVE' : 'IDLE');
}

requestAnimationFrame(draw);

</script>
</body>
</html>
