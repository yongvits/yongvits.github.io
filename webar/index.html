<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Image AR + Recorder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160/examples/js/loaders/GLTFLoader.js"></script>

  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: black; }
    #ui { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 10; }
    button { padding: 10px 14px; font-size: 14px; margin: 0 4px; border-radius: 8px; }
  </style>
</head>

<body>

<div id="ui">
  <button onclick="startRecord()">● REC</button>
  <button onclick="stopRecord()">■ STOP</button>
</div>

<script src="recorder.js"></script>

<script type="module">
const mindarThree = new window.MINDAR.IMAGE.MindARThree({
  container: document.body,
  imageTargetSrc: './targets.mind',
});

const { renderer, scene, camera } = mindarThree;

const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
scene.add(light);

const anchor = mindarThree.addAnchor(0);

const loader = new THREE.GLTFLoader();
loader.load('./model/product.glb', gltf => {
  gltf.scene.scale.set(0.5, 0.5, 0.5);
  anchor.group.add(gltf.scene);
});

await mindarThree.start();
renderer.setAnimationLoop(() => {
  renderer.render(scene, camera);
});
</script>

</body>
</html>
