<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        /* ปุ่มสำหรับกด */
        #record-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background-color: white;
            border: 4px solid #ccc;
            border-radius: 50%;
            z-index: 1000;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none; 
            -webkit-user-select: none;
            touch-action: none; 
        }

        /* วงกลมสีแดงข้างใน */
        #record-btn::after {
            content: '';
            width: 60px;
            height: 60px;
            background-color: #ff3b30;
            border-radius: 50%;
            transition: all 0.2s;
        }

        /* Effect ตอนกดค้าง (อัดวีดีโอ) */
        #record-btn.recording::after {
            width: 30px;
            height: 30px;
            border-radius: 4px; 
        }
        
        /* ข้อความสถานะ */
        #status-text {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="status-text">Tap to Snap / Hold to Record</div>

    <div id="record-btn"></div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights; preserveDrawingBuffer: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="product-model" src="./model/product.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#product-model" 
                          rotation="0 0 0" 
                          position="0 0 0" 
                          scale="0.5 0.5 0.5">
            </a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        const btn = document.getElementById('record-btn');
        const statusText = document.getElementById('status-text');
        const scene = document.querySelector('a-scene');
        
        let mediaRecorder;
        let recordedChunks = [];
        let pressTimer;
        let isLongPress = false;
        let isRecording = false;

        // ฟังก์ชันถ่ายรูป (Screenshot)
        function takeScreenshot() {
            const canvas = scene.components.screenshot.getCanvas('perspective');
            // เปลี่ยนชื่อไฟล์เป็น .png
            const dataURL = canvas.toDataURL("image/png");
            
            const link = document.createElement("a");
            link.download = "ar-photo-" + Date.now() + ".png";
            link.href = dataURL;
            link.click();
            
            showStatus("Saved Image! 📸");
        }

        // ฟังก์ชันเริ่มอัดวีดีโอ
        function startRecording() {
            const canvas = scene.canvas;
            // ดึง Stream (30 FPS เพื่อความลื่น)
            const stream = canvas.captureStream(30); 
            
            // ตั้งค่าให้พยายามเป็น MP4 หรือ Format ที่ใกล้เคียงที่สุด
            let mimeType = 'video/webm'; // Default ของ Chrome/Android
            
            if (MediaRecorder.isTypeSupported('video/mp4')) {
                mimeType = 'video/mp4'; // Safari มักจะรองรับอันนี้
            } else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264')) {
                mimeType = 'video/webm;codecs=h264'; // Chrome บางเครื่อง
            }

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    
                    // บังคับชื่อไฟล์เป็น .mp4 (Browser ส่วนใหญ่จะยอมให้โหลดและเล่นได้)
                    a.download = 'ar-video-' + Date.now() + '.mp4';
                    
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    recordedChunks = []; 
                    
                    showStatus("Saved Video! 🎥");
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add("recording");
                showStatus("Recording... 🔴");
            } catch (e) {
                console.error("Recording Error:", e);
                showStatus("Error: Browser not supported ❌");
                isRecording = false;
                btn.classList.remove("recording");
            }
        }

        // ฟังก์ชันหยุดอัด
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            btn.classList.remove("recording");
        }

        function showStatus(text) {
            statusText.innerText = text;
            setTimeout(() => {
                if(!isRecording) statusText.innerText = "Tap to Snap / Hold to Record";
            }, 2000);
        }

        // --- Event Handlers ---
        
        function handlePressStart(e) {
            if (e.cancelable) e.preventDefault();
            isLongPress = false;
            
            pressTimer = setTimeout(() => {
                isLongPress = true;
                startRecording();
            }, 500); // กดค้าง 0.5 วิ ถึงจะอัด
        }

        function handlePressEnd(e) {
            if (e.cancelable) e.preventDefault();
            clearTimeout(pressTimer); 

            if (isLongPress) {
                stopRecording();
            } else {
                if (!isRecording) {
                    takeScreenshot();
                }
            }
        }

        btn.addEventListener('touchstart', handlePressStart);
        btn.addEventListener('touchend', handlePressEnd);
        
        btn.addEventListener('mousedown', handlePressStart);
        btn.addEventListener('mouseup', handlePressEnd);

    </script>
</body>
</html>
