<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>WebAR Link to Website</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>

    <script>
        // สร้าง Component สำหรับคลิกแล้วไปหน้าเว็บ
        AFRAME.registerComponent('navigate-on-click', {
            schema: {
                url: { default: '' }
            },
            init: function () {
                var data = this.data;
                var el = this.el;

                // เมื่อมีการคลิก (Click/Tap) ที่โมเดล
                el.addEventListener('click', function () {
                    // สั่งให้เปิดหน้าเว็บ
                    window.location.href = data.url; 
                });
            }
        });
    </script>
    
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2; filterMinCF:0.0001; filterBeta: 0.001;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="model-AR1" src="./model/AR1.glb"></a-asset-item>
            <a-asset-item id="model-AR2" src="./model/AR2.glb"></a-asset-item>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;" raycaster="far: 10000; objects: .clickable">
        </a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model 
                src="#model-AR1" 
                rotation="90 0 0" 
                position="0 0 0" 
                scale="1 1 1" 
                animation-mixer
                class="clickable" 
                navigate-on-click="url: https://mushroom-studio.com"> 
            </a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1">
            <a-gltf-model 
                src="#model-AR2" 
                rotation="90 0 0" 
                position="0 0 0" 
                scale="1 1 1" 
                animation-mixer
                class="clickable" 
                navigate-on-click="url: https://mushroom-studio.com">
            </a-gltf-model>
        </a-entity>
        
    </a-scene>

</body>
</html>
