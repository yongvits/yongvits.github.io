<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        /* ปุ่มสำหรับกด */
        #record-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 80px;
            background-color: white;
            border: 4px solid #ccc;
            border-radius: 50%;
            z-index: 1000;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ป้องกันการเลือก text เวลาแตะค้างบนมือถือ */
            user-select: none; 
            -webkit-user-select: none;
            touch-action: none; 
        }

        /* วงกลมสีแดงข้างใน */
        #record-btn::after {
            content: '';
            width: 60px;
            height: 60px;
            background-color: #ff3b30;
            border-radius: 50%;
            transition: all 0.2s;
        }

        /* Effect ตอนกดค้าง (อัดวีดีโอ) */
        #record-btn.recording::after {
            width: 30px;
            height: 30px;
            border-radius: 4px; /* เปลี่ยนเป็นสี่เหลี่ยมตอนอัด */
        }
        
        /* ข้อความสถานะ */
        #status-text {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 10px;
            font-family: sans-serif;
            font-size: 14px;
            pointer-events: none; /* กดทะลุได้ */
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="status-text">Tap to Snap / Hold to Record</div>

    <div id="record-btn"></div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights; preserveDrawingBuffer: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-box position="0 0 0.5" rotation="0 45 0" color="#4CC3D9" 
                   animation="property: rotation; to: 0 405 0; dur: 2000; easing: linear; loop: true">
            </a-box>
        </a-entity>
    </a-scene>

    <script>
        const btn = document.getElementById('record-btn');
        const statusText = document.getElementById('status-text');
        const scene = document.querySelector('a-scene');
        
        let mediaRecorder;
        let recordedChunks = [];
        let pressTimer;
        let isLongPress = false;
        let isRecording = false;

        // ฟังก์ชันถ่ายรูป (Screenshot)
        function takeScreenshot() {
            // ดึงภาพจาก Canvas ของ A-Frame
            const canvas = scene.components.screenshot.getCanvas('perspective');
            const dataURL = canvas.toDataURL("image/png");
            
            // สร้างลิงก์ดาวน์โหลด
            const link = document.createElement("a");
            link.download = "ar-snap-" + Date.now() + ".png";
            link.href = dataURL;
            link.click();
            
            showStatus("Saved Image! 📸");
        }

        // ฟังก์ชันเริ่มอัดวีดีโอ
        function startRecording() {
            const canvas = scene.canvas;
            // ดึง Stream (25 FPS)
            const stream = canvas.captureStream(25); 
            
            try {
                // พยายามใช้ mimeType ที่รองรับทั่วโลก
                const options = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') 
                    ? { mimeType: 'video/webm;codecs=vp9' } 
                    : { mimeType: 'video/webm' };
                
                mediaRecorder = new MediaRecorder(stream, options);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'ar-video-' + Date.now() + '.webm';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    recordedChunks = []; // Clear buffer
                    
                    showStatus("Saved Video! 🎥");
                };

                mediaRecorder.start();
                isRecording = true;
                btn.classList.add("recording");
                showStatus("Recording... 🔴");
            } catch (e) {
                console.error(e);
                showStatus("Error Recording ❌");
            }
        }

        // ฟังก์ชันหยุดอัด
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            isRecording = false;
            btn.classList.remove("recording");
        }

        function showStatus(text) {
            statusText.innerText = text;
            // คืนค่าเดิมหลังจาก 2 วิ
            setTimeout(() => {
                if(!isRecording) statusText.innerText = "Tap to Snap / Hold to Record";
            }, 2000);
        }

        // --- Event Handlers ---
        
        function handlePressStart(e) {
            if (e.cancelable) e.preventDefault();
            isLongPress = false;
            
            // จับเวลา 0.5 วินาที
            pressTimer = setTimeout(() => {
                isLongPress = true;
                startRecording();
            }, 500); 
        }

        function handlePressEnd(e) {
            if (e.cancelable) e.preventDefault();
            clearTimeout(pressTimer); // ยกเลิกจับเวลาทันที

            if (isLongPress) {
                // ถ้าเกิน 0.5 วิ -> หยุดอัด
                stopRecording();
            } else {
                // ถ้าปล่อยก่อน -> ถ่ายรูป
                if (!isRecording) {
                    takeScreenshot();
                }
            }
        }

        // รองรับ Touch (มือถือ)
        btn.addEventListener('touchstart', handlePressStart);
        btn.addEventListener('touchend', handlePressEnd);
        
        // รองรับ Mouse (คอมพิวเตอร์)
        btn.addEventListener('mousedown', handlePressStart);
        btn.addEventListener('mouseup', handlePressEnd);

    </script>
</body>
</html>
