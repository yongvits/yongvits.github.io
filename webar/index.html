<body>

<div id="ui">
  <button id="startAR">START AR</button>
  <button onclick="startRecord()">● REC</button>
  <button onclick="stopRecord()">■ STOP</button>
</div>

<script src="recorder.js"></script>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js';

const mindarThree = new window.MINDAR.IMAGE.MindARThree({
  container: document.body,
  imageTargetSrc: './targets.mind',
});

const { renderer, scene, camera } = mindarThree;

scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

const anchor = mindarThree.addAnchor(0);

const loader = new GLTFLoader();
loader.load('./model/product.glb', gltf => {
  gltf.scene.scale.set(0.5, 0.5, 0.5);
  anchor.group.add(gltf.scene);
});

document.getElementById("startAR").addEventListener("click", async () => {
  document.getElementById("startAR").style.display = "none";

  await mindarThree.start(); // 👈 ต้องอยู่ใน click เท่านั้น
  renderer.setAnimationLoop(() => {
    renderer.render(scene, camera);
  });
});
</script>

</body>
