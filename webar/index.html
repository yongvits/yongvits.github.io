<script>
const btn = document.getElementById("startAR");

btn.onclick = async function () {
  console.log("BUTTON CLICK");

  try {
    // 🔑 ขอ permission กล้องตรง ๆ
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });

    console.log("CAMERA PERMISSION OK");

    // ปิด stream ทิ้ง (MindAR จะเปิดใหม่)
    stream.getTracks().forEach(track => track.stop());

    startMindAR();

  } catch (e) {
    alert("ไม่สามารถเปิดกล้องได้\nกรุณาอนุญาต Camera");
    console.error(e);
  }
};

function startMindAR() {
  const mindarThree = new window.MINDAR.IMAGE.MindARThree({
    container: document.body,
    imageTargetSrc: './targets.mind'
  });

  const { renderer, scene, camera } = mindarThree;
  scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

  const anchor = mindarThree.addAnchor(0);
  const loader = new THREE.GLTFLoader();
  loader.load('./model/product.glb', gltf => {
    gltf.scene.scale.set(0.5, 0.5, 0.5);
    anchor.group.add(gltf.scene);
  });

  mindarThree.start().then(() => {
    console.log("MINDAR STARTED");
    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });
  });
}
</script>
