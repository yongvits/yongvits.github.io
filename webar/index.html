<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR Multi-Target</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; }
        #record-btn {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 80px; height: 80px; background-color: white; border: 4px solid #ccc;
            border-radius: 50%; z-index: 1000; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            user-select: none; -webkit-user-select: none; touch-action: none; 
        }
        #record-btn::after {
            content: ''; width: 60px; height: 60px; background-color: #ff3b30;
            border-radius: 50%; transition: all 0.2s;
        }
        #record-btn.recording::after {
            width: 30px; height: 30px; border-radius: 4px; 
        }
        #status-text {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%);
            color: white; background: rgba(0,0,0,0.5); padding: 5px 10px;
            border-radius: 10px; font-family: sans-serif; font-size: 14px;
            pointer-events: none; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="status-text">Scan 4 Images!</div>
    <div id="record-btn"></div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 4; filterMinCF:0.0001; filterBeta: 0.001;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights; preserveDrawingBuffer: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <a-asset-item id="model-1" src="./model/product.glb"></a-asset-item>
            </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <a-entity mindar-image-target="targetIndex: 0">
            <a-gltf-model src="#model-1" rotation="-90 0 0" position="0 0 0" scale="1 1 1" animation-mixer></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 1">
            <a-gltf-model src="#model-1" rotation="-90 0 0" position="0 0 0" scale="1 1 1" animation-mixer></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 2">
            <a-gltf-model src="#model-1" rotation="-90 0 0" position="0 0 0" scale="1 1 1" animation-mixer></a-gltf-model>
        </a-entity>

        <a-entity mindar-image-target="targetIndex: 3">
            <a-gltf-model src="#model-1" rotation="-90 0 0" position="0 0 0" scale="1 1 1" animation-mixer></a-gltf-model>
        </a-entity>

    </a-scene>

    <script>
        const btn = document.getElementById('record-btn');
        const statusText = document.getElementById('status-text');
        const scene = document.querySelector('a-scene');
        let mediaRecorder; let recordedChunks = []; let pressTimer;
        let isLongPress = false; let isRecording = false;

        async function saveToPhotos(blob, filename, mimeType) {
            const file = new File([blob], filename, { type: mimeType });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: filename });
                    showStatus("Saved via Share Sheet 📲");
                } catch (e) {
                    showStatus("Share Canceled"); 
                }
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click();
                document.body.removeChild(a); URL.revokeObjectURL(url);
                showStatus("Downloaded 📥");
            }
        }

        function takeScreenshot() {
            const canvas = scene.components.screenshot.getCanvas('perspective');
            canvas.toBlob(async (blob) => {
                if (!blob) return;
                showStatus("Saving Image... 💾");
                await saveToPhotos(blob, `ar-photo-${Date.now()}.png`, "image/png");
            }, "image/png");
        }

        function startRecording() {
            const canvas = scene.canvas;
            const stream = canvas.captureStream(30); 
            let mimeType = 'video/webm'; 
            if (MediaRecorder.isTypeSupported('video/mp4')) { mimeType = 'video/mp4'; } 
            else if (MediaRecorder.isTypeSupported('video/webm;codecs=h264')) { mimeType = 'video/webm;codecs=h264'; }

            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: mimeType });
                mediaRecorder.ondataavailable = (event) => { if (event.data.size > 0) recordedChunks.push(event.data); };
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: mimeType });
                    recordedChunks = []; 
                    showStatus("Saving Video... 💾");
                    let extension = mimeType.includes('mp4') ? 'mp4' : 'webm';
                    await saveToPhotos(blob, `ar-video-${Date.now()}.${extension}`, mimeType);
                };
                mediaRecorder.start(); isRecording = true;
                btn.classList.add("recording"); showStatus("Recording... 🔴");
            } catch (e) {
                console.error("Recording Error:", e); showStatus("Error ❌");
                isRecording = false; btn.classList.remove("recording");
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') { mediaRecorder.stop(); }
            isRecording = false; btn.classList.remove("recording");
        }

        function showStatus(text) {
            statusText.innerText = text;
            setTimeout(() => { if(!isRecording) statusText.innerText = "Tap to Snap / Hold to Record"; }, 3000);
        }

        function handlePressStart(e) {
            if (e.cancelable) e.preventDefault(); isLongPress = false;
            pressTimer = setTimeout(() => { isLongPress = true; startRecording(); }, 500); 
        }

        function handlePressEnd(e) {
            if (e.cancelable) e.preventDefault(); clearTimeout(pressTimer); 
            if (isLongPress) { stopRecording(); } else { if (!isRecording) { takeScreenshot(); } }
        }

        btn.addEventListener('touchstart', handlePressStart); btn.addEventListener('touchend', handlePressEnd);
        btn.addEventListener('mousedown', handlePressStart); btn.addEventListener('mouseup', handlePressEnd);
    </script>
</body>
</html>
