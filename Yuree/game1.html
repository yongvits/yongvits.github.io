<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมกำจัดมอดในกระสอบข้าวสาร - Fullscreen</title>
    <!-- นำเข้า Tailwind CSS สำหรับสไตล์ UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            margin: 0;
            overflow: hidden;
            background-color: #1a0d05;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden relative">

    <!-- ส่วนแสดงหน้าจอโหลดดิ้ง (Loading Screen) -->
    <div id="loading-screen" class="absolute inset-0 bg-[#3a1c0e] flex flex-col justify-center items-center z-50 transition-opacity duration-500">
        <div class="animate-pulse mb-4 text-6xl">🌾🐜🌾</div>
        <h1 class="text-2xl font-extrabold text-amber-100 tracking-wider text-center px-4">กำลังเทข้าวสารแบบเต็มกระสอบ...</h1>
        <p class="text-amber-200/60 mt-2 text-xs text-center">จัดวางตำแหน่งตัวมอดแบบกระจายตัวสมบูรณ์แบบ</p>
    </div>

    <!-- Canvas แสดงผลเกมหลักแบบเต็มหน้าจอ (Fullscreen Play Area) -->
    <canvas id="game-canvas"></canvas>

    <!-- กล่องแสดงสถานะและปุ่มรีสตาร์ทแบบลอยตัวขนาดเล็ก (Mini Floating HUD inside play area) -->
    <div class="absolute top-4 left-4 z-10 flex items-center gap-2 pointer-events-none">
        <!-- ตัวนับจำนวนมอดแบบมินิ -->
        <div class="bg-black/70 backdrop-blur-md border border-white/10 px-3.5 py-1.5 rounded-full shadow-lg flex items-center gap-2 pointer-events-auto text-xs md:text-sm">
            <span class="text-base animate-bounce">🐜</span>
            <span class="font-bold text-amber-300">เหลือ:</span>
            <span class="font-black text-white"><span id="remaining-count" class="text-amber-400 text-sm md:text-base">0</span> / <span id="total-count">0</span> ตัว</span>
        </div>

        <!-- ปุ่มรีสตาร์ทแบบไอคอนวงกลมขนาดเล็ก (Mini Circular Restart Button) -->
        <button id="btn-restart" title="เริ่มใหม่" class="bg-black/70 hover:bg-amber-950/80 active:scale-90 border border-white/10 w-8 h-8 rounded-full shadow-lg flex items-center justify-center pointer-events-auto transition text-xs">
            🔄
        </button>
    </div>

    <!-- แถบแนะนำการเล่นขนาดเล็กกะทัดรัดที่มุมขวาบน -->
    <div class="absolute top-4 right-4 z-10 bg-black/45 backdrop-blur-sm px-3 py-1.5 rounded-full text-[10px] md:text-xs text-amber-200/90 pointer-events-none shadow-sm">
        💡 แตะตัวมอดเพื่อกำจัด
    </div>

    <!-- ป๊อปอัปเมื่อชนะเกม (Victory Modal) -->
    <div id="victory-modal" class="absolute inset-0 bg-amber-950/90 backdrop-blur-md flex flex-col justify-center items-center z-40 hidden transition-all duration-500 px-6">
        <div class="bg-gradient-to-b from-amber-900 to-amber-950 p-8 rounded-3xl border border-amber-500/30 shadow-2xl text-center max-w-sm w-full relative overflow-hidden">
            <div class="text-6xl mb-3 animate-bounce">🌾🏆✨</div>
            <h2 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-amber-400">กำจัดมอดหมดเกลี้ยง!</h2>
            <p class="text-amber-100 mt-2 text-sm">คุณกำจัดตัวมอดทั้งหมด <span id="victory-total" class="font-bold text-amber-300 text-base">0</span> ตัว ได้สำเร็จ!</p>
            
            <div class="mt-5 flex flex-col space-y-2">
                <button id="btn-play-again" class="bg-gradient-to-r from-amber-500 to-amber-700 hover:from-amber-400 hover:to-amber-600 font-bold py-3 px-6 rounded-xl shadow-lg transition duration-200 active:scale-95 text-sm text-white">
                    เริ่มใหม่อีกครั้ง 🌾
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- ระบบเสียงสังเคราะห์ผ่าน Web Audio API ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSquishSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playVictorySound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const melody = [261.63, 329.63, 392.00, 523.25, 659.25];
            melody.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.08);
                
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.08 + 0.25);
                
                osc.start(audioCtx.currentTime + i * 0.08);
                osc.stop(audioCtx.currentTime + i * 0.08 + 0.3);
            });
        }

        // --- ตั้งค่าระบบ Canvas ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // ข้อมูลตัวแปรหลัก
        let weevils = [];
        let particles = [];
        let initialWeevilCount = 45; 
        let remainingCount = 45;

        // ระบบ Canvas สำรองสำหรับวาดพื้นหลังล่วงหน้าเพื่อความลื่นไหลระดับสูง (60FPS)
        const bgCanvas = document.createElement('canvas');
        const bgCtx = bgCanvas.getContext('2d');
        const fgCanvas = document.createElement('canvas');
        const fgCtx = fgCanvas.getContext('2d');

        let riceGrains = [];

        // --- สุ่มสร้างข้อมูลข้าวสารแบบหนาแน่นพิเศษครอบคลุมพื้นที่ฟูลสกรีน ---
        function generateRiceGrains(width, height) {
            riceGrains = [];
            // คำนวณความหนาแน่นให้สัมพันธ์กับความกว้างคูณความสูงของหน้าจอสัมผัสจริง
            const totalGrains = Math.floor((width * height) / 38); 
            
            const shades = [
                '#ffffff', // ขาวสว่างมะลิ
                '#fefcf6', // ขาวนวลสะอาด
                '#fcf8ea', // ขาวนวลมีแสงเงา
                '#f6edd2', // ขาวเหลืองอบอุ่น
                '#f0e6c7', // ขาวเก่าปนจางๆ
                '#eae0bd', // สีข้าวหักชั้นล่างช่วยบังพื้นหลัง
                '#ded4b0'  // สีเงาข้าวชั้นล่างสุด
            ];

            for (let i = 0; i < totalGrains; i++) {
                riceGrains.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    rx: 7.0 + Math.random() * 4.5, // ความยาวเมล็ดข้าวสาร
                    ry: 2.5 + Math.random() * 1.3, // ความหนาเมล็ดข้าวสาร
                    rot: Math.random() * Math.PI * 2,
                    shade: shades[Math.floor(Math.random() * shades.length)],
                    isForeground: Math.random() < 0.22 // 22% วาดไว้เลเยอร์หน้าสุดเพื่อทับตัวมอด
                });
            }
        }

        // --- สั่งวาดเม็ดข้าวสารสะสมลงใน Canvas สำรอง ---
        function renderOffscreenRice() {
            if (canvas.width <= 0 || canvas.height <= 0) return;

            bgCanvas.width = canvas.width;
            bgCanvas.height = canvas.height;
            fgCanvas.width = canvas.width;
            fgCanvas.height = canvas.height;

            // เทสีพื้นหลังเป็นกระสอบป่าน
            bgCtx.fillStyle = '#b09477'; 
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            
            // วาดลายเส้นถักทอของใยกระสอบป่านเพื่อความสมจริง
            bgCtx.strokeStyle = 'rgba(92, 64, 51, 0.2)';
            bgCtx.lineWidth = 1.2;
            const step = 8;
            for (let x = 0; x < bgCanvas.width; x += step) {
                bgCtx.beginPath();
                bgCtx.moveTo(x, 0);
                bgCtx.lineTo(x, bgCanvas.height);
                bgCtx.stroke();
            }
            for (let y = 0; y < bgCanvas.height; y += step) {
                bgCtx.beginPath();
                bgCtx.moveTo(0, y);
                bgCtx.lineTo(bgCanvas.width, y);
                bgCtx.stroke();
            }

            fgCtx.clearRect(0, 0, fgCanvas.width, fgCanvas.height);

            // วาดเมล็ดข้าวทั้งหมด
            riceGrains.forEach(g => {
                const targetCtx = g.isForeground ? fgCtx : bgCtx;
                drawRiceGrain(targetCtx, g);
            });
        }

        // --- ฟังก์ชันวาดเม็ดข้าวเดี่ยว ---
        function drawRiceGrain(targetCtx, g) {
            targetCtx.save();
            targetCtx.translate(g.x, g.y);
            targetCtx.rotate(g.rot);
            
            // วาดเงาของข้าวสร้างสัมผัสความลึก 3 มิติ
            targetCtx.shadowColor = 'rgba(42, 28, 12, 0.3)';
            targetCtx.shadowBlur = 2.5;
            targetCtx.shadowOffsetX = 1.0;
            targetCtx.shadowOffsetY = 1.0;

            targetCtx.fillStyle = g.shade;
            targetCtx.beginPath();
            
            targetCtx.moveTo(-g.rx, 0);
            targetCtx.quadraticCurveTo(0, -g.ry, g.rx, 0);
            targetCtx.quadraticCurveTo(0, g.ry, -g.rx, 0);
            targetCtx.closePath();
            targetCtx.fill();

            // ไฮไลท์แสงสีขาวตกกระทบ
            targetCtx.shadowColor = 'transparent';
            targetCtx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            targetCtx.beginPath();
            targetCtx.ellipse(-g.rx * 0.25, -g.ry * 0.35, g.rx * 0.35, g.ry * 0.18, 0.1, 0, Math.PI * 2);
            targetCtx.fill();

            targetCtx.restore();
        }

        // --- ระบบสุ่มเกิดตัวมอดแบบกระจายตัว 100% ไม่ทับซ้อนเกาะกลุ่มกัน ---
        function spawnWeevils(count) {
            weevils = [];
            remainingCount = count;
            document.getElementById('remaining-count').innerText = count;
            document.getElementById('total-count').innerText = count;

            const w = canvas.width > 0 ? canvas.width : window.innerWidth;
            const h = canvas.height > 0 ? canvas.height : window.innerHeight;
            const padding = 35; // ขอบเขตที่ปลอดภัยจากขอบจอสุด

            // ประเมินระยะห่างความหนาแน่นที่เหมาะสมเพื่อการกระจายตัวที่ดีที่สุด
            const playableArea = (w - padding * 2) * (h - padding * 2);
            let minDistance = Math.sqrt(playableArea / count) * 0.85;
            minDistance = Math.min(minDistance, 100); // กำหนดค่าห่างสูงสุดไม่ให้บีบพื้นที่เกินไป

            for (let i = 0; i < count; i++) {
                let spawnX = 0;
                let spawnY = 0;
                let attempts = 0;
                let tooClose = true;

                while (tooClose && attempts < 200) {
                    spawnX = padding + Math.random() * (w - padding * 2);
                    spawnY = padding + Math.random() * (h - padding * 2);
                    tooClose = false;

                    // วัดระยะห่างจากมอดตัวอื่นๆ ที่สปอนลงไปก่อนแล้วเพื่อไม่ให้เกิดกระจุกร่วมกลุ่ม
                    for (let j = 0; j < weevils.length; j++) {
                        const other = weevils[j];
                        const dist = Math.hypot(spawnX - other.x, spawnY - other.y);
                        if (dist < minDistance) {
                            tooClose = true;
                            break;
                        }
                    }

                    attempts++;
                    // ค่อยๆ ลดข้อจำกัดลงเล็กน้อยในกรณีที่จอแคบมากและมอดล้นพื้นที่
                    if (attempts % 45 === 0) {
                        minDistance *= 0.85;
                    }
                }

                weevils.push({
                    x: spawnX,
                    y: spawnY,
                    vx: (Math.random() - 0.5) * 1.2,
                    vy: (Math.random() - 0.5) * 1.2,
                    baseSpeed: 0.35 + Math.random() * 0.55,
                    scurryTimer: 0, 
                    size: 10 + Math.random() * 4, 
                    rotation: Math.random() * Math.PI * 2,
                    legsPhase: Math.random() * 100, 
                    opacity: 1,
                    isDying: false,
                    scale: 1,
                    changeDirTimer: Math.random() * 100
                });
            }
        }

        // --- วาดลักษณะและรูปร่างของมอด (2D Vector Drawing) ---
        function drawWeevil(w) {
            ctx.save();
            ctx.translate(w.x, w.y);
            ctx.rotate(w.rotation);
            ctx.scale(w.scale, w.scale);
            ctx.globalAlpha = w.opacity;

            const size = w.size;

            // เงาตกกระทบพื้นข้าว
            ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 1.5;
            ctx.shadowOffsetY = 2.5;

            // วาดขา 6 ขาพร้อมแอนิเมชันขยับจังหวะเดินสลับ
            ctx.strokeStyle = '#1b0d05'; 
            ctx.lineWidth = size * 0.12;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const legWiggle = Math.sin(w.legsPhase) * 0.45;
            
            for (let i = -1; i <= 1; i += 2) { 
                // ขาคู่หน้า
                ctx.beginPath();
                ctx.moveTo(0, -size * 0.1);
                ctx.lineTo(i * size * 0.8, -size * 0.45 + (legWiggle * i));
                ctx.stroke();

                // ขาคู่กลาง
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(i * size * 0.9, (legWiggle * -i));
                ctx.stroke();

                // ขาคู่หลัง
                ctx.beginPath();
                ctx.moveTo(0, size * 0.25);
                ctx.lineTo(i * size * 0.8, size * 0.55 + (legWiggle * i));
                ctx.stroke();
            }

            ctx.shadowColor = 'transparent';

            // ส่วนท้อง (Abdomen)
            ctx.fillStyle = '#5c2d16'; 
            ctx.beginPath();
            ctx.ellipse(0, size * 0.15, size * 0.45, size * 0.65, 0, 0, Math.PI * 2);
            ctx.fill();

            // ลายปล้องแนวขวางของท้อง
            ctx.strokeStyle = '#32180b';
            ctx.lineWidth = size * 0.055;
            for (let offset = -0.1; offset <= 0.5; offset += 0.25) {
                ctx.beginPath();
                ctx.arc(0, size * (offset - 0.1), size * 0.38, 0.1, Math.PI - 0.1);
                ctx.stroke();
            }

            // อกมอด (Thorax)
            ctx.fillStyle = '#3a1c0e'; 
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.35, size * 0.35, size * 0.3, 0, 0, Math.PI * 2);
            ctx.fill();

            // ส่วนหัว (Head)
            ctx.fillStyle = '#210f07';
            ctx.beginPath();
            ctx.ellipse(0, -size * 0.62, size * 0.18, size * 0.18, 0, 0, Math.PI * 2);
            ctx.fill();

            // งวงมอดอันยาวที่เป็นเอกลักษณ์ (Long Snout)
            ctx.strokeStyle = '#210f07';
            ctx.lineWidth = size * 0.09;
            ctx.beginPath();
            ctx.moveTo(0, -size * 0.68);
            ctx.lineTo(0, -size * 1.25);
            ctx.stroke();

            // หนวดหักงอสองข้าง (Antennae)
            ctx.lineWidth = size * 0.045;
            ctx.strokeStyle = '#3a1c0e';
            // หนวดซ้าย
            ctx.beginPath();
            ctx.moveTo(-size * 0.04, -size * 0.85);
            ctx.lineTo(-size * 0.25, -size * 0.95);
            ctx.lineTo(-size * 0.32, -size * 0.78);
            ctx.stroke();
            // หนวดขวา
            ctx.beginPath();
            ctx.moveTo(size * 0.04, -size * 0.85);
            ctx.lineTo(size * 0.25, -size * 0.95);
            ctx.lineTo(size * 0.32, -size * 0.78);
            ctx.stroke();

            ctx.restore();
        }

        // --- ระบบผงรำแป้งและเศษข้าวสารกระจายเมื่อกำจัดมอด (Squish Particles) ---
        function createSquishParticles(x, y) {
            const count = 18;
            const colors = ['#4a2411', '#7d4526', '#c9a175', '#fcfaf2']; 
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: 1.5 + Math.random() * 3.5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 1.0,
                    decay: 0.03 + Math.random() * 0.04
                });
            }
        }

        // --- อัปเดตพิกัดแรงผลักและพฤติกรรมมอด (Weevil AI Update) ---
        function update() {
            // อัลกอริทึม 'แรงผลักระยะห่างทางกายภาพ' (Social Distancing / Anti-Clumping Force)
            // คอยช่วยผลักมอดออกจากกันเบาๆ ตลอดเวลาการเล่น เพื่อให้พวกมันกระจายตัวทั่วหน้าจอ ไม่ทับถมรวมกัน
            for (let i = 0; i < weevils.length; i++) {
                const w1 = weevils[i];
                if (w1.isDying) continue;

                for (let j = i + 1; j < weevils.length; j++) {
                    const w2 = weevils[j];
                    if (w2.isDying) continue;

                    const dx = w2.x - w1.x;
                    const dy = w2.y - w1.y;
                    const dist = Math.hypot(dx, dy);
                    const personalSpace = (w1.size + w2.size) * 1.5; // รัศมีขอบเขตพื้นที่ปลอดภัย

                    if (dist < personalSpace && dist > 0) {
                        const force = (personalSpace - dist) / personalSpace * 0.12;
                        const pushX = (dx / dist) * force;
                        const pushY = (dy / dist) * force;

                        w1.vx -= pushX;
                        w1.vy -= pushY;
                        w2.vx += pushX;
                        w2.vy += pushY;
                    }
                }
            }

            // คำนวณความเร็วและการขยับขา
            weevils.forEach(w => {
                if (w.isDying) {
                    w.scale -= 0.14;
                    w.opacity -= 0.14;
                    if (w.scale <= 0) {
                        const idx = weevils.indexOf(w);
                        if (idx !== -1) weevils.splice(idx, 1);
                    }
                    return;
                }

                w.changeDirTimer--;
                if (w.changeDirTimer <= 0) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = w.scurryTimer > 0 ? w.baseSpeed * 2.8 : w.baseSpeed;
                    w.vx = Math.cos(angle) * speed;
                    w.vy = Math.sin(angle) * speed;
                    w.changeDirTimer = 60 + Math.random() * 90;
                }

                if (w.scurryTimer > 0) {
                    w.scurryTimer--;
                }

                const currentSpeed = Math.sqrt(w.vx * w.vx + w.vy * w.vy);
                if (currentSpeed > 0.05) {
                    w.legsPhase += currentSpeed * 0.45;
                    w.rotation = Math.atan2(w.vy, w.vx) + Math.PI / 2;
                }

                w.x += w.vx;
                w.y += w.vy;

                // ชนกระสอบ/ขอบจอแล้วเลี้ยวโค้งกลับ
                const pad = w.size;
                if (w.x < pad) { w.x = pad; w.vx *= -1; w.changeDirTimer = 0; }
                if (w.x > canvas.width - pad) { w.x = canvas.width - pad; w.vx *= -1; w.changeDirTimer = 0; }
                if (w.y < pad) { w.y = pad; w.vy *= -1; w.changeDirTimer = 0; }
                if (w.y > canvas.height - pad) { w.y = canvas.height - pad; w.vy *= -1; w.changeDirTimer = 0; }
            });

            // อัปเดตสะเก็ดฝุ่นรำข้าว
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.91; 
                p.vy *= 0.91;
                p.life -= p.decay;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // --- ลูปการเรนเดอร์ในแต่ละเฟรม (Draw Call) ---
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (canvas.width <= 0 || canvas.height <= 0) return;

            // 1. วาดเลเยอร์ข้าวพื้นหลังหนาปึก
            ctx.drawImage(bgCanvas, 0, 0);

            // 2. วาดตัวมอด (กระจายตัวสมบูรณ์)
            weevils.forEach(w => drawWeevil(w));

            // 3. วาดเมล็ดข้าวเลเยอร์หน้านำมาบดบังส่วนท้องมอดเพื่อความกลมกลืนเชิงลึก
            ctx.drawImage(fgCanvas, 0, 0);

            // 4. วาดฝุ่นรำข้าวบดกระจาย
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0; 
        }

        // --- ตรวจสอบพิกัดการจิ้มบี้ตัวมอด (Touch Interface) ---
        function handleInput(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            // แมปค่าสัมผัสพิกัดอินพุตให้สอดรับกับขนาดของพื้นที่ Canvas จริงอย่างเที่ยงตรง
            const tapX = (clientX - rect.left) * (canvas.width / rect.width);
            const tapY = (clientY - rect.top) * (canvas.height / rect.height);

            let hitDetected = false;

            for (let i = weevils.length - 1; i >= 0; i--) {
                const w = weevils[i];
                if (w.isDying) continue;

                const dist = Math.hypot(w.x - tapX, w.y - tapY);
                const hitRadius = w.size * 2.3; // เพิ่มอัตราความแม่นยำในการสัมผัสช่วยให้จิ้มโดนได้ง่าย

                if (dist < hitRadius) {
                    w.isDying = true;
                    w.vx = 0;
                    w.vy = 0;
                    
                    createSquishParticles(w.x, w.y);
                    playSquishSound();

                    remainingCount--;
                    document.getElementById('remaining-count').innerText = remainingCount;

                    hitDetected = true;

                    if (remainingCount <= 0) {
                        triggerVictory();
                    }
                    break; 
                }
            }

            // จิ้มพลาดเฉียดๆ ทำให้มอดที่อยู่ในแนวรัศมีตกใจตื่นกลัวและเร่งฝีเท้าวิ่งเตลิดออกจากจุดสัมผัส
            if (!hitDetected) {
                weevils.forEach(w => {
                    const dist = Math.hypot(w.x - tapX, w.y - tapY);
                    if (dist < 110 && !w.isDying) {
                        const angle = Math.atan2(w.y - tapY, w.x - tapX) + (Math.random() - 0.5) * 0.7;
                        w.scurryTimer = 160;
                        w.vx = Math.cos(angle) * w.baseSpeed * 3.2;
                        w.vy = Math.sin(angle) * w.baseSpeed * 3.2;
                        w.changeDirTimer = 160; 
                    }
                });
            }
        }

        // --- ชนะเกมและแสดงผลสรุป (Victory Phase) ---
        function triggerVictory() {
            playVictorySound();
            setTimeout(() => {
                const modal = document.getElementById('victory-modal');
                document.getElementById('victory-total').innerText = initialWeevilCount;
                modal.classList.remove('hidden');
            }, 500);
        }

        // --- ปรับขนาดข้าวสารและ Canvas ให้สมบูรณ์แบบเต็มพิกัดจอ (Robust Fullscreen Resize) ---
        function resizeGame() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            canvas.width = width;
            canvas.height = height;

            // เทข้าวสารใหม่ให้เรียงสวยงามสะใจทั่วผืนจอตามพิกัด
            generateRiceGrains(width, height);
            renderOffscreenRice();
        }

        // --- การจัดวางพิกัดมอดใหม่กรณีผู้เล่นเอียงหมุนหน้าจอโทรศัพท์มือถือ ---
        function handleResize() {
            const oldWidth = canvas.width;
            const oldHeight = canvas.height;

            resizeGame();

            if (oldWidth > 0 && oldHeight > 0) {
                const scaleX = canvas.width / oldWidth;
                const scaleY = canvas.height / oldHeight;

                // อัปเดตพิกัดตัวมอดปัจจุบันให้กระจายขยายตัวตามขอบใหม่โดยไม่ผิดเพี้ยนไปกองกัน
                weevils.forEach(w => {
                    w.x *= scaleX;
                    w.y *= scaleY;
                    w.x = Math.max(w.size, Math.min(canvas.width - w.size, w.x));
                    w.y = Math.max(w.size, Math.min(canvas.height - w.size, w.y));
                });
            }
        }

        // --- ลูปการขับเคลื่อนแอนิเมชัน (Main Game Loop) ---
        function loop() {
            // ระบบตรวจสอบความปลอดภัยหาก Canvas เสียสมมาตร ให้จัดระเบียบใหม่ทันที
            if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
                resizeGame();
            }

            update();
            render();
            requestAnimationFrame(loop);
        }

        // --- เริ่มต้นกิจกรรมแผงควบคุมหลัก ---
        function setupGame() {
            resizeGame();
            spawnWeevils(initialWeevilCount);
        }

        // ลิงก์ช่องทางการแตะอินพุตแบบไร้แรงหน่วง
        canvas.addEventListener('mousedown', (e) => {
            handleInput(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches && e.touches.length > 0) {
                handleInput(e.touches[0].clientX, e.touches[0].clientY);
                e.preventDefault(); 
            }
        }, { passive: false });

        // ปุ่มคำสั่งย่อยเริ่มเล่นใหม่ใน HUD กล่องมินิ
        document.getElementById('btn-restart').addEventListener('click', () => {
            spawnWeevils(initialWeevilCount);
        });

        document.getElementById('btn-play-again').addEventListener('click', () => {
            document.getElementById('victory-modal').classList.add('hidden');
            spawnWeevils(initialWeevilCount);
        });

        window.addEventListener('resize', handleResize);

        // รอจนเว็บบอร์ดโหลดทรัพยากรพื้นผิวเสร็จสิ้น
        window.addEventListener('load', () => {
            setupGame();
            
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                if (ls) {
                    ls.classList.add('opacity-0');
                    setTimeout(() => ls.style.display = 'none', 500);
                }
            }, 600);

            loop();
        });
    </script>
</body>
</html>
