<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>AI Food Scanner</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <div class="header">
      <h1>🍱 AI Food Scanner</h1>
      <p>ถ่ายรูปอาหารเพื่อคำนวณแคลอรี่</p>
    </div>

    <label class="camera-btn">
      📸 Open Camera
      <input
        type="file"
        id="imageInput"
        accept="image/*"
        capture="environment"
      />
    </label>

    <div class="preview-wrap">
      <img id="preview" />
    </div>

    <button id="analyzeBtn">
      Analyze Calories
    </button>

    <div id="loading" class="loading hidden">
      🔍 AI กำลังวิเคราะห์อาหาร...
    </div>

    <div id="result" class="result"></div>

  </div>

  <script src="script.js"></script>

</body>
</html>
